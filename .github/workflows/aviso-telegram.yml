name: Aviso diario por Telegram

on:
  schedule:
    # GitHub demora o descarta tareas programadas en punto (hora pico), así que hay tres
    # intentos fuera del pico. El primero que corre manda el aviso; los otros ven que ya
    # salió y no mandan nada. Horas en UTC: 11:47, 12:17 y 12:47 = 8:47, 9:17 y 9:47 en Argentina.
    - cron: '47 11 * * *'
    - cron: '17 12 * * *'
    - cron: '47 12 * * *'
  workflow_dispatch: {}     # botón "Run workflow" para probarlo a mano (siempre manda)

permissions:
  contents: read
  actions: read             # para ver si el aviso de hoy ya salió

concurrency:
  group: aviso-telegram     # nunca dos al mismo tiempo
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mandar el aviso
        run: node aviso/aviso-telegram.js
        env:
          TZ: America/Argentina/Buenos_Aires
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEGOCIO_CODIGO: ${{ secrets.NEGOCIO_CODIGO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
