function modal(html){$('#modal').innerHTML=`<div class="ovl" id="ovl"><div class="sheet">
  <button class="x" id="mx">✕</button>${html}</div></div>`;
  $('#mx').onclick=closeModal;
  $('#ovl').onclick=e=>{if(e.target.id==='ovl')closeModal();};}
function closeModal(){$('#modal').innerHTML='';}

function formCliente(id){
  const c=id?client(id):{tipo:'persona'};
  modal(`<h3>${id?'Editar':'Nuevo'} cliente</h3>
  <label>Tipo</label>
  <div class="seg" id="f-tipo">
    <button data-v="persona" class="${c.tipo!=='comercio'?'on':''}">👤 Persona</button>
    <button data-v="comercio" class="${c.tipo==='comercio'?'on':''}">🏪 Comercio</button>
  </div>
  <label>Nombre completo / Razón social *</label><input id="f-nombre" value="${esc(c.nombre||'')}">
  <label>Teléfono (con código de país para WhatsApp)</label><input id="f-tel" inputmode="tel" placeholder="549351..." value="${esc(c.telefono||'')}">
  <div class="frow"><div><label>DNI / CUIT</label><input id="f-dni" value="${esc(c.dni||'')}"></div></div>
  <label>Dirección</label><input id="f-dir" value="${esc(c.direccion||'')}">
  <label>Perfil de Facebook (link o usuario)</label><input id="f-fb" inputmode="url" placeholder="facebook.com/usuario" value="${esc(c.facebook||'')}">
  <label>Notas</label><textarea id="f-notas">${esc(c.notas||'')}</textarea>
  ${esSocio()?'':`<label>Gestionado por</label>
  <select id="f-gestor"><option value="">Yo (el dueño)</option>
    ${(S.settings.socios||[]).map(x=>`<option value="${x.id}" ${c.gestorId===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>
  <div class="hint">Si lo asignás a un socio, ese cliente aparece en su cuenta. Si tiene préstamos <b>en curso</b>, la app te va a preguntar si también se los pasás. Los préstamos ya terminados no se tocan nunca.</div>`}
  <button class="btn" id="f-save" style="margin-top:18px">Guardar cliente</button>`);
  let tipo=c.tipo||'persona';
  $$('#f-tipo button').forEach(b=>b.onclick=()=>{tipo=b.dataset.v;
    $$('#f-tipo button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#f-save').onclick=()=>{
    const nombre=$('#f-nombre').value.trim();
    if(!nombre)return alert('Poné el nombre del cliente');
    const obj=id?{...c}:{id:uid(),createdAt:Date.now()};
    Object.assign(obj,{nombre,tipo,telefono:$('#f-tel').value.trim(),dni:$('#f-dni').value.trim(),
      direccion:$('#f-dir').value.trim(),facebook:$('#f-fb').value.trim(),notas:$('#f-notas').value.trim()});
    // el socio solo puede crear clientes suyos; el dueño elige a quién asignarlo
    const gestorAntes=c.gestorId||null;
    if(esSocio())obj.gestorId=SESSION.socioId;
    else{const g=$('#f-gestor');obj.gestorId=g&&g.value?g.value:null;}
    saveClient(obj);
    // si el dueño cambió de gestor, los préstamos EN CURSO no se mueven solos: se los ofrecemos,
    // porque si no el socio ve el cliente pero sin sus préstamos. Los terminados quedan como están.
    if(id&&!esSocio()&&obj.gestorId!==gestorAntes){
      const pend=S.loans.filter(l=>l.clientId===obj.id&&l.status==='activo'&&l.gestorId!==(obj.gestorId||undefined));
      const cerrados=S.loans.filter(l=>l.clientId===obj.id&&l.status!=='activo').length;
      if(pend.length){
        const nom=obj.gestorId?socioNombre(obj.gestorId):null;
        const nota=cerrados?`\n\nLos ${cerrados} préstamo(s) ya terminados de este cliente no se tocan: quedan como están, con el reparto que tuvieron.`:'';
        const msg=obj.gestorId
          ?`Este cliente tiene ${pend.length} préstamo(s) en curso.\n\n¿Pasárselos también a ${nom} (${socioPct(obj.gestorId)}% de la ganancia para el socio)?\n\nSi decís que no, ${nom} va a ver al cliente pero sin esos préstamos.${nota}`
          :`Este cliente tiene ${pend.length} préstamo(s) en curso asignado(s) a un socio.\n\n¿Pasarlos también a tu nombre y sacarles el reparto de ganancia?${nota}`;
        if(confirm(msg)){
          const n=reasignarPrestamosDeCliente(obj.id,obj.gestorId);
          alert(`Listo ✅\n${n} préstamo(s) en curso ${obj.gestorId?'quedaron a nombre de '+nom:'volvieron a tu nombre'}.${cerrados?'\nLos ya terminados quedaron sin cambios.':''}`);
        }
      }
    }
    closeModal();go('clientes',obj.id);
  };
}

function fechaPrimerCobro(freq){ // el primer cobro cae un período después de entregar la plata
  return ymd(new Date(pd(todayStr()).getTime()+FREQ_DAYS[freq]*DAY));
}
function formSimulador(){
  modal(`<h3>🧮 Simulador de préstamos</h3>
  <div class="hint">Calculá al toque sin cargar nada. Probá montos, intereses y cuotas.</div>
  <div class="frow">
    <div><label>Monto a prestar</label><input id="sim-monto" type="number" inputmode="decimal" placeholder="100000"></div>
    <div><label>Interés %</label><input id="sim-int" type="number" inputmode="decimal" placeholder="30"></div>
  </div>
  <div class="frow">
    <div><label>Cant. de cuotas</label><input id="sim-n" type="number" inputmode="numeric" placeholder="30"></div>
    <div><label>Frecuencia</label><select id="sim-freq">
      <option value="diaria">Diaria</option><option value="semanal">Semanal</option><option value="quincenal">Quincenal</option></select></div>
  </div>
  <div id="sim-out"></div>
  <div class="btnrow" style="margin-top:16px">
    <button class="btn sec" id="sim-limpiar">Limpiar</button>
    <button class="btn" id="sim-crear" style="background:var(--gold);color:var(--onColor)">💵 Crear préstamo con estos datos</button>
  </div>`);
  const upd=()=>{
    const m=+$('#sim-monto').value||0,i=+$('#sim-int').value||0,n=+$('#sim-n').value||0,f=$('#sim-freq').value;
    const out=$('#sim-out');
    if(!m||!n){out.innerHTML='<div class="resume" style="margin-top:14px">Completá monto y cuotas para ver el cálculo.</div>';return;}
    const total=Math.round(m*(1+i/100)), ganancia=total-m;
    const cs=genCuotas(total,n,f,fechaPrimerCobro(f),false);
    const perDay={diaria:1,semanal:7,quincenal:14}[f]*n;
    out.innerHTML=`<div class="stats" style="grid-template-columns:repeat(3,1fr);margin:14px 0 6px">
      <div class="stat gold"><div class="lbl">Cada cuota</div><div class="val" style="font-size:18px">${fmt$(cs[0].monto)}</div></div>
      <div class="stat blue"><div class="lbl">Total a devolver</div><div class="val" style="font-size:18px">${fmt$(total)}</div></div>
      <div class="stat green"><div class="lbl">Ganancia</div><div class="val" style="font-size:18px">${fmt$(ganancia)}</div></div>
    </div>
    <div class="resume">
      ${n} cuotas ${{diaria:'diarias',semanal:'semanales',quincenal:'quincenales'}[f]} de <b>${fmt$(cs[0].monto)}</b>${cs[cs.length-1].monto!==cs[0].monto?` (la última: ${fmt$(cs[cs.length-1].monto)})`:''}<br>
      Ganás <b>${fmt$(ganancia)}</b> sobre ${fmt$(m)} prestados (interés ${i}%)<br>
      Cobrás desde ${dLong(cs[0].vence)} hasta ${dLong(cs[cs.length-1].vence)} (${perDay} días aprox.)
    </div>`;
  };
  ['sim-monto','sim-int','sim-n','sim-freq'].forEach(x=>$('#'+x).oninput=$('#'+x).onchange=upd);
  $('#sim-limpiar').onclick=()=>{['sim-monto','sim-int','sim-n'].forEach(x=>$('#'+x).value='');upd();};
  $('#sim-crear').onclick=()=>{
    const m=+$('#sim-monto').value||0,n=+$('#sim-n').value||0;
    if(!m||!n)return alert('Completá al menos monto y cantidad de cuotas.');
    if(!vClients().length){alert('Para crear un préstamo primero necesitás un cliente. Cargá uno y volvé a usar el simulador.');return;}
    formPrestamo(null,{monto:+$('#sim-monto').value||'',interes:+$('#sim-int').value||0,n:+$('#sim-n').value||'',freq:$('#sim-freq').value});
  };

function aplicarAcuerdo(l,monto,vence,nota,deudaAntes,nPagos,freq,skipDom){
  if(!l.acuerdo){ // guardamos el cronograma original una sola vez, para poder volver
    l.acuerdoPrev={cuotas:JSON.parse(JSON.stringify(l.cuotas)),total:l.total,status:l.status};
  }
  const base=l.acuerdoPrev?l.acuerdoPrev.cuotas:l.cuotas;
  // las cuotas con pagos quedan como historial, saldadas por lo que efectivamente entró
  const hist=base.filter(c=>(c.pagos||[]).length>0)
    .map(c=>({...c,monto:cPagadoBase(c),congelada:true,borde:undefined,esAcuerdo:undefined}));
  const cobradoBase=hist.reduce((a,c)=>a+c.monto,0);
  let n=hist.length?Math.max(...hist.map(c=>c.n))+1:1;
  // si ya había un acuerdo y el cliente pagó algo de él, esa plata se conserva y se
  // vuelve a aplicar sobre el plan nuevo (antes se perdía al editar el acuerdo)
  const pagosPrevios=cuotasAcuerdo(l).flatMap(c=>(c.pagos||[]).map(p=>({...p})));
  // el plan acordado: una o varias cuotas, con su frecuencia. Congeladas = sin mora,
  // pero con fecha propia, así entran en recordatorios, cobros del día y calendario.
  const nn=Math.max(1,Math.round(nPagos||1)), f=freq||'semanal';
  const nuevas=genCuotas(monto,nn,f,vence,f==='diaria'&&!!skipDom)
    .map(c=>({n:n++,vence:c.vence,monto:c.monto,pagos:[],congelada:true,esAcuerdo:true}));
  let idx=0;
  pagosPrevios.forEach(p=>{
    let resto=p.monto||0, primero=true;
    while(resto>0&&idx<nuevas.length){
      const c=nuevas[idx], falta=c.monto-cPagadoBase(c);
      if(falta<=0){idx++;continue;}
      const usa=Math.min(falta,resto);
      c.pagos.push(primero?{...p,monto:usa}:{t:p.t,monto:usa,mora:0,cobrador:0});
      resto-=usa; primero=false;
      if(usa>=falta)idx++;
    }
    // si sobró (el acuerdo nuevo es más chico que lo ya pagado), queda en la última cuota
    if(resto>0&&nuevas.length)nuevas[nuevas.length-1].pagos.push(
      primero?{...p,monto:resto}:{t:p.t,monto:resto,mora:0,cobrador:0});
  });
  l.cuotas=hist.concat(nuevas);
  l.total=cobradoBase+monto;
  l.acuerdo={monto,vence,nota:nota||'',t:Date.now(),antes:deudaAntes??monto,
    cuotas:nn,frecuencia:f,skipDom:!!(f==='diaria'&&skipDom)};
  saveLoan(l);
}
// las cuotas del plan acordado, en orden (para numerarlas 1/3, 2/3… en avisos y pantallas)
function cuotasAcuerdo(l){return (l.cuotas||[]).filter(c=>c.esAcuerdo);}
// "Cuota 3/20" para un préstamo normal, "Acuerdo 2/3" para un plan acordado
function etiquetaCuota(l,c){
  if(c.esAcuerdo){const a=cuotasAcuerdo(l);return `Acuerdo ${a.indexOf(c)+1}/${a.length}`;}
  return `Cuota ${c.n}/${l.cuotas.length}`;
}
function quitarAcuerdo(l){
  if(!l.acuerdoPrev)return;
  const post=(l.cuotas||[]).filter(c=>c.esAcuerdo).flatMap(c=>c.pagos||[]);
  l.cuotas=l.acuerdoPrev.cuotas; l.total=l.acuerdoPrev.total;
  // lo cobrado durante el acuerdo se reparte sobre las cuotas originales que seguían abiertas,
  // en orden y sin exceder cada una: si se volcara entero en una sola, el excedente se perdería
  let idx=0;
  post.forEach(p=>{
    let resto=p.monto||0;
    while(resto>0&&idx<l.cuotas.length){
      const c=l.cuotas[idx], falta=cRestante(c);
      if(falta<=0){idx++;continue;}
      const aplica=Math.min(falta,resto);
      c.pagos=(c.pagos||[]).concat([{t:p.t,monto:aplica,mora:0,cobrador:0,
        ...(p.comprobante?{comprobante:p.comprobante}:{})}]);
      resto-=aplica;
      if(cRestante(c)<=0)idx++;
    }
    // sobrantes y lo que en su momento fue mora/cobrador: se guardan como extra para no perder plata
    const extra=resto+(p.mora||0)+(p.cobrador||0);
    if(extra>0){const u=l.cuotas[l.cuotas.length-1];
      u.pagos=(u.pagos||[]).concat([{t:p.t,monto:0,mora:extra,cobrador:0}]);}
  });
  delete l.acuerdo; delete l.acuerdoPrev;
  marcarBordes(l);
  saveLoan(l);
}

function deshacerCobro(loanId,nCuota,tPago){
  const l=loan(loanId);if(!l)return;
  const c=l.cuotas.find(x=>x.n===nCuota);if(!c)return;
  const i=(c.pagos||[]).findIndex(p=>p.t===tPago);if(i<0)return;
  const p=c.pagos[i], total=(p.monto||0)+(p.mora||0)+(p.cobrador||0);
  const partes=[];
  if(p.monto>0)partes.push('cuota '+fmt$(p.monto));
  if(p.mora>0)partes.push('mora '+fmt$(p.mora));
  if(p.cobrador>0)partes.push('cobrador '+fmt$(p.cobrador));
  if(p.descuento>0)partes.push('descuento '+fmt$(p.descuento)+' (se anula)');
  const fecha=new Date(p.t).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
  if(!confirm(`¿Deshacer este cobro?\n\n${fmt$(total)} registrado el ${fecha}\n(${partes.join(' · ')})\n\nEsa plata vuelve a quedar pendiente y la mora se recalcula.`))return;
  const doc=p.comprobante?S.docs.find(d=>d.id===p.comprobante):null;
  c.pagos.splice(i,1);
  if(doc&&confirm('¿Borrar también el comprobante adjunto a ese cobro?'))delEntity('doc',doc);
  saveLoan(l); // recalcula el estado del préstamo (si estaba pagado, vuelve a activo)
  render();
  alert('Cobro deshecho ✅\nQuedan '+fmt$(cRestante(c))+' pendientes de esta cuota.');
}
// alVolver: si viene, se ejecuta al terminar o al cerrar (para volver al panel de recordatorios)
function formCobro(loanId,nCuota,alVolver){
  const l=loan(loanId);if(!l)return;
  const c=l.cuotas.find(x=>x.n===nCuota);if(!c)return;
  const cl=client(l.clientId)||{nombre:'?'};
  const rest=cRestante(c);
  // descuento por pronto pago: la app sabe la hora solo si el cobro se carga en el momento;
  // si no, el dueño marca la casilla. Empieza tildada solo cuando el reloj lo confirma.
  const hDesc=+((S.settings.descuento||{}).hora)||14, hLim=S.settings.horaLimite??18;
  const puedeDesc=descuentoAplica(l,c,todayStr());

  ${yaPago>0?`<br>Cuota de ${fmt$(c.monto)} · ya cubrió ${fmt$(yaPago)} de la cuota${cTotalRecibido(c)!==yaPago?` (te pagó ${fmt$(cTotalRecibido(c))} en total, ${fmt$(cTotalRecibido(c)-yaPago)} fue a mora/cobrador)`:''}`:''}

  <label>¿Cuándo te pagó?</label>
  <input id="co-fecha" type="date" value="${todayStr()}" max="${todayStr()}">

  <label class="chk" id="co-temprano-box" style="${puedeDesc?'':'display:none'}">
    <input type="checkbox" id="co-temprano" ${temprano?'checked':''}><span id="co-temprano-txt"></span></label>
  <label class="chk" id="co-atiempo-box" style="border-color:var(--line);${aTiempo?'display:none':''}">

  <label>Tipo de pago</label>
  <div class="seg" id="co-tipo">
    <button data-v="total" class="on">✅ Pagó todo</button>
    <button data-v="parcial">✂️ Pago parcial</button>
  </div>
  <label>Total que te pagó</label>
  <input id="co-recibido" type="number" inputmode="decimal" value="${debeTotal}">
  <div class="hint" id="co-queda"></div>
  <label class="chk" id="co-sobra-box" style="display:none">
    <input type="checkbox" id="co-sobra"><span id="co-sobra-txt"></span></label>
  <div class="btnrow" style="margin-top:8px">
    <button class="btn sec mini" id="co-condonar" style="${mora>0?'':'display:none'}">🤝 Condonar mora</button>
    <button class="btn sec mini" id="co-condcob" style="${cob>0?'':'display:none'}">🤝 Condonar cobrador</button>
  </div>
  <details id="co-adv" style="margin-top:12px">
    <summary>Ajustar el reparto a mano</summary>
    <label>A la cuota</label><input id="co-base" type="number" inputmode="decimal" value="${rest}">
    <label>A la mora</label><input id="co-mora" type="number" inputmode="decimal" value="${mora}">
    <label>Al cobrador</label><input id="co-cob" type="number" inputmode="decimal" value="${cob}">
  </details>
  <div class="resume">Total a cobrar: <b id="co-total">${fmt$(debeTotal)}</b></div>
  <label>Comprobante de transferencia (opcional · en PC podés pegarlo con Ctrl+V)</label>
  <input type="file" id="co-file" accept="image/*" style="display:none">
  <div class="btnrow" style="margin-top:0">
    <button class="btn sec" id="co-adj">📎 Adjuntar comprobante</button>
    <button class="btn sec" id="co-alias">📋 Copiar alias</button>
  </div>
  <button class="btn green" id="co-save" style="margin-top:16px">✅ Registrar cobro</button>`);
  if(alVolver){ // la ✕ y el fondo vuelven al panel en vez de dejarte en la nada
    const volver=()=>{closeModal();alVolver();};
    $('#mx').onclick=volver;
    $('#ovl').onclick=e=>{if(e.target.id==='ovl')volver();};
  }
  let moraACobrar=mora, cobACobrar=cob, condMora=false, condCob=false;
  // reparte lo que te pagó: primero la mora, después el cobrador, y lo que sobra a la cuota
  const repartir=r=>{
    r=Math.max(0,r);
    const m=Math.min(r,moraACobrar); r-=m;
    const cb=Math.min(r,cobACobrar); r-=cb;
    return {base:r,mora:m,cobrador:cb};
  };
  const totalEsperado=()=>Math.max(0,rest-desc)+moraACobrar+cobACobrar;
  // primera cuota siguiente que sigue abierta: ahí puede ir lo que se pague de más
  const sig=l.cuotas.find(x=>x.n>c.n&&cRestante(x)>0);
  const pintarDesglose=()=>{
    const base=+$('#co-base').value||0,m=+$('#co-mora').value||0,cb=+$('#co-cob').value||0;
    $('#co-total').textContent=fmt$(base+m+cb);
    // el descuento entra solo si este pago SALDA la cuota; si no, se cobra el valor completo
    const descAhora=(desc>0&&base>=rest-desc)?desc:0;
    const sobra=Math.max(0,base-(rest-descAhora)), box=$('#co-sobra-box');
    if(box){
      if(sobra>0&&sig){box.style.display='';
        $('#co-sobra-txt').innerHTML=`Pasar los ${fmt$(sobra)} de más a la cuota ${sig.n}, que vence el ${dShort(sig.vence)}`;}
      else box.style.display='none';
    }
    const quedaCuota=Math.max(0,rest-descAhora-base), quedaMora=Math.max(0,moraACobrar-m), quedaCob=Math.max(0,cobACobrar-cb);
    const debeDespues=quedaCuota+quedaMora+quedaCob, q=$('#co-queda');
    const partes=[];
    if(m>0)partes.push(`mora ${fmt$(m)}`);
    if(cb>0)partes.push(`cobrador ${fmt$(cb)}`);
    if(base>0)partes.push(`cuota ${fmt$(base)}`);
    if(base+m+cb<=0&&descAhora<=0){q.innerHTML='';return;}
    let txt=`Se aplica a: ${partes.join(' · ')||'nada en efectivo'}`;
    if(descAhora>0)txt+=` <b style="color:var(--green)">+ descuento ${fmt$(descAhora)}</b>`;
    if(debeDespues>0){

        +(desc>0?`<br>🎁 Con este pago <b>no</b> alcanza a saldar la cuota, así que el descuento todavía no se aplica: se aplica cuando la complete a horario.`:'');
    }else if(base>rest-descAhora){
      const s=base-(rest-descAhora), pasa=$('#co-sobra')&&$('#co-sobra').checked&&sig;
      txt+=`<br>✅ La cuota queda <b style="color:var(--green)">saldada</b> y sobran <b style="color:var(--blue)">${fmt$(s)}</b>. `
        +(pasa?`Se le descuentan de la cuota ${sig.n}: va a quedar debiendo ${fmt$(Math.max(0,cRestante(sig)-s))} de esa cuota.`
          :sig?`Quedan como pagados de más: <b>no</b> se le descuentan de la cuota ${sig.n}, así que vas a terminar cobrando ${fmt$(s)} por encima del total del préstamo. Igual cuentan como plata cobrada.`
          :'No hay otra cuota abierta: quedan como pagados de más, pero se cuentan como plata cobrada.');
    }else{
      txt+='<br>✅ Con este pago la cuota queda <b style="color:var(--green)">saldada</b>.';
    }
    q.innerHTML=txt;
  };
  const aplicarRecibido=()=>{
    const r=repartir(+$('#co-recibido').value||0);
    $('#co-base').value=r.base; $('#co-mora').value=r.mora; $('#co-cob').value=r.cobrador;
    pintarDesglose();
  };
  $$('#co-tipo button').forEach(b=>b.onclick=()=>{
    $$('#co-tipo button').forEach(x=>x.classList.toggle('on',x===b));
    if(b.dataset.v==='total')$('#co-recibido').value=totalEsperado();
    else{$('#co-recibido').value='';$('#co-recibido').focus();}

  });
  $('#co-recibido').oninput=()=>{
    aplicarRecibido();
    const r=+$('#co-recibido').value||0, esTotal=r>=totalEsperado();
    $$('#co-tipo button').forEach(b=>b.classList.toggle('on',b.dataset.v===(esTotal?'total':'parcial')));
  };
  // la fecha del pago y las casillas de horario recalculan mora, cobrador y descuento
  const fechaDe=()=>$('#co-fecha').value||todayStr();
  const mediodia=f=>{const[Y,M,D]=f.split('-').map(Number);return new Date(Y,M-1,D,12,0,0).getTime();};
  const recalcular=()=>{
    const f=fechaDe(), hoy=f===todayStr();
    temprano=puedeDesc&&$('#co-temprano')&&$('#co-temprano').checked&&f<=c.vence;
    aTiempo=!hoy||temprano||($('#co-atiempo')&&$('#co-atiempo').checked);
    // si pagó dentro del horario, la mora se mide al mediodía de ese día: ese día no suma
    const asOf=aTiempo?mediodia(f):momentoDe(f);
    const m2=moraDe(c,asOf), cb2=cobradorDe(c,asOf), a2=diasAtraso(c,asOf);
    const cambio=(m2!==mora||cb2!==cob);
    mora=m2; cob=cb2; atr=a2;
    if(!condMora)moraACobrar=m2;
    if(!condCob)cobACobrar=cb2;
    desc=temprano?descuentoDe(l,c,f):0;
    const tb=$('#co-temprano-box');
    if(tb){
      tb.style.display=(puedeDesc&&f<=c.vence)?'':'none';
      $('#co-temprano-txt').innerHTML=`Pagó antes de las ${String(hDesc).padStart(2,'0')}:00 · `
        +`<b style="color:var(--green)">${S.settings.descuento.pct}% de descuento (${fmt$(descuentoDe(l,c,f)||Math.round(c.monto*(+S.settings.descuento.pct||0)/100))})</b>`;
    }
    const ab=$('#co-atiempo-box');
    if(ab)ab.style.display=(hoy&&!temprano&&new Date().getHours()>=hLim)?'':'none';
    $('#co-condonar').style.display=m2>0&&!condMora?'':'none';
    $('#co-condcob').style.display=cb2>0&&!condCob?'':'none';
    $('#co-debe').innerHTML=`<br>Debe ${f===todayStr()?'ahora':'al '+dShort(f)}: <b style="color:var(--gold)">${fmt$(totalEsperado())}</b>`
      +` <span style="font-size:11px">(cuota ${fmt$(rest)}${desc>0?' − descuento '+fmt$(desc):''}${moraACobrar>0?' + mora '+fmt$(moraACobrar):''}${cobACobrar>0?' + cobrador '+fmt$(cobACobrar):''})</span>`;
    $('#co-fechahint').innerHTML=hoy
      ?'Por defecto hoy. Si te pagó otro día, ponelo: la mora se recalcula a esa fecha.'
      :`Se registra con fecha <b>${dLong(f)}</b> (${a2} día${a2===1?'':'s'} de atraso a esa fecha).`
        +(cambio?` La mora quedó en <b>${fmt$(m2)}</b> en vez de la de hoy.`:'');
    if($$('#co-tipo button.on')[0]&&$$('#co-tipo button.on')[0].dataset.v==='total')
      $('#co-recibido').value=totalEsperado();
    aplicarRecibido();
  };
  $('#co-fecha').onchange=()=>{
    if(fechaDe()>todayStr()){alert('No se puede registrar un cobro con fecha futura.');$('#co-fecha').value=todayStr();}
    recalcular();
  };
  $('#co-temprano').onchange=recalcular;
  $('#co-atiempo').onchange=recalcular;
  $('#co-sobra').onchange=pintarDesglose; // explicar en el momento qué pasa con el excedente
  ['co-base','co-mora','co-cob'].forEach(x=>$('#'+x).oninput=()=>{ // reparto manual: el total sigue la suma
    $('#co-recibido').value=(+$('#co-base').value||0)+(+$('#co-mora').value||0)+(+$('#co-cob').value||0);
    pintarDesglose();
  });
  $('#co-condonar').onclick=()=>{
    condMora=true; moraACobrar=0; $('#co-mora').value=0;
    $('#co-recibido').value=totalEsperado(); aplicarRecibido();
    $('#co-condonar').textContent='🤝 Mora condonada'; $('#co-condonar').disabled=true;
  };
  $('#co-condcob').onclick=()=>{
    condCob=true; cobACobrar=0; $('#co-cob').value=0;
    $('#co-recibido').value=totalEsperado(); aplicarRecibido();
    $('#co-condcob').textContent='🤝 Cobrador condonado'; $('#co-condcob').disabled=true;
  };
  recalcular(); // deja listos el descuento, las casillas de horario y el desglose
  let coFile=null;
  $('#co-adj').onclick=()=>$('#co-file').click();
  $('#co-file').onchange=e=>{coFile=e.target.files[0]||null;
    $('#co-adj').textContent=coFile?'📎 ✓ '+(coFile.name.length>18?coFile.name.slice(0,18)+'…':coFile.name):'📎 Adjuntar comprobante';};
  window.__coPaste=f=>{coFile=f;const b=$('#co-adj');if(b)b.textContent='📎 ✓ Imagen pegada';};
  $('#co-alias').onclick=e=>copiarAlias(e.currentTarget);
  $('#co-save').onclick=async()=>{
    const base=+$('#co-base').value||0,m=+$('#co-mora').value||0,cb=+$('#co-cob').value||0;
    // deja pasar el caso raro en que el descuento cubre todo lo que faltaba de la cuota
    if(base+m+cb<=0&&!(desc>0&&rest-desc<=0))return alert('El monto debe ser mayor a 0');
    // el descuento por pronto pago solo entra si este cobro salda la cuota
    const descAhora=(desc>0&&base>=rest-desc)?desc:0;
    const sobra=Math.max(0,base-(rest-descAhora));
    // si le entró más de lo que quedaba de la cuota, por defecto pasa a la siguiente;
    // si no hay siguiente (o la destildó), se registra igual y queda como pagado de más
    const pasar=sobra>0&&!!sig&&!!$('#co-sobra')&&$('#co-sobra').checked;
    if(sobra>0&&!pasar&&!confirm(`Estás cobrando ${fmt$(sobra)} más de lo que resta de esta cuota.\n`
      +(sig?'Va a quedar registrado como pagado de más, sin descontarse de la cuota '+sig.n+'.'
           :'Va a quedar registrado como pagado de más.')+'\n¿Continuar?'))return;
    const fPago=$('#co-fecha').value||todayStr();
    if(fPago>todayStr())return alert('No se puede registrar un cobro con fecha futura.');
    const pago={t:momentoDe(fPago),monto:pasar?base-sobra:base,mora:m,cobrador:cb};
    if(descAhora>0)pago.descuento=descAhora;
    if(coFile){
      const data=await compressImage(coFile);
      if(data){
        const d={id:uid(),clientId:l.clientId,nombre:'Comprobante cuota '+c.n+'/'+l.cuotas.length+' · '+dShort(fPago),tipo:'image/jpeg',data,createdAt:Date.now()};
        saveDoc(d);pago.comprobante=d.id;
      }else alert('No se pudo procesar la imagen del comprobante. El cobro se registra igual.');
    }
    c.pagos=c.pagos||[];c.pagos.push(pago);
    if(pasar){ // el excedente entra como un pago propio de la cuota siguiente, con la misma fecha
      sig.pagos=sig.pagos||[];
      sig.pagos.push({t:pago.t,monto:sobra,mora:0,cobrador:0,
        deCuota:c.n,...(pago.comprobante?{comprobante:pago.comprobante}:{})});
    }
    saveLoan(l);closeModal();render();
    const queda=cRestante(c);
    const tel=(cl.telefono||'').replace(/\D/g,'');
    const cuando=(fPago===todayStr()?'':`\nRegistrado con fecha ${dLong(fPago)}.`)
      +(descAhora>0?`\n🎁 Se le aplicó ${fmt$(descAhora)} de descuento por pronto pago.`:'')
      +(pasar?`\n${fmt$(sobra)} se aplicaron a la cuota ${sig.n}.`:'');
    const aviso=queda>0
      ? `Pago parcial registrado ✅${cuando}\nQuedan ${fmt$(queda)} de esta cuota (la mora sigue corriendo).\n\n¿Enviar comprobante por WhatsApp?`
      : `Cobro registrado ✅${cuando}\n¿Enviar comprobante por WhatsApp?`;
    if(tel&&confirm(aviso)){
      const msg=`Hola ${cl.nombre}! Te confirmamos el pago de ${fmt$(base+m+cb)} (cuota ${c.n}/${l.cuotas.length}). `+
        (queda>0?`Queda pendiente ${fmt$(queda)} de esta cuota, que sigue generando mora hasta cancelarse. `:'')+
        `Saldo restante del préstamo: ${fmt$(loanRestante(l))}. ¡Gracias! — ${S.settings.nombreNegocio}`;
      window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(msg),'_blank');
    }else if(!tel&&(queda>0||pasar||descAhora>0))alert(
      (queda>0?`Pago parcial registrado ✅\nQuedan ${fmt$(queda)} de esta cuota (la mora sigue corriendo).`
             :'Cobro registrado ✅')
      +(descAhora>0?`\n🎁 Se le aplicó ${fmt$(descAhora)} de descuento por pronto pago.`:'')
      +(pasar?`\n${fmt$(sobra)} se aplicaron a la cuota ${sig.n}.`:''));
    if(alVolver)alVolver(); // vuelve al panel de recordatorios para seguir con el siguiente
  };
}

/* ================= DOCUMENTOS: subida + compresión ================= */
function compressImage(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1100;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.72,data=cv.toDataURL('image/jpeg',q);
      while(data.length>880000&&q>0.3){q-=0.12;data=cv.toDataURL('image/jpeg',q);}
      res(data);
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
async function guardarFirma(d,f,cl){ // la foto del contrato firmado va a la documentación del cliente
  let data=null,tipo=f.type;
  if(f.type.startsWith('image/')){data=await compressImage(f);tipo='image/jpeg';}
  else if(f.type==='application/pdf'){
    if(f.size>880000){alert('El PDF supera 850 KB y no se puede sincronizar. Sacale una foto en su lugar.');return null;}
    data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
  }else{alert('Formato no soportado (solo imágenes o PDF).');return null;}
  if(!data){alert('No se pudo procesar el archivo.');return null;}
  const doc={id:uid(),clientId:d.clientId,
    nombre:'Contrato firmado · '+(cl?cl.nombre:'')+' · '+fmt$(d.monto)+' · '+dShort(todayStr()),
    tipo,data,createdAt:Date.now()};
  saveDoc(doc);
  return doc;
}
async function subirDocs(clientId,files){
  for(const f of files){
    let data=null,tipo=f.type;
    if(f.type.startsWith('image/')){data=await compressImage(f);tipo='image/jpeg';}
    else if(f.type==='application/pdf'){
      if(f.size>880000){alert(f.name+': el PDF supera 850 KB y no se puede sincronizar. Sacale una foto en su lugar.');continue;}
      data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    }else{alert(f.name+': formato no soportado (solo imágenes o PDF).');continue;}
    if(!data){alert('No se pudo procesar '+f.name);continue;}
    saveDoc({id:uid(),clientId,nombre:f.name,tipo,data,createdAt:Date.now()});
  }
  render();
}

/* ================= SEGURIDAD / LOGIN ================= */
const AUTH_KEY=LS+'-auth';
let UNLOCKED=false;
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){return null;}}
async function hashPass(pass,salt){
  if(window.crypto&&crypto.subtle){
    try{
      const enc=new TextEncoder();
      const key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
      return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  // fallback para contextos sin crypto.subtle (ej. abrir el archivo sin https)
  let h=2166136261;const s=salt+'|'+pass;let out='';
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  for(let r=0;r<8;r++){h=Math.imul(h^(h>>>13),0x5bd1e995);out+=(h>>>0).toString(16).padStart(8,'0');}
  return out;
}
async function setAuth(user,pass){
  const salt=uid()+uid();
  localStorage.setItem(AUTH_KEY,JSON.stringify({user,salt,hash:await hashPass(pass,salt)}));
}
async function checkAuth(user,pass){
  const a=getAuth();if(!a)return false;
  return a.user.toLowerCase()===user.toLowerCase()&&a.hash===await hashPass(pass,a.salt);

const cuentasSocio=()=>(S.settings.cuentas||[]);
async function setCuentaSocio(socioId,user,pass){
  const salt=uid()+uid(), hash=await hashPass(pass,salt);
  const l=cuentasSocio().filter(c=>c.socioId!==socioId);
  l.push({socioId,user:user.trim(),salt,hash});
  S.settings.cuentas=l; saveSettings();
}
function quitarCuentaSocio(socioId){
  S.settings.cuentas=cuentasSocio().filter(c=>c.socioId!==socioId); saveSettings();
}
async function buscarCuentaSocio(user,pass){ // devuelve la cuenta del socio si coinciden usuario y clave
  const u=(user||'').trim().toLowerCase();
  for(const c of cuentasSocio()){
    if(c.user.toLowerCase()===u&&c.hash===await hashPass(pass,c.salt))return c;
  }
  return null;
}

/* ================= AVISO DE VERSIÓN NUEVA =================
   La app pregunta sola si hay una versión más nueva publicada: al abrirla, al volver
   a ella y cada media hora. Si la hay, aparece una barra arriba que no se va hasta
   actualizar, y la primera vez además un cartel. Sirve sobre todo para que el dueño y
   los socios no queden en versiones distintas, que es cuando los números no coinciden. */
let verNueva=0, avisoVisto=false, ultChequeo=0;
async function versionPublicada(){
  const r=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  const m=(await r.text()).match(/const APP_VER=(\d+)/);
  return m?+m[1]:0;
}
function pintarAvisoVersion(){
  const bar=$('#updbar'); if(!bar)return;
  if(verNueva>APP_VER){bar.style.display='';$('#updver').textContent='v'+verNueva;}
  else bar.style.display='none';
}
async function chequearVersion(forzado){
  if(!navigator.onLine)return 0;
  if(!forzado&&Date.now()-ultChequeo<5*60000)return verNueva;   // no preguntar de más
  ultChequeo=Date.now();
  let v=0; try{v=await versionPublicada();}catch(e){return 0;}
  if(v>APP_VER){
    verNueva=v; pintarAvisoVersion();
    if(!avisoVisto){avisoVisto=true;modalActualizar();}
  }
  return v;
}
function modalActualizar(){
  modal(`<h3>🆕 Versión v${verNueva} disponible</h3>
  <div class="hint">Estás usando la v${APP_VER}. Conviene actualizar ahora: si vos y los socios
  quedan en versiones distintas, las cuentas de un préstamo pueden verse diferentes en cada celular.
  Tus datos no se tocan, es solo cambiar el programa.</div>
  <button class="btn" id="upd-go" style="margin-top:16px">⬇️ Actualizar ahora</button>
  <button class="btn sec" id="upd-luego" style="margin-top:10px">Ahora no</button>`);
  $('#upd-go').onclick=actualizarApp;
  $('#upd-luego').onclick=()=>{closeModal();pintarAvisoVersion();};
}
async function actualizarApp(){
  const b=$('#upd-go')||$('#upd-ya'); if(b){b.textContent='⏳ Actualizando…';b.disabled=true;}
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){try{await reg.update();}catch(e){}
        if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}
    }
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
  }catch(e){}
  location.reload();
}
async function buscarActualizacion(){ // el botón de Ajustes, con aviso explícito
  const bu=$('#buscar-upd');
  if(bu){bu.textContent='⏳ Buscando…';bu.disabled=true;}
  const v=await chequearVersion(true);
  if(bu){bu.textContent='🔁 Buscar actualización';bu.disabled=false;}
  if(v>APP_VER)return;                       // el cartel ya se abrió solo
  if(!v)return alert('No se pudo consultar. Fijate que tengas internet y probá de nuevo.');
  alert('Ya estás en la última versión (v'+APP_VER+') ✅');
}

function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const p=JSON.parse(fr.result);
    if(!p.clients||!p.loans)throw 0;
    if(!confirm(`El archivo tiene ${p.clients.length} clientes y ${p.loans.length} préstamos. ¿Importar? (se combina con lo actual)`))return;
    [['client',p.clients],['loan',p.loans],['doc',p.docs||[]],['draft',p.drafts||[]]].forEach(([k,arr])=>arr.forEach(o=>{
      const tgt=arrDe(k);
      const i=tgt.findIndex(x=>x.id===o.id);
      if(i<0)tgt.push(o);else if((o.updatedAt||0)>(tgt[i].updatedAt||0))tgt[i]=o;
      if(k==='doc')idbPut(o);
      fbPush(k,o);
    }));
    persist();render();alert('Importado ✅');
  }catch(e){alert('Archivo inválido');}};
  fr.readAsText(file);
}

  $$('[data-acuerdo]').forEach(b=>b.onclick=e=>{e.stopPropagation();formAcuerdo(b.dataset.acuerdo);});
  $$('[data-liqpagar]').forEach(b=>b.onclick=e=>{e.stopPropagation();marcarPagadoSocio(b.dataset.liqpagar);});
  $$('[data-liqundo]').forEach(b=>b.onclick=e=>{e.stopPropagation();marcarPagadoSocio(b.dataset.liqundo,true);});
  $$('[data-purgar]').forEach(b=>b.onclick=()=>borrarDefinitivo(b.dataset.purgar));
  $$('[data-papsel]').forEach(b=>b.onchange=()=>{
    b.checked?papSel.add(b.dataset.papsel):papSel.delete(b.dataset.papsel);render();});
  {const b=$('#pap-todos');if(b)b.onclick=()=>{
    const vis=vTrash().slice(0,60);
    const todos=vis.length>0&&vis.every(x=>papSel.has(x.id));
    if(todos)papSel.clear(); else vis.forEach(x=>papSel.add(x.id));
    render();};}
  {const b=$('#pap-borrar');if(b)b.onclick=()=>borrarSeleccionados();}
  $$('[data-vercontrato]').forEach(b=>b.onclick=()=>{const d=draft(b.dataset.vercontrato);if(d)generarContrato(d);});
  $$('[data-tyc-draft]').forEach(b=>b.onclick=()=>{const d=draft(b.dataset.tycDraft);if(d)enviarTyC(d);});
  $$('[data-editcontrato]').forEach(b=>b.onclick=()=>formContratoPrevio(null,b.dataset.editcontrato));
  $$('[data-verfirma]').forEach(b=>b.onclick=()=>verDoc(b.dataset.verfirma));
  $$('[data-marcarfirma]').forEach(b=>b.onclick=()=>{
    const d=draft(b.dataset.marcarfirma);if(!d)return;
    if(d.firmado){d.firmado=false;delete d.firmadoT;}
    else{d.firmado=true;d.firmadoT=Date.now();}
    saveDraft(d);render();});
  $$('[data-subirfirma]').forEach(b=>b.onclick=()=>{
    const inp=$('#firmafile');if(!inp)return;
    inp.onchange=async e=>{
      const f=e.target.files[0]; e.target.value='';
      if(!f)return;
      const d=draft(b.dataset.subirfirma);if(!d)return;
      const cl=client(d.clientId)||{nombre:'?'};
      const doc=await guardarFirma(d,f,cl);
      if(!doc)return;
      d.firmado=true; d.firmadoT=Date.now(); d.docFirmaId=doc.id;
      saveDraft(d);render();
      alert('Contrato firmado guardado ✅\nQueda en la documentación de '+cl.nombre+'.');
    };
    inp.click();});
  $$('[data-firmado]').forEach(b=>b.onclick=()=>convertirEnPrestamo(b.dataset.firmado));
  $$('[data-delcontrato]').forEach(b=>b.onclick=()=>{
    const d=draft(b.dataset.delcontrato);if(!d)return;
    const cl=client(d.clientId)||{nombre:'?'};
    if(!confirm(`¿Descartar el contrato de ${cl.nombre} por ${fmt$(d.monto)}?\n\nVa a la papelera: se puede restaurar.`))return;
    delEntity('draft',d);render();});
  $$('[data-del-cli]').forEach(b=>b.onclick=()=>{
    const c=client(b.dataset.delCli);if(!c)return;
    if(!puedeBorrar('client',c))return alert('Este cliente no está asignado a tu cuenta.');
    const susLoans=S.loans.filter(l=>l.clientId===c.id);
    // un socio no puede llevarse puesto un préstamo del dueño o de otro socio
    const ajenos=esSocio()?susLoans.filter(l=>l.gestorId!==SESSION.socioId):[];
    if(ajenos.length)return alert(`No podés eliminar a ${c.nombre}: tiene ${ajenos.length} préstamo(s) que no están a tu nombre. Pedíselo al dueño.`);
    const nl=susLoans.length;
    if(!confirm(`¿Eliminar a ${c.nombre}?${nl?` Se borrarán también sus ${nl} préstamo(s) y documentos.`:''}\n\nVa a la papelera: podés restaurarlo desde ${esSocio()?'Mi cuenta':'Ajustes'}.`))return;
    susLoans.forEach(l=>delEntity('loan',l));
    S.docs.filter(d=>d.clientId===c.id).forEach(d=>delEntity('doc',d));
    delEntity('client',c);go('clientes');});
  $$('[data-contrato]').forEach(b=>b.onclick=()=>generarContrato(b.dataset.contrato));
  $$('[data-tyc]').forEach(b=>b.onclick=()=>enviarTyC(b.dataset.tyc));
  $$('[data-renovar]').forEach(b=>b.onclick=()=>formRenovar(b.dataset.renovar));
  $$('[data-fb]').forEach(b=>b.onclick=()=>window.open(b.dataset.fb,'_blank'));
  $$('[data-del-loan]').forEach(b=>b.onclick=()=>{
    const l=loan(b.dataset.delLoan);if(!l)return;
    if(!puedeBorrar('loan',l))return alert('Este préstamo no está asignado a tu cuenta.');
    if(!confirm(`¿Eliminar este préstamo y todo su historial de pagos?\n\nVa a la papelera: podés restaurarlo desde ${esSocio()?'Mi cuenta':'Ajustes'}.`))return;
    delEntity('loan',l);go('prestamos');});
  $$('[data-cancel-loan]').forEach(b=>b.onclick=()=>{
    const l=loan(b.dataset.cancelLoan);if(!l)return;
    if(!confirm('¿Marcar el préstamo como cancelado? Dejará de aparecer en cobros y vencidos.'))return;
    l.status='cancelado';touch(l);persist();fbPush('loan',l);render();});
  $$('[data-doc]').forEach(b=>b.onclick=e=>{e.stopPropagation();verDoc(b.dataset.doc);});
  $$('[data-cq]').forEach(b=>b.onclick=()=>{const k=b.dataset.cq;
    cuotaOpen.has(k)?cuotaOpen.delete(k):cuotaOpen.add(k);render();});

  const cq=$('#cliq');if(cq){cq.oninput=()=>{cliQ=cq.value;
    const list=cq.closest('#view');render();const nq=$('#cliq');nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);};}
  const ad=$('#adddoc');if(ad){ad.onclick=()=>$('#docfile').click();
    $('#docfile').onchange=e=>{if(e.target.files.length)subirDocs(DETAIL,[...e.target.files]);};}

  // ajustes
  // pantalla reducida del socio
  {const mc=$('#mc-clave');
   if(mc){mc.onclick=formCambiarClaveSocio;
     const sl=$('#sec-lock');if(sl)sl.onclick=showLock;
     const bu=$('#buscar-upd');if(bu)bu.onclick=buscarActualizacion;}}
  // administración de accesos de socios (solo el dueño)
  $$('[data-acceso]').forEach(b=>b.onclick=()=>formAccesoSocio(b.dataset.acceso));
  $$('[data-socpct]').forEach(b=>b.onclick=()=>{
    const soc=(S.settings.socios||[]).find(x=>x.id===b.dataset.socpct);if(!soc)return;
    const v=prompt('¿Qué porcentaje de la ganancia le corresponde a '+soc.nombre+'?',soc.pct!=null?soc.pct:50);
    if(v===null)return;
    soc.pct=Math.max(0,Math.min(100,+v||0));saveSettings();render();});
  $$('[data-quitaracceso]').forEach(b=>b.onclick=()=>{
    const soc=(S.settings.socios||[]).find(x=>x.id===b.dataset.quitaracceso);
    if(!confirm('¿Quitarle el acceso a la app a '+(soc?soc.nombre:'este socio')+'?\nSus clientes y préstamos no se tocan.'))return;
    quitarCuentaSocio(b.dataset.quitaracceso);render();});
  const sv=$('#set-save');
  if(sv){
    let moratipo=S.settings.mora.tipo,porDia=S.settings.mora.porDia;
    $$('#set-moratipo button').forEach(b=>b.onclick=()=>{moratipo=b.dataset.v;
      $$('#set-moratipo button').forEach(x=>x.classList.toggle('on',x===b));});
    $$('#set-morapordia button').forEach(b=>b.onclick=()=>{porDia=b.dataset.v==='1';
      $$('#set-morapordia button').forEach(x=>x.classList.toggle('on',x===b));});
    $$('#set-dias button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    $$('#set-cobbordes button').forEach(b=>b.onclick=()=>
      $$('#set-cobbordes button').forEach(x=>x.classList.toggle('on',x===b)));
    {const t=$('#set-tema');if(t){t.value=temaActual();t.onchange=()=>cambiarTema(t.value);}}
    sv.onclick=()=>{
      S.settings.nombreNegocio=$('#set-nombre').value.trim()||'Mi Negocio';
      S.settings.nombreDueno=$('#set-dueno').value.trim();
      S.settings.moneda=$('#set-moneda').value.trim()||'$';
      S.settings.alias=$('#set-alias').value.trim();
      S.settings.mora={tipo:moratipo,valor:+$('#set-moraval').value||0,porDia};
      S.settings.diasNoLaborables=$$('#set-dias button.on').map(b=>+b.dataset.v);
      S.settings.horaLimite=+$('#set-hora').value;
      S.settings.cobrador={monto:+$('#set-cobmonto').value||0,dias:+$('#set-cobdias').value||3,
        bordes:($$('#set-cobbordes button.on')[0]||{dataset:{v:'1'}}).dataset.v==='1'};
      S.settings.descuento={activo:$('#set-descon').checked,
        pct:Math.max(0,Math.min(100,+$('#set-descpct').value||0)),
        hora:+$('#set-deschora').value};
      S.settings.recordatorios={
        hoy:$('#set-rec-hoy').value.trim()||DEF_REC.hoy,
        manana:$('#set-rec-manana').value.trim()||DEF_REC.manana,
        vencido:$('#set-rec-vencido').value.trim()||DEF_REC.vencido};
      saveSettings();render();alert('Ajustes guardados ✅');};
    const rr=$('#set-rec-reset');if(rr)rr.onclick=()=>{
      $('#set-rec-hoy').value=DEF_REC.hoy;$('#set-rec-manana').value=DEF_REC.manana;$('#set-rec-vencido').value=DEF_REC.vencido;};
    const sa=$('#socio-add');if(sa){sa.onclick=()=>{
      const nom=$('#socio-nombre').value.trim();
      if(!nom)return alert('Escribí el nombre del socio');
      S.settings.socios=S.settings.socios||[];
      S.settings.socios.push({id:uid(),nombre:nom});
      saveSettings();render();};}
    $$('[data-del-socio]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delSocio, usados=S.loans.filter(l=>l.gestorId===id).length;
      if(!confirm(usados?`Este socio tiene ${usados} préstamo(s) asignado(s). Esos préstamos conservan su nombre y reparto, pero no podrás elegirlo en préstamos nuevos. ¿Eliminarlo de la lista?`:'¿Eliminar este socio de la lista?'))return;
      S.settings.socios=(S.settings.socios||[]).filter(s=>s.id!==id);
      saveSettings();render();});
    $('#fb-conectar').onclick=()=>{
      const raw=$('#fb-config').value.trim(),code=$('#fb-code').value.trim();
      if(!raw||!code)return alert('Pegá la configuración de Firebase y elegí un código de negocio.');
      let cfg;
      try{
        const m=raw.match(/\{[\s\S]*\}/);if(!m)throw 0;
        cfg=(new Function('return ('+m[0]+')'))();
        if(!cfg.projectId||!cfg.apiKey)throw 0;
      }catch(e){return alert('La configuración no es válida. Pegá el bloque firebaseConfig completo, con las llaves { }.');}
      localStorage.setItem(LS+'-fb',JSON.stringify({config:cfg,code}));
      fbConnect();alert('Conectando… El estado se actualiza arriba a la derecha.');render();};
    const off=$('#fb-off');if(off)off.onclick=()=>{if(confirm('¿Desconectar la sincronización en este dispositivo? Los datos locales no se borran.')){fbDisconnect();render();}};
    $('#sec-change').onclick=formCambiarClave;
    $('#sec-lock').onclick=showLock;
    $('#bk-export').onclick=exportar;
    {const ba=$('#bk-auto');if(ba)ba.onclick=formCopias;}
    $('#bk-import').onclick=()=>$('#bk-file').click();
    $('#bk-file').onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);};
    $('#wipe').onclick=()=>{
      if(!confirm('⚠️ Se borrarán TODOS los datos guardados en este dispositivo. ¿Continuar?'))return;
      if(!confirm('¿Seguro? Esta acción no se puede deshacer (si tenés sincronización, los datos siguen en la nube).'))return;
      localStorage.removeItem(LS);
      try{if(_idb)_idb.close();indexedDB.deleteDatabase('prestacontrol');}catch(e){}
      location.reload();};
    const bu=$('#buscar-upd');if(bu)bu.onclick=buscarActualizacion;
  }
}

/* ================= INIT ================= */
applyBiz();
fbConnect(); // conectamos antes del login para conocer los accesos de socios creados en otro dispositivo
if(sessionStorage.getItem('pc-unlocked')==='1'&&(getAuth()||esSocio()))unlockApp();
else showLock();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
{const ub=$('#upd-ya');if(ub)ub.onclick=actualizarApp;}
setTimeout(()=>chequearVersion(true),4000);                 // al abrir
setInterval(()=>chequearVersion(),30*60000);                // cada media hora
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chequearVersion();});
window.addEventListener('online',()=>chequearVersion(true));
</script>
</body>
</html>
