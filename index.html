<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrestaControl">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>PrestaControl — Gestión de Préstamos</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151821; --panel-2:#1c2030; --line:#2a3042;
    --gold:#f5c84c; --green:#3ddc84; --blue:#4d8dff; --red:#ff5d5d; --orange:#ff9f43;
    --txt:#f1f3f7; --muted:#8b93a7;
    --acc:#f5c84c; --accTxt:#14110a;      /* botón principal */
    --onColor:#0b0d12;                    /* texto sobre botones de color vivo */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  /* tema claro: mismo diseño, papel en vez de pizarra */
  body.claro{
    --bg:#f3f0ea; --panel:#fbfaf7; --panel-2:#eeeae1; --line:#dcd6c9;
    --gold:#8a6a00; --green:#1d7a4c; --blue:#2a5fa6; --red:#b3392c; --orange:#a85f18;
    --txt:#1b1a17; --muted:#857f72;
    --acc:#1f2a37; --accTxt:#ffffff;
    --onColor:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{padding:env(safe-area-inset-top) 0 0 0;min-height:100vh}
  .wrap{padding:16px 16px 120px;max-width:980px;margin:0 auto}
  @media(min-width:700px){.wrap{padding-top:24px}}
  /* en pantallas grandes aprovechamos el ancho real en vez de dejar los costados vacíos */
  @media(min-width:1100px){.wrap{max-width:1280px;padding-left:28px;padding-right:28px}}
  @media(min-width:1500px){.wrap{max-width:1440px;padding-left:36px;padding-right:36px}}

  header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px}
  h1{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--txt);letter-spacing:-.2px;line-height:1.15}
  @media(min-width:700px){h1{font-size:32px}}
  .sub{font-size:11px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .cdate{font-size:12px;color:var(--muted);text-transform:capitalize;margin-top:4px}
  .hdracc{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
  .clock{font-variant-numeric:tabular-nums}
  .syncdot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--muted);margin-right:5px;vertical-align:1px}
  .syncdot.on{background:var(--green)}
  .syncdot.err{background:var(--red)}
  .syncline{font-size:11px;color:var(--muted);margin-top:5px}

  /* tarjetas dashboard */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px;margin:16px 0 6px}
  @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:transparent;border:0;border-top:2px solid var(--line);border-radius:0;padding:10px 0 14px}
  .stat .lbl{font-size:10px;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .stat .val{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--txt)}
  .stat .ex{font-size:11px;color:var(--muted);margin-top:3px}
  .stat.gold .val{color:var(--gold)} .stat.green .val{color:var(--green)}
  .stat.blue .val{color:var(--blue)} .stat.red .val{color:var(--red)}
  .stat.orange .val{color:var(--orange)}

  h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:26px 0 10px;
    display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  h2 .cnt{background:var(--panel-2);color:var(--muted);font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;
    font-family:inherit;margin-left:auto;letter-spacing:.5px}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:none}
  .item:active{background:var(--panel-2)}
  .ava{width:42px;height:42px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--gold);flex-shrink:0}
  .ava.shop{color:var(--blue)}
  .item .mid{flex:1;min-width:0}
  /* el nombre puede ocupar dos líneas: si se cortara, las etiquetas que van al lado
     (estado del préstamo, tipo de cliente, ✓ avisado) quedarían escondidas */
  .item .t1{font-weight:700;font-size:15px;overflow-wrap:anywhere}
  .item .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* filas de acciones: se acomodan en varias líneas en vez de cortarse con "…" */
  .item .t2.acts{white-space:normal;overflow:visible;text-overflow:clip;line-height:2}
  .item .t2.libre{white-space:normal;overflow:visible;text-overflow:clip} /* líneas que no se pueden cortar */
  /* en pantallas angostas los montos del préstamo bajan a una 2da línea para no cortar nada */
  @media(max-width:620px){
    .item.loanrow{flex-wrap:wrap}
    .item.loanrow .mid{flex:1 1 calc(100% - 54px);min-width:0}
    .item.loanrow .end{flex:1 1 0;text-align:left;margin:6px 0 0!important}
    .item.loanrow .end:last-child{text-align:right}
  }
  .item .end{text-align:right;flex-shrink:0}
  .item .m1{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .item .m2{font-size:11px;color:var(--muted);margin-top:2px}
  .chev{font-size:11px;color:var(--muted);margin-left:2px}
  .clip{color:var(--blue);cursor:pointer;font-weight:600}
  .undo{display:inline-block;color:var(--red);cursor:pointer;font-weight:700;padding:0 6px;
    border:1px solid var(--red);border-radius:6px;line-height:1.5;margin-left:2px;opacity:.85}
  .balgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
  .balgrid .bn{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .balgrid .bl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
  .rephdr:active{background:var(--panel-2)}
  .repbox{background:var(--panel-2);border-bottom:1px solid var(--line)}
  /* cuotas desplegadas dentro del grupo de un cliente: sangradas y sin repetir su inicial */
  .repbox .item{padding-left:24px;border-bottom:none;border-top:1px solid var(--line)}
  .repbox .item>.ava{display:none}
  /* tira de cuotas del historial de pago */
  .tira{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
  .tira i{width:13px;height:18px;border-radius:3px;display:block}
  .tl{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle}
  .tira i.ok,.tl.ok{background:var(--green)}
  .tira i.tarde,.tl.tarde{background:var(--gold)}
  .tira i.venc,.tl.venc{background:var(--orange)}
  .tira i.mala,.tl.mala{background:var(--red)}
  .tira i.neu,.tl.neu{background:var(--line)}
  .repsub{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 24px;border-top:1px solid var(--line);cursor:pointer}
  .repsub:active{background:var(--bg)}
  .repsub .mid{flex:1;min-width:0}
  .repsub .t1{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repsub .end{flex-shrink:0;text-align:right}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-style:italic;font-size:14px;line-height:1.5}

  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.5px;border:1px solid currentColor;background:transparent}
  .b-per{color:var(--gold)}
  .b-com{color:var(--blue)}
  .b-ok{color:var(--green)}
  .b-hoy{color:var(--gold)}
  .b-ven{color:var(--red)}
  .b-fut{color:var(--muted)}
  .b-cob{color:var(--orange)}
  /* chapa de "cómo paga": rellena, para que salte a la vista en cualquier lista */
  .badge.niv{border:0;color:var(--onColor);font-weight:800;padding:3px 9px;letter-spacing:.6px}
  .niv-bueno{background:var(--green)}
  .niv-regular{background:var(--gold)}
  .niv-malo{background:var(--red)}
  .niv-poco{background:var(--blue)}
  .niv-nuevo{background:var(--muted)}
  /* franja del veredicto en la ficha del cliente */
  .veredicto{display:flex;align-items:center;gap:10px;padding:13px 14px;color:var(--onColor);
    border-radius:10px 10px 0 0;font-weight:800;letter-spacing:.5px}
  .veredicto .vt{font-size:16px}
  .veredicto .vs{font-size:12px;font-weight:600;opacity:.9;margin-left:auto;text-align:right;letter-spacing:0}
  /* casilla de la papelera: reemplaza al ícono, con área grande para el dedo */
  .pchk{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;padding:4px 2px}
  .pchk input{width:20px;height:20px;accent-color:var(--red);flex-shrink:0;margin:0}
  .pchk span{font-size:18px}
  /* casilla de texto normal (no la de la papelera) */
  .chk{display:flex;align-items:center;gap:9px;cursor:pointer;padding:10px 12px;margin-top:8px;
    background:var(--panel-2);border:1px solid var(--blue);border-radius:12px;
    font-size:13px;font-weight:600;color:var(--txt);text-transform:none;letter-spacing:0}
  .chk input{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0;margin:0}
  .btn[disabled]{opacity:.45;pointer-events:none}
  /* aviso de versión nueva: pegado arriba, no se puede ignorar */
  #updbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--gold);color:var(--onColor);border-radius:12px;padding:11px 14px;margin-bottom:12px;
    font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  #updbar .btn{background:var(--onColor);color:var(--gold);flex:0 0 auto}
  /* en pantallas anchas, liquidaciones a la izquierda y ganancias a la derecha:
     se aprovecha el costado y se baja menos con el dedo */
  .cols>div:empty{display:none}
  @media(min-width:900px){
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:start}
      .cols.una{grid-template-columns:1fr}   /* si solo hay una, usa todo el ancho */
    .cols>div>h2:first-child{margin-top:14px}
    /* Ajustes y Mi cuenta usan todo el ancho, igual que el calendario y las listas */
    .angosto{max-width:none}
  }

  button{font-family:inherit;cursor:pointer}
  .btn{border:none;border-radius:10px;padding:13px 18px;font-weight:700;font-size:14px;
    background:var(--acc);color:var(--accTxt);width:100%;transition:.15s;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--panel-2);color:var(--txt);border:1px solid var(--line)}
  .btn.green{background:var(--green);color:var(--onColor)}
  .btn.oro{background:var(--gold);color:var(--onColor)}
  .btn.red{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn.blue{background:var(--blue);color:var(--onColor)}
  .btn.mini{width:auto;padding:8px 13px;font-size:12px;border-radius:8px;white-space:nowrap}
  .btnrow{display:flex;gap:10px;margin-top:10px}
  .btnrow .btn{flex:1}
  /* columna de acciones de una fila de cobranza */
  .acciones{display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:stretch}

  /* formularios */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:13px;font-size:16px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:70px}
  .frow{display:flex;gap:10px}.frow>div{flex:1}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px;border-radius:9px;
    font-weight:700;font-size:13px}
  .seg button.on{background:var(--gold);color:var(--onColor)}
  .dias{display:flex;gap:5px;flex-wrap:wrap}
  .dias button{flex:1;min-width:40px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:10px 2px;border-radius:10px;font-weight:700;font-size:12px}
  .dias button.on{background:var(--gold);color:var(--onColor);border-color:var(--gold)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .resume{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-top:14px;font-size:14px;line-height:1.8}
  .resume b{color:var(--gold)}

  /* modal */
  .ovl{position:fixed;inset:0;background:rgba(5,6,10,.78);backdrop-filter:blur(4px);z-index:50;
    display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.ovl{align-items:center}}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;
    max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:700px){.sheet{border-radius:22px}}
  .sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:4px}
  .sheet .x{position:sticky;float:right;top:0;background:var(--panel-2);border:1px solid var(--line);
    color:var(--muted);width:34px;height:34px;border-radius:99px;font-size:16px;font-weight:700}

  /* calendario */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
  .calhead button{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    width:40px;height:40px;border-radius:12px;font-size:18px}
  .calhead .mname{font-size:18px;font-weight:800;text-transform:capitalize}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .dow span{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cday{aspect-ratio:.92;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;
    font-weight:600;cursor:pointer;position:relative;min-width:0}
  /* en pantallas anchas el mes entra completo: celdas más bajas en vez de cuadrados enormes */
  @media(min-width:900px){.cday{aspect-ratio:auto;height:96px}}
  .cday.off{opacity:.28}
  .cday.today{border-color:var(--gold);color:var(--gold)}
  .cday.sel{background:var(--panel-2);border-color:var(--gold)}
  .cday .amt{font-size:8.5px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .cday .dots{display:flex;gap:3px}
  .cday .dot{width:6px;height:6px;border-radius:99px}
  .d-ok{background:var(--green)} .d-ven{background:var(--red)} .d-pen{background:var(--blue)} .d-hoy{background:var(--gold)}
  .d-pago{background:var(--green);box-shadow:0 0 0 2px rgba(61,220,132,.25)} /* día en que cobraste */

  /* docs */
  .docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  @media(min-width:900px){.docgrid{grid-template-columns:repeat(6,1fr)}}
  .doc{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    aspect-ratio:1;position:relative;cursor:pointer}
  .doc img{width:100%;height:100%;object-fit:cover}
  .doc .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:30px}
  .doc .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(5,6,10,.75);font-size:9px;
    padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* cuotas */
  .cuota{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .cuota:last-child{border-bottom:none}
  .cuota .num{width:34px;height:34px;border-radius:10px;background:var(--panel-2);display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0}
  .cuota.pg .num{background:rgba(61,220,132,.13);color:var(--green)}
  .cuota.vn .num{background:rgba(255,93,93,.13);color:var(--red)}
  .cuota.hy .num{background:rgba(245,200,76,.15);color:var(--gold)}

  .chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:2px}
  .chips button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 15px;
    border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
  .chips button.on{background:var(--acc);color:var(--accTxt);border-color:var(--acc)}

  .search{position:relative;margin:12px 0}
  .search input{padding-left:38px}
  .search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}

  .back{background:none;border:none;color:var(--blue);font-weight:700;font-size:14px;padding:4px 0;margin-bottom:8px;cursor:pointer}
  .fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:60px;height:60px;
    border-radius:99px;background:var(--acc);color:var(--accTxt);border:none;font-size:30px;font-weight:300;
    box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:30;display:none}
  .progress{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:25}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:11px 0 9px;
    font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .i{font-size:20px}
  .tabs button.active{color:var(--acc)}

  details{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  summary{font-weight:700;font-size:13px;cursor:pointer;color:var(--gold)}
  details ol{margin:10px 0 4px 18px;font-size:13px;line-height:1.7;color:var(--txt)}
  details code{background:#0d0f15;padding:2px 5px;border-radius:5px;font-size:11px;display:inline-block;max-width:100%;overflow-x:auto;white-space:pre;vertical-align:middle}
  pre.rules{background:#0d0f15;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:10.5px;
    overflow-x:auto;margin:8px 0;line-height:1.5}
  .wamsg{color:#25D366;font-weight:800}

  /* pantalla de bloqueo */
  #lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px}
  #lock.show{display:flex}
  .lockbox{width:100%;max-width:380px}
  .lockbox .logo{text-align:center;margin-bottom:26px}
  .lockbox .logo .ic{font-size:46px}
  .lockbox h1{font-size:28px;text-align:center}
  .lockbox .sub{text-align:center}
  .lockerr{color:var(--red);font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:18px}
  .lockfoot{text-align:center;margin-top:22px}
  .lockfoot button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline}

  /* visor de contrato integrado (window.open no anda en la app instalada) */
  .cview{position:fixed;inset:0;z-index:120;background:#272b33;display:flex;flex-direction:column}
  .cview .cbar{display:flex;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0d2e47}
  .cview .cbar button{flex:1;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14px}
  .cview .cclose{background:rgba(255,255,255,.14);color:#fff;flex:0 0 56px}

<script>
/* ================= ESTADO ================= */
const LS='prestacontrol-v1';
const APP_VER=91; // mantener a la par del número de caché en sw.js
const DEF_REC={
  hoy:'Hola {nombre}! Te recordamos que HOY vence tu cuota {cuota} de {monto}, a abonar antes de las {hora} hs al alias {alias}. ¡Gracias! — {negocio}',
  manana:'Hola {nombre}! Te recordamos que mañana ({fecha}) vence tu cuota {cuota} de {monto}. Podés abonar al alias {alias}. ¡Gracias! — {negocio}',
  vencido:'Hola {nombre}, tu cuota {cuota} venció el {fecha}. A hoy debés {total} (incluye mora). Por favor regularizá al alias {alias} para evitar el cargo del cobrador. — {negocio}'
};
const DEF_SETTINGS={
  nombreNegocio:'Mi Negocio', moneda:'$', alias:'PRESTAMOSPPP.1986',
  nombreDueno:'Lautaro', // para el saludo del inicio
  mora:{tipo:'pct', valor:10, porDia:false}, horaLimite:18,
  // descuento por pronto pago: solo préstamos diarios sin ajustes a mano
  descuento:{activo:true, pct:10, hora:14},
  cobrador:{monto:0, dias:3, bordes:true}, // bordes: 1ª y última cuota llevan cobrador desde el 1er día de mora
  diasNoLaborables:[0,6], // días que no cuentan para la mora (0=dom … 6=sáb). Por defecto sáb y dom
  socios:[],
  recordatorios:{...DEF_REC},
  purgados:[], // ids borrados definitivamente: viajan para que desaparezcan en todos los dispositivos
  avisados:{date:'',keys:[]}, // recordatorios ya enviados hoy, compartidos entre dispositivos
  updatedAt:0
};
// completa cualquier campo faltante en los ajustes (p. ej. si vienen de una versión vieja o de la nube)
function normSettings(st){st=st||{};
  return {...DEF_SETTINGS,...st,
    mora:{...DEF_SETTINGS.mora,...(st.mora||{})},
    cobrador:{...DEF_SETTINGS.cobrador,...(st.cobrador||{})},
    descuento:{...DEF_SETTINGS.descuento,...(st.descuento||{})},
    diasNoLaborables:Array.isArray(st.diasNoLaborables)?st.diasNoLaborables:[0,6],
    socios:st.socios||[],
    purgados:Array.isArray(st.purgados)?st.purgados:[],
    avisados:(st.avisados&&Array.isArray(st.avisados.keys))?st.avisados:{date:'',keys:[]},
    recordatorios:{...DEF_REC,...(st.recordatorios||{})}};
}
let S={settings:{...DEF_SETTINGS}, clients:[], loans:[], docs:[], drafts:[], trash:[]};
try{const raw=localStorage.getItem(LS); if(raw){const p=JSON.parse(raw);
  S={settings:normSettings(p.settings),
    clients:p.clients||[], loans:p.loans||[], docs:p.docs||[],
    drafts:p.drafts||[], trash:p.trash||[]};}}catch(e){}

// Los documentos (imágenes) viven en IndexedDB, que tiene mucho más espacio que
// localStorage (iPhone limita localStorage a ~5MB). En localStorage queda solo lo liviano.
function persist(){
  const guardar=()=>localStorage.setItem(LS,JSON.stringify(
    {settings:S.settings,clients:S.clients,loans:S.loans,drafts:S.drafts||[],trash:S.trash||[]}));
  try{guardar();}
  catch(e){
    // si no entra, lo primero que se recorta es la papelera: nunca puede impedir
    // que se guarden los clientes y préstamos de verdad (lo borrado sigue en la nube)
    try{S.trash=(S.trash||[]).slice(0,15);guardar();return;}catch(e2){}
    if((e+'').includes('uota'))alert('Atención: el almacenamiento local está lleno. Cerrá y volvé a abrir la app para liberar espacio; si persiste, avisale a tu desarrollador.');}}

/* ----- IndexedDB para documentos ----- */
let _idb=null;
function idb(){return _idb?Promise.resolve(_idb):new Promise((ok,err)=>{
  const r=indexedDB.open('prestacontrol',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});};
  r.onsuccess=()=>{_idb=r.result;ok(_idb);};
  r.onerror=()=>err(r.error);});}
function idbPut(d){return idb().then(db=>new Promise((ok,err)=>{
  const t=db.transaction('docs','readwrite');t.objectStore('docs').put(d);
  t.oncomplete=ok;t.onerror=()=>err(t.error);})).catch(e=>console.error('idbPut',e));}
function idbDel(id){return idb().then(db=>new Promise((ok,err)=>{
  const t=db.transaction('docs','readwrite');t.objectStore('docs').delete(id);
  t.oncomplete=ok;t.onerror=()=>err(t.error);})).catch(e=>console.error('idbDel',e));}
function idbAll(){return idb().then(db=>new Promise((ok,err)=>{
  const rq=db.transaction('docs').objectStore('docs').getAll();
  rq.onsuccess=()=>ok(rq.result||[]);rq.onerror=()=>err(rq.error);})).catch(()=>[]);}
async function docsInit(){ // migra documentos viejos de localStorage a IndexedDB y carga todo
  const enIdb=await idbAll(), map={};
  enIdb.forEach(d=>map[d.id]=d);
  (S.docs||[]).forEach(d=>{ // docs que venían en el blob viejo de localStorage o de sync temprano
    if(!map[d.id]||(d.updatedAt||0)>(map[d.id].updatedAt||0)){map[d.id]=d;idbPut(d);}
  });
  S.docs=Object.values(map);
  persist(); // reescribe localStorage sin las imágenes → libera el espacio lleno
}
let DOCS_READY=false;
docsInit().catch(e=>console.error('docsInit',e)).finally(()=>{DOCS_READY=true;if(typeof UNLOCKED!=='undefined'&&UNLOCKED)render();});

/* ================= UTILS ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DAY=86400000;
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt$(n){n=Math.round(n||0);return S.settings.moneda+' '+n.toLocaleString('es-AR');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr=()=>ymd(new Date());
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
function dueAt(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,S.settings.horaLimite??18,0,0);}
function dShort(s){const d=pd(s);return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});}
function dLong(s){const d=pd(s);return d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
const client=id=>S.clients.find(c=>c.id===id);
const loan=id=>S.loans.find(l=>l.id===id);
/* ----- SESIÓN: el dueño ve todo; un socio ve solo lo suyo ----- */
let SESSION={rol:'dueno',socioId:null,nombre:''};
try{const s=JSON.parse(sessionStorage.getItem('pc-sesion')||'null');if(s&&s.rol)SESSION=s;}catch(e){}
const esSocio=()=>SESSION.rol==='socio';
const vLoans=()=>esSocio()?S.loans.filter(l=>l.gestorId===SESSION.socioId):S.loans;
const vClients=()=>esSocio()?S.clients.filter(c=>c.gestorId===SESSION.socioId):S.clients;
function puedeVer(l){return !esSocio()||l.gestorId===SESSION.socioId;} // para pantallas de detalle
const FREQ={diaria:'Diaria',semanal:'Semanal',quincenal:'Quincenal'};
const FREQ_DAYS={diaria:1,semanal:7,quincenal:14};

/* ================= LÓGICA DE CUOTAS / MORA ================= */
function cPagadoBase(c){return (c.pagos||[]).reduce((a,p)=>a+(p.monto||0),0);} // solo lo aplicado a la cuota
function cTotalRecibido(c){ // toda la plata que entró por esta cuota: cuota + mora + cobrador
  return (c.pagos||[]).reduce((a,p)=>a+(p.monto||0)+(p.mora||0)+(p.cobrador||0),0);}
function cMoraPagada(c){return (c.pagos||[]).reduce((a,p)=>a+(p.mora||0),0);}
function cCobradorPagado(c){return (c.pagos||[]).reduce((a,p)=>a+(p.cobrador||0),0);}
function cDescuento(c){return (c.pagos||[]).reduce((a,p)=>a+(p.descuento||0),0);} // pronto pago
// lo que resta de la cuota: el descuento la salda igual que la plata
function cRestante(c){return Math.max(0,c.monto-cPagadoBase(c)-cDescuento(c));}
function cCubierto(c){return cPagadoBase(c)+cDescuento(c);} // cuánto de la cuota quedó cubierto
// asOf: momento desde el cual medir el atraso. Sirve para registrar un cobro con fecha
// pasada y que la mora sea la que corría ESE día, no la de hoy. Sin él, mide hasta ahora.
function diasAtraso(c,asOf){ // días HÁBILES de mora (los días no laborables configurados no cuentan)
  if(c.congelada)return 0; // deuda acordada a mano: el reloj de la mora queda frenado
  if(cRestante(c)<=0)return 0;
  const now=asOf||Date.now(), hl=S.settings.horaLimite??18;
  const noLab=S.settings.diasNoLaborables||[];
  const[Y,M,D]=c.vence.split('-').map(Number);
  let d=new Date(Y,M-1,D), count=0, guard=0;
  while(guard++<4000){
    const limDia=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hl,0,0).getTime();
    if(limDia>=now)break;               // este día todavía no pasó su hora límite
    if(!noLab.includes(d.getDay()))count++; // solo suma en días laborables
    d.setDate(d.getDate()+1);
  }
  return count;
}
function moraDe(c,asOf){ // mora pendiente de cobro
  const d=diasAtraso(c,asOf); if(d<=0)return 0;
  const m=S.settings.mora;
  let base=m.tipo==='pct'?c.monto*m.valor/100:Number(m.valor)||0;
  let tot=m.porDia?base*d:base;
  return Math.max(0,Math.round(tot)-cMoraPagada(c));
}
// primera y última cuota de un préstamo de más de 3: llevan cobrador apenas entran en mora,
// sin esperar los días de gracia. La marca se guarda en la cuota al crear o guardar el préstamo.
function marcarBordes(l){
  const cs=l&&l.cuotas||[], n=cs.length;
  if(l&&l.acuerdo){cs.forEach(c=>{if(c.borde)delete c.borde;});return l;} // en un acuerdo no hay cobrador
  cs.forEach((c,i)=>{
    if(n>3&&(i===0||i===n-1))c.borde=true; else if(c.borde)delete c.borde;
  });
  return l;
}
function cobradorDe(c,asOf){ // cargo de cobrador pendiente
  const d=diasAtraso(c,asOf);
  if(d<=0)return 0;
  const deUna=c.borde&&(S.settings.cobrador.bordes!==false);
  if(!deUna&&d<=(S.settings.cobrador.dias||3))return 0;
  return Math.max(0,Math.round(Number(S.settings.cobrador.monto)||0)-cCobradorPagado(c));
}
// momento a usar para medir la mora de un cobro fechado: hoy → ahora; un día pasado → su mediodía,
// antes de la hora límite, así el día del pago no suma un día más de atraso
function momentoDe(fecha){
  if(!fecha||fecha===todayStr())return Date.now();
  const[Y,M,D]=fecha.split('-').map(Number);
  return new Date(Y,M-1,D,12,0,0).getTime();
}
function estadoCuota(c){
  if(cRestante(c)<=0)return 'pagada';
  if(c.vence===todayStr())return Date.now()>dueAt(c.vence).getTime()?'vencida':'hoy';
  return c.vence<todayStr()?'vencida':'futura';
}
function loanCuotasPend(l){return l.cuotas.filter(c=>cRestante(c)>0);}
function loanRestante(l){return l.cuotas.reduce((a,c)=>a+cRestante(c),0);}
function loanGanancia(l){return Math.max(0,(l.total||0)-(l.monto||0));}
function loanExtrasCobrados(l){ // mora + cobrador efectivamente cobrados (también se reparten)
  return l.cuotas.reduce((a,c)=>a+cMoraPagada(c)+cCobradorPagado(c),0);
}
// Plata aplicada a las cuotas. OJO: no es l.total-loanRestante(l), porque cRestante
// no baja de cero: si a una cuota le entró más de lo que valía, esa diferencia se
// perdía de las cuentas. Acá se suma todo lo que entró, tal cual se registró.
function loanPagadoCuotas(l){return l.cuotas.reduce((a,c)=>a+cPagadoBase(c),0);}
function loanDescuentos(l){return l.cuotas.reduce((a,c)=>a+cDescuento(c),0);}
/* ----- DESCUENTO POR PRONTO PAGO -----
   Solo para préstamos DIARIOS que no se tocaron a mano (sin deuda acordada, sin cuotas
   congeladas y sin fechas movidas). Se aplica cuando la cuota queda saldada, no antes:
   si paga de a poco, el descuento entra recién con el pago que la completa. */
function ajustadoAMano(l,c){
  return !!(l.acuerdo||(c&&(c.esAcuerdo||c.congelada||c.fechaMovida)));
}
function descuentoAplica(l,c,fecha){
  const d=S.settings.descuento||{};
  if(!d.activo||!(+d.pct>0))return false;
  if(l.frecuencia!=='diaria'||l.status!=='activo')return false;
  if(ajustadoAMano(l,c))return false;
  if(cRestante(c)<=0)return false;
  return (fecha||todayStr())<=c.vence;   // no sirve para cuotas ya vencidas
}
function descuentoDe(l,c,fecha){ // cuánto se le descuenta si salda la cuota ahora
  if(!descuentoAplica(l,c,fecha))return 0;
  return Math.min(cRestante(c), Math.round(c.monto*(+S.settings.descuento.pct||0)/100));
}
function loanSobrepago(l){ // lo cobrado por encima del valor de las cuotas
  return l.cuotas.reduce((a,c)=>a+Math.max(0,cPagadoBase(c)-c.monto),0);
}
/* ----- GASTOS DEL PRÉSTAMO -----
   Plata que se puso para cobrar ese préstamo (carteles, viajes…). La regla es simple:
   la ganancia es lo cobrado − el capital − los gastos, y ESO se divide con el socio.
   Da igual cuándo se hizo el gasto: todos entran. Si el préstamo no llega a cubrir
   capital + gastos, la diferencia la pone el dueño; el socio nunca pone plata. */
function loanGastos(l){return (l.gastos||[]).reduce((a,g)=>a+(+g.monto||0),0);}
function loanGananciaProyectada(l){ // interés + extras cobrados + lo pagado de más − descuentos − gastos
  return loanGanancia(l)+loanExtrasCobrados(l)+loanSobrepago(l)-loanDescuentos(l)-loanGastos(l);
}
function loanTotalCobrado(l){ // todo lo cobrado del préstamo: cuotas + mora + cobrador
  return loanPagadoCuotas(l)+loanExtrasCobrados(l);
}
// lo cobrado por encima del capital y los gastos (puede dar negativo: ahí todavía estás perdiendo)
function loanNetoRealizado(l){return loanTotalCobrado(l)-(l.monto||0)-loanGastos(l);}
function loanGananciaRealizada(l){ // recién es ganancia lo que supera capital + gastos (punto neutro)
  return Math.max(0, loanNetoRealizado(l));
}
function loanFaltaParaNeutro(l){ // cuánto falta cobrar para recuperar el capital y los gastos
  return Math.max(0, (l.monto||0)+loanGastos(l)-loanTotalCobrado(l));
}
/* ----- cuánto pagó al día de hoy -----
   Compara lo que entró con lo que tendría que haber entrado a la fecha.
   "Esperado" son solo las cuotas ya vencidas (sin mora ni cobrador): así el atraso
   es plata de cuotas y no se mezcla con los cargos. La mora y el cobrador cobrados
   se cuentan aparte, porque también son plata que el cliente puso. */
function pagoAlDia(l){
  const t=todayStr(), activo=l.status==='activo';
  const cuotas=loanPagadoCuotas(l);                 // lo aplicado a cuotas (incluye lo pagado de más)
  const extras=loanExtrasCobrados(l);               // mora + cobrador cobrados
  const desc=loanDescuentos(l);                     // descuentos por pronto pago: saldan sin plata
  const cubierto=cuotas+desc;                       // cuánto de las cuotas quedó cubierto
  const esperado=activo?l.cuotas.reduce((a,c)=>a+(c.vence<=t?c.monto:0),0):cubierto;
  let ultimo=0;
  l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{if(!p.renov&&p.t>ultimo)ultimo=p.t;}));
  return {cuotas,extras,desc,cubierto,total:cuotas+extras,esperado,sobra:loanSobrepago(l),
    atraso:activo?Math.max(0,esperado-cubierto):0,
    adelanto:activo?Math.max(0,cubierto-esperado):0,
    restante:l.status==='renovado'?0:loanRestante(l),
    pct:l.total?Math.min(100,Math.round(cubierto*100/l.total)):0,
    ultimo};
}
// lo mismo pero juntando todos los préstamos de un cliente
function paneoCliente(clientId,modo){
  const ls=vLoans().filter(l=>l.clientId===clientId&&(modo==='todos'||l.status==='activo'));
  const R={loans:ls.length,activos:0,prestado:0,aDevolver:0,cuotas:0,extras:0,sobra:0,
    esperado:0,atraso:0,adelanto:0,restante:0,ultimo:0};
  ls.forEach(l=>{const p=pagoAlDia(l);
    R.prestado+=l.monto||0; R.aDevolver+=l.total||0; R.sobra+=p.sobra;
    R.cuotas+=p.cuotas; R.extras+=p.extras; R.esperado+=p.esperado;
    R.atraso+=p.atraso; R.restante+=p.restante;
    if(l.status==='activo')R.activos++;
    if(p.ultimo>R.ultimo)R.ultimo=p.ultimo;});
  R.total=R.cuotas+R.extras;
  R.adelanto=Math.max(0,R.cuotas-R.esperado);
  R.pct=R.aDevolver?Math.min(100,Math.round(R.cuotas*100/R.aDevolver)):0;
  R.cumple=R.esperado?Math.min(100,Math.round(R.cuotas*100/R.esperado)):(R.loans?100:0);
  R.dias=R.ultimo?Math.round((pd(todayStr()).getTime()-pd(ymd(new Date(R.ultimo))).getTime())/DAY):null;
  return R;
}
function hace(dias){
  if(dias==null)return 'nunca pagó nada';
  if(dias<=0)return 'pagó hoy';
  if(dias===1)return 'pagó ayer';
  return 'último pago hace '+dias+' días';
}
function socioPct(id){const s=(S.settings.socios||[]).find(x=>x.id===id);return s&&s.pct!=null?s.pct:50;}
function socioNombre(id){
  const s=(S.settings.socios||[]).find(x=>x.id===id);
  return s?s.nombre:null;
}
// mueve TODOS los préstamos de un cliente al socio elegido (o los devuelve al dueño si gestorId es null)
// mueve los préstamos EN CURSO de un cliente al socio elegido (o los devuelve al dueño).
// Los ya terminados no se tocan: su ganancia ya está repartida —y a veces liquidada—,
// moverlos cambiaría cuentas cerradas y generaría una deuda con el socio que no existió.
function reasignarPrestamosDeCliente(clientId,gestorId){
  const ls=S.loans.filter(l=>l.clientId===clientId&&l.status==='activo');
  ls.forEach(l=>{
    if(gestorId){
      l.gestorId=gestorId;l.gestorPct=socioPct(gestorId);l.gestorNombre=socioNombre(gestorId);
      // el socio arranca desde acá: lo ya cobrado no entra en su reparto
      l.gestorBase=loanTotalCobrado(l); l.gestorDesde=Date.now();
    }
    else{delete l.gestorId;delete l.gestorPct;delete l.gestorNombre;
      delete l.gestorBase;delete l.gestorDesde;}
    saveLoan(l);
  });
  return ls.length;
}
// gestorBase: lo que ya se había cobrado del préstamo cuando se le pasó al socio.
// El socio participa solo de la ganancia generada DESPUÉS de eso; lo anterior es todo del dueño.
function gananciaPrevia(l){return Math.max(0,(l.gestorBase||0)-(l.monto||0));}
function loanReparto(l){ // devuelve {socioNom, socioPct, miPct, gananciaTotal, miParte, socioParte, …}
  const g=loanGananciaProyectada(l), gr=loanGananciaRealizada(l);
  if(!l.gestorId||!l.gestorPct){return {compartido:false, gananciaTotal:g, miParteTotal:g, miParteReal:gr,
    gastos:loanGastos(l)};}
  const sp=Math.max(0,Math.min(100,l.gestorPct)), mp=100-sp;
  const nom=socioNombre(l.gestorId)||l.gestorNombre||'Socio';
  const previa=gananciaPrevia(l);                       // ganancia ya hecha antes del traspaso
  // lo que sí se reparte: la ganancia neta de gastos, menos la que ya estaba hecha antes
  const gComp=Math.max(0,g-previa), grComp=Math.max(0,loanNetoRealizado(l)-previa);
  const socioParteTotal=Math.round(gComp*sp/100), socioParteReal=Math.round(grComp*sp/100);
  return {compartido:true, socioNom:nom, socioPct:sp, miPct:mp, gananciaTotal:g, previa,
    gastos:loanGastos(l), desde:l.gestorDesde||0,
    socioParteTotal, miParteTotal:g-socioParteTotal,
    socioParteReal, miParteReal:gr-socioParteReal};
}
function refreshLoanStatus(l){
  if(l.status==='cancelado'||l.status==='renovado')return;
  l.status=loanRestante(l)<=0?'pagado':'activo';
}
function genCuotas(total,n,freq,inicio,skipSun){
  const step=FREQ_DAYS[freq]||1;
  const cuota=Math.floor(total/n), resto=total-cuota*n;
  const out=[]; let d=pd(inicio);
  for(let i=0;i<n;i++){
    if(freq==='diaria'&&skipSun){while(d.getDay()===0)d=new Date(d.getTime()+DAY);}
    out.push({n:i+1,vence:ymd(d),monto:cuota+(i===n-1?resto:0),pagos:[]});
    d=new Date(d.getTime()+step*DAY);
  }
  return out;
}

function touch(o){o.updatedAt=Date.now();return o;}
function saveClient(c){touch(c);const i=S.clients.findIndex(x=>x.id===c.id);

function saveDoc(d){touch(d);const i=S.docs.findIndex(x=>x.id===d.id);

function draft(id){return (S.drafts||[]).find(x=>x.id===id);}
const vDrafts=()=>esSocio()?(S.drafts||[]).filter(d=>d.gestorId===SESSION.socioId):(S.drafts||[]);
/* ----- PAPELERA: nada se borra de verdad, se puede restaurar ----- */
const TRASH_MAX=150, TRASH_DIAS=365;
function arrDe(kind){return kind==='client'?S.clients:kind==='loan'?S.loans:kind==='draft'?S.drafts:S.docs;}
function gestorDe(kind,obj){ // de quién es el ítem, para que cada socio vea solo lo suyo
  if(kind==='doc'){const c=(S.clients||[]).find(x=>x.id===obj.clientId);return c?(c.gestorId||null):null;}
  return obj.gestorId||null;
}
function puedeBorrar(kind,obj){ // un socio solo puede eliminar lo que es suyo
  if(!esSocio())return true;
  const g=gestorDe(kind,obj);
  if(kind==='doc'&&g===null&&!(S.clients||[]).some(x=>x.id===obj.clientId))return true; // huérfano
  return g===SESSION.socioId;
}
function trashPush(kind,obj,quien){
  S.trash=S.trash||[];
  if(purgados().includes(obj.id))return false; // ya se borró definitivamente: no vuelve
  const copia={...obj}; if(kind==='doc')delete copia.data; // la imagen queda en la nube, no en el teléfono
  const nuevo=!S.trash.some(x=>x.id===obj.id);
  S.trash=S.trash.filter(x=>x.id!==obj.id);
  S.trash.unshift({id:obj.id,kind,t:Date.now(),por:quien||'',
    gestorId:gestorDe(kind,obj),nombre:nombreDe(kind,obj),obj:copia});
  const corte=Date.now()-TRASH_DIAS*DAY;
  S.trash=S.trash.filter(x=>x.t>=corte).slice(0,TRASH_MAX);
  return nuevo;
}
function nombreDe(kind,obj){
  if(kind==='client')return obj.nombre||'Cliente';
  if(kind==='loan'||kind==='draft'){const c=(S.clients||[]).find(x=>x.id===obj.clientId);
    return (c?c.nombre:'Cliente')+' · '+fmt$(obj.monto||0);}
  return obj.nombre||'Documento';
}
function delEntity(kind,obj){ // tombstone para que la baja se propague a otros dispositivos
  if(!puedeBorrar(kind,obj)){alert('Esto no está asignado a tu cuenta, no lo podés eliminar.');return false;}
  trashPush(kind,obj,SESSION.nombre||'');
  touch(obj); obj.deleted=true; fbPush(kind,obj);
  const arr=arrDe(kind);
  const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr.splice(i,1);
  if(kind==='doc')idbDel(obj.id);
  persist();
  return true;
}
function purgados(){return S.settings.purgados||[];}
function podarPurgados(){ // saca de la papelera lo que se borró definitivamente en cualquier dispositivo
  const p=purgados(); if(!p.length||!(S.trash||[]).length)return false;
  const antes=S.trash.length;
  S.trash=S.trash.filter(x=>!p.includes(x.id));
  return S.trash.length!==antes;
}
function vTrash(){
  const p=purgados();
  const t=(S.trash||[]).filter(x=>!p.includes(x.id));
  return esSocio()?t.filter(x=>x.gestorId===SESSION.socioId):t;
}
async function borrarDefinitivo(id){

  const e=(S.trash||[]).find(x=>x.id===id); if(!e)return;

  if(!confirm(`¿Borrar DEFINITIVAMENTE ${tipo} "${e.nombre}"?\n\nEsto NO se puede deshacer: se elimina también de la nube y de todos los dispositivos.\n\nSi tenés dudas, dejalo en la papelera: no molesta ni afecta ninguna cuenta.`))return;

// borra de verdad: saca de la papelera, anota el purgado para todos los dispositivos y limpia la nube
async function purgarIds(ids){
  const items=(S.trash||[]).filter(x=>ids.includes(x.id));
  if(!items.length)return {n:0,nube:true};
  S.trash=(S.trash||[]).filter(x=>!ids.includes(x.id));
  S.settings.purgados=[...purgados().filter(x=>!ids.includes(x)),...ids].slice(-500);
  saveSettings(); // persiste y avisa a los otros dispositivos
  items.forEach(x=>{if(x.kind==='doc')idbDel(x.id);});
  let nube=true;
  if(FB.base){
    for(const id of ids){
      try{await FB.base.collection('items').doc(id).delete();}
      catch(err){console.error(err);nube=false;}
    }
  }else nube=false;
  persist();
  return {n:items.length,nube};
}
async function borrarSeleccionados(){

  const r=await purgarIds(ids);

    :`Se borraron ${r.n} de la lista ✅\nNo se pudo alcanzar la nube ahora mismo; se termina de limpiar cuando vuelva la conexión.`);
}
async function traerDataDeDoc(id){ // la imagen del documento borrado vive en la nube
  if(!FB.base)return null;
  try{const snap=await FB.base.collection('items').doc(id).get();
    const d=snap.data(); if(!d||!d.json)return null;
    const e=JSON.parse(d.json); return e.data||null;}catch(x){return null;}
}
async function restaurarDeLaPapelera(id){
  const e=(S.trash||[]).find(x=>x.id===id); if(!e)return;
  if(esSocio()&&e.gestorId!==SESSION.socioId)return alert('Eso no está asignado a tu cuenta.');
  const hijos=e.kind==='client'
    ?(S.trash||[]).filter(x=>x.id!==id&&x.obj&&x.obj.clientId===id):[];
  const txt=`¿Restaurar ${e.kind==='client'?'el cliente':e.kind==='loan'?'el préstamo':'el documento'} "${e.nombre}"?`
    +(hijos.length?`\n\nSe restauran también sus ${hijos.length} ítem(s) asociados (préstamos y documentos).`:'');
  if(!confirm(txt))return;
  for(const t of [e,...hijos])await revivir(t);
  S.trash=(S.trash||[]).filter(x=>x!==e&&!hijos.includes(x));
  persist();render();
  alert('Restaurado ✅');
}
async function revivir(t){
  const obj={...t.obj}; delete obj.deleted; touch(obj);
  if(t.kind==='client'){const i=S.clients.findIndex(x=>x.id===obj.id);
    if(i<0)S.clients.push(obj);else S.clients[i]=obj; fbPush('client',obj);}
  else if(t.kind==='loan'){const i=S.loans.findIndex(x=>x.id===obj.id);
    if(i<0)S.loans.push(obj);else S.loans[i]=obj; fbPush('loan',obj);}
  else if(t.kind==='draft'){const i=S.drafts.findIndex(x=>x.id===obj.id);
    if(i<0)S.drafts.push(obj);else S.drafts[i]=obj; fbPush('draft',obj);}
  else{
    if(!obj.data)obj.data=await traerDataDeDoc(obj.id);
    if(!obj.data){alert('El documento "'+(obj.nombre||'')+'" se restaura sin la imagen: no está en este dispositivo y no hay conexión con la nube.');}
    const i=S.docs.findIndex(x=>x.id===obj.id);
    if(i<0)S.docs.push(obj);else S.docs[i]=obj; idbPut(obj); fbPush('doc',obj);}
}
// Al renovar, el saldo pendiente se descuenta de lo que se le entrega al cliente: en los hechos
// esas cuotas se cobran en ese momento. Se registran como pagos reales para que cuenten en el
// balance, en la ganancia y en el calendario, en vez de quedar como "renovadas" sin cobrar.
function saldarPorRenovacion(v,cuando){
  let n=0,total=0;
  (v.cuotas||[]).forEach(c=>{
    const r=cRestante(c); if(r<=0)return;
    c.pagos=c.pagos||[];
    c.pagos.push({t:cuando||Date.now(),monto:r,mora:0,cobrador:0,renov:true});
    n++; total+=r;
  });
  return {n,total};
}
// marca la 1ª y la última cuota en los préstamos ya cargados (los nuevos se marcan al guardarse)
function migrarBordes(){
  let n=0;
  (S.loans||[]).forEach(l=>{
    const antes=JSON.stringify((l.cuotas||[]).map(c=>!!c.borde));
    marcarBordes(l);
    if(JSON.stringify((l.cuotas||[]).map(c=>!!c.borde))!==antes){n++;touch(l);fbPush('loan',l);}
  });
  if(n)persist();
  return n;
}
// arrastre para las renovaciones hechas antes de que existiera lo de arriba
function migrarRenovaciones(){
  let n=0,total=0,loans=0;
  (S.loans||[]).forEach(v=>{
    if(v.status!=='renovado')return;
    const nuevo=(S.loans||[]).find(x=>x.renovadoDe===v.id);
    const r=saldarPorRenovacion(v,(nuevo&&nuevo.createdAt)||v.updatedAt||Date.now());
    if(r.n){loans++;n+=r.n;total+=r.total;touch(v);fbPush('loan',v);}
  });
  if(loans)persist();
  return {loans,n,total};
}
function saveSettings(){touch(S.settings);persist();fbPushSettings();applyBiz();}

/* ================= FIREBASE SYNC ================= */
let FB={db:null,base:null,unsubs:[],status:'off'};
function fbCfg(){try{return JSON.parse(localStorage.getItem(LS+'-fb')||'null');}catch(e){return null;}}
function fbSetStatus(st,txt){FB.status=st;
  const d=$('#syncdot'),t=$('#synctxt');if(!d)return;
  d.className='syncdot'+(st==='on'?' on':st==='err'?' err':'');t.textContent=txt;}
function loadFBScripts(){
  if(window.firebase&&firebase.firestore)return Promise.resolve();
  const urls=['https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
              'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'];
  return urls.reduce((p,u)=>p.then(()=>new Promise((ok,err)=>{
    const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=err;document.head.appendChild(s);
  })),Promise.resolve());
}
function fbConnect(){
  const cfg=fbCfg(); if(!cfg||!cfg.config||!cfg.code)return;
  fbSetStatus('off','Conectando…');
  loadFBScripts().then(()=>{
    try{
      if(!firebase.apps.length)firebase.initializeApp(cfg.config);
      FB.db=firebase.firestore();
      try{FB.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
      FB.base=FB.db.collection('negocios').doc(cfg.code);
      FB.unsubs.forEach(u=>u());FB.unsubs=[];
      // items: clientes, préstamos y documentos
      FB.unsubs.push(FB.base.collection('items').onSnapshot(snap=>{
        let changed=false;
        snap.docChanges().forEach(ch=>{
          if(ch.type==='removed')return; // un documento eliminado de la nube no debe revivir en la papelera
          const d=ch.doc.data(); if(!d||!d.json)return;
          let ent; try{ent=JSON.parse(d.json);}catch(e){return;}
          const arr=['client','loan','doc','draft'].includes(d.kind)?arrDe(d.kind):null;
          if(!arr)return;
          const i=arr.findIndex(x=>x.id===ent.id);
          const localUp=i>=0?(arr[i].updatedAt||0):-1;
          if((ent.updatedAt||0)>localUp){
            if(ent.deleted){
              // lo que borró otro dispositivo (o un socio) queda en TU papelera y lo podés restaurar
              if(trashPush(d.kind,ent,''))changed=true;
              if(i>=0){arr.splice(i,1);changed=true;}
              if(d.kind==='doc')idbDel(ent.id);}
            else{if(i<0)arr.push(ent);else arr[i]=ent;changed=true;
              if(d.kind==='doc')idbPut(ent);}
          }
        });
        if(changed){persist();render();}
        fbSetStatus('on','Sincronizado');
      },err=>{console.error(err);fbSetStatus('err','Error de sincronización');}));
      // ajustes
      FB.unsubs.push(FB.base.collection('meta').doc('settings').onSnapshot(doc=>{
        const d=doc.data(); if(!d||!d.json)return;
        let st;try{st=JSON.parse(d.json);}catch(e){return;}
        if((st.updatedAt||0)>(S.settings.updatedAt||0)){
          const avPrev=S.settings.avisados; // los avisos del día no se pisan: se unen
          S.settings=normSettings(st);
          const hoy=todayStr();
          if(avPrev&&avPrev.date===hoy&&(avPrev.keys||[]).length){
            const inc=(S.settings.avisados&&S.settings.avisados.date===hoy)?(S.settings.avisados.keys||[]):[];
            S.settings.avisados={date:hoy,keys:[...new Set([...inc,...avPrev.keys])]};
          }
          podarPurgados(); // si en otro dispositivo borraron algo definitivamente, acá también desaparece
          persist();applyBiz();render();}
      }));
      // subir lo local que falte (primera conexión)
      FB.base.collection('items').get().then(snap=>{
        const remote={}; snap.forEach(doc=>{const d=doc.data();let e;try{e=JSON.parse(d.json);}catch(x){return;}
          remote[doc.id]=e.updatedAt||0;});
        // termina de limpiar lo que se borró definitivamente sin conexión
        purgados().forEach(id=>{if(id in remote)FB.base.collection('items').doc(id).delete().catch(()=>{});});
        [['client',S.clients],['loan',S.loans],['doc',S.docs],['draft',S.drafts]].forEach(([k,arr])=>{
          arr.forEach(o=>{if((o.updatedAt||0)>(remote[o.id]||0)||!(o.id in remote))fbPush(k,o);});
        });
        if((S.settings.updatedAt||0)>0)fbPushSettings();
      }).catch(()=>{});
      fbSetStatus('on','Sincronizado');
      setTimeout(fbCopiaDiaria,8000); // con los datos ya sincronizados
    }catch(e){console.error(e);fbSetStatus('err','Config inválida');}
  }).catch(()=>fbSetStatus('err','Sin conexión a Firebase'));
}
function fbPush(kind,obj){
  if(!FB.base)return;
  FB.base.collection('items').doc(obj.id)
    .set({kind,json:JSON.stringify(obj),updatedAt:obj.updatedAt||Date.now()})
    .catch(e=>{console.error(e);
      if((e&&e.code)==='invalid-argument')alert('Un documento es demasiado grande para sincronizar. Subí imágenes más livianas.');});
}
function fbPushSettings(){
  if(!FB.base)return;
  FB.base.collection('meta').doc('settings')
    .set({json:JSON.stringify(S.settings),updatedAt:S.settings.updatedAt}).catch(()=>{});
}
function fbDisconnect(){FB.unsubs.forEach(u=>u());FB.unsubs=[];FB.base=null;
  localStorage.removeItem(LS+'-fb');fbSetStatus('off','Sin sincronizar');}

/* ================= COPIAS DE SEGURIDAD AUTOMÁTICAS =================
   Una por día, guardada en tu propio Firebase, aparte de los datos vivos.
   No incluye las imágenes de los documentos (son lo pesado y siguen estando
   en los datos normales). Se guardan las de los últimos 45 días. */
const BK_DIAS=45, BK_MAX=900000;
function datosParaCopia(){
  return JSON.stringify({v:APP_VER,t:Date.now(),
    settings:S.settings,clients:S.clients,loans:S.loans,drafts:S.drafts||[]});
}
async function fbCopiaDiaria(){
  if(!FB.base||esSocio())return null;          // la hace el dueño, una vez por día
  const hoy=todayStr();
  if(localStorage.getItem(LS+'-bkdia')===hoy)return null; // ya se hizo en este dispositivo
  try{
    const ref=FB.base.collection('backups').doc(hoy);
    const ya=await ref.get();
    if(ya.exists){localStorage.setItem(LS+'-bkdia',hoy);return null;}
    const json=datosParaCopia();
    if(json.length>BK_MAX){console.warn('copia demasiado grande, se omite');return null;}
    await ref.set({json,t:Date.now(),v:APP_VER,
      nClients:(S.clients||[]).length,nLoans:(S.loans||[]).length,bytes:json.length});
    localStorage.setItem(LS+'-bkdia',hoy);
    podarCopias(); // no esperamos: si las reglas no dejan borrar, no pasa nada
    return hoy;
  }catch(e){console.error('copia diaria',e);return null;}
}
function podarCopias(){
  const corte=ymd(new Date(Date.now()-BK_DIAS*DAY));
  FB.base.collection('backups').get().then(snap=>{
    snap.forEach(d=>{if(d.id<corte)d.ref.delete().catch(()=>{});});
  }).catch(()=>{});
}
async function listarCopias(){
  if(!FB.base)return [];
  try{const snap=await FB.base.collection('backups').get();
    const out=[];snap.forEach(d=>{const x=d.data()||{};
      out.push({id:d.id,t:x.t||0,nClients:x.nClients||0,nLoans:x.nLoans||0,bytes:x.bytes||0});});
    return out.sort((a,b)=>a.id<b.id?1:-1);
  }catch(e){console.error(e);return [];}
}
async function restaurarCopia(fecha){
  if(esSocio())return alert('Solo el dueño puede restaurar una copia.');
  if(!FB.base)return alert('Necesitás la sincronización conectada para restaurar.');
  let d;
  try{d=(await FB.base.collection('backups').doc(fecha).get()).data();}catch(e){}
  if(!d||!d.json)return alert('No se encontró esa copia.');
  let p;try{p=JSON.parse(d.json);}catch(e){return alert('La copia está dañada.');}
  const nC=(p.clients||[]).length, nL=(p.loans||[]).length;
  if(!confirm(`Restaurar la copia del ${dLong(fecha)}\n\n`
    +`Contiene ${nC} cliente(s) y ${nL} préstamo(s).\n\n`
    +`Vuelve a dejar los datos como estaban ese día: lo que se haya borrado o cambiado después se recupera.\n`
    +`Lo que cargaste después NO se borra.\n\n¿Seguimos?`))return;
  if((prompt('Escribí RESTAURAR para confirmar:')||'').trim().toUpperCase()!=='RESTAURAR')return;
  const meter=(arr,tgt,kind)=>{(arr||[]).forEach(o=>{
    const i=tgt.findIndex(x=>x.id===o.id);
    const obj={...o}; touch(obj);
    if(i<0)tgt.push(obj); else tgt[i]=obj;
    fbPush(kind,obj);});};
  meter(p.clients,S.clients,'client');
  meter(p.loans,S.loans,'loan');
  meter(p.drafts,S.drafts,'draft');
  if(p.settings){const av=S.settings.avisados; // los avisos de hoy no se pisan
    S.settings=normSettings(p.settings); if(av)S.settings.avisados=av;
    touch(S.settings); fbPushSettings(); applyBiz();}
  persist();render();
  alert(`Listo ✅\nSe restauraron ${nC} cliente(s) y ${nL} préstamo(s) de la copia del ${dLong(fecha)}.`);
}
function formCopias(){
  modal(`<h3>💾 Copias de seguridad</h3>

  <div id="bk-lista"><div class="hint">Buscando copias…</div></div>

function cobrosDelDia(fecha,ls){ // cuotas PROGRAMADAS para ese día (lo que hay que cobrar)
  const out=[];
  (ls||vLoans()).forEach(l=>{if(l.status==='cancelado'||l.status==='renovado')return;
    l.cuotas.forEach(c=>{if(c.vence===fecha)out.push({l,c});});});
  return out;
}
function pagosDelDia(fecha,ls){ // pagos REALMENTE recibidos ese día, de todos los préstamos (incluye renovados)
  const out=[];
  (ls||vLoans()).forEach(l=>l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{
    if(ymd(new Date(p.t))===fecha)out.push({l,c,p});})));
  return out.sort((a,b)=>a.p.t-b.p.t);
}
function cobrosVencidos(){
  const t=todayStr(),out=[];
  vLoans().forEach(l=>{if(l.status==='cancelado'||l.status==='renovado')return;
    l.cuotas.forEach(c=>{if(cRestante(c)>0&&(c.vence<t||(c.vence===t&&Date.now()>dueAt(c.vence).getTime())))out.push({l,c});});});
  out.sort((a,b)=>a.c.vence<b.c.vence?-1:1);
  return out;
}
function sortVenc(arr,mode){
  const a=[...arr];
  const monto=x=>cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c);
  const nom=x=>(client(x.l.clientId)||{nombre:''}).nombre.toLowerCase();
  if(mode==='reciente')a.sort((x,y)=>x.c.vence<y.c.vence?1:x.c.vence>y.c.vence?-1:0);
  else if(mode==='monto')a.sort((x,y)=>monto(y)-monto(x));
  else if(mode==='cliente')a.sort((x,y)=>nom(x)<nom(y)?-1:nom(x)>nom(y)?1:(x.c.vence<y.c.vence?-1:1));
  else a.sort((x,y)=>x.c.vence<y.c.vence?-1:x.c.vence>y.c.vence?1:0); // 'atraso': más viejo primero
  return a;
}
function agruparPorCliente(arr){ // una fila por cliente, con todas sus cuotas adentro
  const map={};
  arr.forEach(x=>{const id=x.l.clientId;
    if(!map[id])map[id]={id,cl:client(id)||{nombre:'?'},items:[],total:0,extra:0,loans:new Set()};
    const g=map[id];
    g.items.push(x); g.loans.add(x.l.id);
    g.total+=cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c);
    g.extra+=moraDe(x.c)+cobradorDe(x.c);});
  return Object.values(map).map(g=>{
    g.items.sort((a,b)=>a.c.vence<b.c.vence?-1:1);
    g.vieja=g.items[0].c.vence;
    g.nueva=g.items[g.items.length-1].c.vence;
    g.atraso=Math.max(...g.items.map(x=>diasAtraso(x.c)));
    return g;});
}
function sortGrupos(gs,mode){
  const a=[...gs];
  if(mode==='reciente')a.sort((x,y)=>x.nueva<y.nueva?1:x.nueva>y.nueva?-1:0);
  else if(mode==='monto')a.sort((x,y)=>y.total-x.total);
  else if(mode==='cliente')a.sort((x,y)=>x.cl.nombre.toLowerCase().localeCompare(y.cl.nombre.toLowerCase()));
  else a.sort((x,y)=>x.vieja<y.vieja?-1:x.vieja>y.vieja?1:0); // 'atraso': el más viejo primero
  return a;
}

// ganancia ya embolsada de los préstamos terminados: lo cobrado por encima del capital de cada uno
// (interés + mora + cobrador). Incluye los renovados, cuyo saldo se cobró al renovar.
function ganadoCompletados(){
  const fin=vLoans().filter(l=>l.status==='pagado'||l.status==='renovado');
  let bruto=0;
  // un grupo por persona: primero el que mira, después cada contraparte
  const mio={key:'__yo__',nombre:esSocio()?'Mi parte':'Mi parte (dueño)',ini:'YO',monto:0,items:[]};
  const otros={};
  let gastos=0;
  fin.forEach(l=>{
    const g=loanGananciaRealizada(l), r=loanReparto(l);
    bruto+=g; gastos+=loanGastos(l);
    const propio=esSocio()?(r.socioParteReal||0):(r.miParteReal!=null?r.miParteReal:g);
    const pctPropio=r.compartido?(esSocio()?r.socioPct:r.miPct):100;
    mio.monto+=propio; mio.items.push({l,parte:propio,pct:pctPropio});
    if(r.compartido){
      const k=esSocio()?'Dueño del negocio':r.socioNom;
      const parte=esSocio()?(r.miParteReal||0):(r.socioParteReal||0);
      const pct=esSocio()?r.miPct:r.socioPct;
      if(!otros[k])otros[k]={key:'g:'+k,nombre:k,ini:ini(k),monto:0,items:[]};
      otros[k].monto+=parte; otros[k].items.push({l,parte,pct});
    }
  });
  const grupos=[mio,...Object.values(otros).sort((a,b)=>b.monto-a.monto)];
  grupos.forEach(g=>g.items.sort((a,b)=>b.parte-a.parte));
  return {n:fin.length,bruto,gastos,grupos,compartido:Object.keys(otros).length>0};
}

/* ================= CÓMO PAGA CADA CLIENTE =================
   Separa dos cosas distintas: si PAGA (riesgo real) y si paga A TIEMPO
   (molestia de cobranza, que además genera mora a favor tuyo). */
const DIAS_ABANDONO=30;
function cumplimiento(clientId){
  const ls=vLoans().filter(l=>l.clientId===clientId);
  const hoy=todayStr(), R={
    prestamos:ls.length,prestado:0,nuevo:0,cobrado:0,ganancia:0,mora:0,cobrador:0,
    enTermino:0,tarde:0,vencidas:0,abandonadas:0,neutras:0,
    atrasoProm:0,peorAtraso:0,renovados:0,acuerdos:0,canceladosConSaldo:0,
    deudaHoy:0,desde:'',tira:[]};
  let sumAtraso=0;
  ls.forEach(l=>{
    R.prestado+=l.monto||0;
    R.nuevo+=Math.max(0,(l.monto||0)-(l.refinanciado||0));
    R.cobrado+=loanTotalCobrado(l);
    R.ganancia+=loanGananciaRealizada(l);
    R.mora+=l.cuotas.reduce((a,c)=>a+cMoraPagada(c),0);
    R.cobrador+=l.cuotas.reduce((a,c)=>a+cCobradorPagado(c),0);
    if(l.status==='activo')R.deudaHoy+=loanDeudaTotal(l);
    if(l.status==='renovado')R.renovados++;
    if(l.acuerdo)R.acuerdos++;
    if(l.status==='cancelado'&&loanRestante(l)>0)R.canceladosConSaldo++;
    if(!R.desde||l.inicio<R.desde)R.desde=l.inicio;
    l.cuotas.forEach(c=>{
      const pagos=c.pagos||[], saldada=cRestante(c)<=0;
      // las saldadas por renovación o por un acuerdo no dicen nada de cómo paga
      const neutra=!!(c.esAcuerdo||c.congelada||pagos.some(p=>p.renov));
      let e=null;
      if(saldada&&neutra)e='neu';
      else if(saldada&&pagos.length){
        const ult=Math.max(...pagos.map(p=>p.t||0));
        if(ult<=dueAt(c.vence).getTime())e='ok';
        else{e='tarde';
          const d=Math.max(1,Math.round((ult-dueAt(c.vence).getTime())/DAY));
          sumAtraso+=d; if(d>R.peorAtraso)R.peorAtraso=d;}
      }
      else if(!saldada&&c.vence<hoy){
        const d=Math.round((pd(hoy).getTime()-pd(c.vence).getTime())/DAY);
        e=d>DIAS_ABANDONO?'mala':'venc';
      }
      if(!e)return; // cuota futura: no cuenta todavía
      R[{ok:'enTermino',tarde:'tarde',venc:'vencidas',mala:'abandonadas',neu:'neutras'}[e]]++;
      R.tira.push({v:c.vence,e});
    });
  });
  R.tira.sort((a,b)=>a.v<b.v?-1:1);
  R.evaluables=R.enTermino+R.tarde+R.vencidas+R.abandonadas;
  R.pct=R.evaluables?Math.round(R.enTermino*100/R.evaluables):0;
  R.atrasoProm=R.tarde?Math.round(sumAtraso/R.tarde):0;
  R.problemas=R.abandonadas>0||R.acuerdos>0||R.canceladosConSaldo>0;
  if(!ls.length)R.nivel='nuevo';
  else if(R.problemas)R.nivel='malo';
  else if(R.evaluables<5)R.nivel='poco';
  else if(R.pct>=80)R.nivel='bueno';
  else R.nivel='regular';
  return R;
}

  <div class="hint">${esc(cl.nombre)} · lo que se puso para poder cobrarlo. Se descuenta de la ganancia
  antes de repartir, y mueve el punto neutro: hasta cubrir capital + gastos no gana nadie.</div>
  <label>¿Cuánto? *</label>
  <input id="gs-monto" type="number" inputmode="decimal" value="${base?base.monto:''}" placeholder="15000">
  <label>¿En qué? *</label>
  <input id="gs-con" value="${base?esc(base.concepto):''}" placeholder="ej: pegada de carteles">
  <div class="chips" id="gs-sug">${['Pegada de carteles','Viaje de cobranza','Nafta','Llamadas','Otro gasto']
    .map(t=>`<button data-t="${esc(t)}">${t}</button>`).join('')}</div>
  <label>¿Cuándo?</label>
  <input id="gs-fecha" type="date" value="${todayStr()}" max="${todayStr()}">
  <div class="hint" id="gs-efecto"></div>
  <button class="btn" id="gs-save" style="margin-top:16px">💸 Anotar el gasto</button>`);
  const pintar=()=>{
    const m=+$('#gs-monto').value||0, r=loanReparto(l);
    const mioPct=esSocio()?r.socioPct:r.miPct, otroPct=esSocio()?r.miPct:r.socioPct;
    const otroNom=esSocio()?'el dueño':esc(r.socioNom||'');
    $('#gs-efecto').innerHTML=!m?'':r.compartido
      ? `Con este gasto, la ganancia a repartir pasa de ${fmt$(r.gananciaTotal)} a <b>${fmt$(r.gananciaTotal-m)}</b>:
         ${fmt$(Math.round(m*mioPct/100))} los ponés vos y ${fmt$(Math.round(m*otroPct/100))} ${otroNom}.`
      : `Con este gasto, la ganancia de este préstamo pasa de ${fmt$(r.gananciaTotal)} a <b>${fmt$(r.gananciaTotal-m)}</b>.`;
  };
  $('#gs-monto').oninput=pintar; pintar();
  $$('#gs-sug button').forEach(b=>b.onclick=()=>{$('#gs-con').value=b.dataset.t;});
  $('#gs-save').onclick=()=>{
    const m=Math.round(+$('#gs-monto').value||0);
    if(!m||m<=0)return alert('Poné cuánto gastaste');
    const con=$('#gs-con').value.trim();
    if(!con)return alert('Poné en qué lo gastaste');
    const f=$('#gs-fecha').value||todayStr();
    if(f>todayStr())return alert('No se puede anotar un gasto con fecha futura.');
    l.gastos=l.gastos||[];
    l.gastos.push({id:uid(),monto:m,concepto:con,fecha:f,t:Date.now(),
      por:nombreDeQuienMira()||SESSION.nombre||'', porId:esSocio()?SESSION.socioId:''});
    saveLoan(l);closeModal();render();
  };
}
// el dueño puede borrar cualquiera; el socio, solo los que cargó él
function puedeBorrarGasto(g){return !esSocio()||g.porId===SESSION.socioId;}
function borrarGasto(loanId,gastoId){
  const l=loan(loanId);if(!l||!puedeVer(l))return;
  const g=(l.gastos||[]).find(x=>x.id===gastoId);if(!g||!puedeBorrarGasto(g))return;
  if(!confirm(`¿Borrar este gasto?\n\n${g.concepto} · ${fmt$(g.monto)} del ${dLong(g.fecha)}\n\nLa ganancia del préstamo vuelve a subir ${fmt$(g.monto)}.`))return;
  l.gastos=l.gastos.filter(x=>x.id!==gastoId);
  saveLoan(l);render();
}

    <div class="t2" style="margin-top:6px">A esta altura tendrían que haber pagado <b>${fmt$(T.esperado)}</b> · vienen al <b style="color:${cumple>=95?'var(--green)':cumple>=75?'var(--gold)':'var(--red)'}">${cumple}%</b></div>
    ${T.atraso>0

      :'<div class="t2" style="color:var(--green);font-weight:700;margin-top:4px">✅ Están todos al día 🎉</div>'}
    <div class="t2" style="margin-top:6px;color:var(--muted)">Prestado en la calle ${fmt$(T.prestado)} · queda por cobrar ${fmt$(T.restante)}</div>`

/* ================= VISTA: PRÉSTAMOS ================= */
function loanTieneVencidas(l){return l.cuotas.some(c=>cRestante(c)>0&&diasAtraso(c)>0);}
function loanDebeHoy(l){ // deuda exigible a hoy: solo cuotas vencidas o que vencen hoy (+ mora y cobrador)
  if(l.status!=='activo')return 0;
  const t=todayStr();
  return l.cuotas.reduce((a,c)=>a+(c.vence<=t?cRestante(c)+moraDe(c)+cobradorDe(c):0),0);
}
function loanCuotasVencidasHoy(l){ // cuántas cuotas exigibles a hoy siguen impagas
  if(l.status!=='activo')return 0;
  const t=todayStr();
  return l.cuotas.filter(c=>c.vence<=t&&cRestante(c)>0).length;
}
function loanDeudaTotal(l){ // todo lo que resta, incluidas las cuotas futuras + mora acumulada
  if(l.status==='renovado')return 0; // el saldo pasó al préstamo nuevo: acá ya no se debe nada
  if(l.status!=='activo')return loanRestante(l);
  return l.cuotas.reduce((a,c)=>a+cRestante(c)+moraDe(c)+cobradorDe(c),0);
}
function rowLoan(l){
  const cl=client(l.clientId)||{nombre:'?'};
  const renov=l.status==='renovado'; // el saldo se descontó de lo entregado en el préstamo nuevo
  const pagado=loanPagadoCuotas(l)+loanDescuentos(l);
  const pct=renov?100:(l.total?Math.min(100,Math.round(pagado/l.total*100)):0);
  const next=renov?null:loanCuotasPend(l)[0];
  const late=loanTieneVencidas(l);
  const debeHoy=loanDebeHoy(l), deudaTot=loanDeudaTotal(l), nVenc=loanCuotasVencidasHoy(l);
  const badge=l.status==='pagado'?'<span class="badge b-ok">Pagado</span>'
    :l.status==='cancelado'?'<span class="badge b-fut">Cancelado</span>'
    :l.status==='renovado'?'<span class="badge b-com">Renovado</span>'
    :late?'<span class="badge b-ven">Atrasado</span>':'<span class="badge b-hoy">Activo</span>';
  return `<div class="item loanrow" data-loan="${l.id}">
    <div class="ava ${l.tipo==='comercial'?'shop':''}">${esc(ini(cl.nombre))}</div>
    <div class="mid"><div class="t1">${esc(cl.nombre)} ${badge} ${chapaNivel(l.clientId)}</div>
      <div class="t2">${l.tipo==='comercial'?'Comercial':'Personal'} · ${FREQ[l.frecuencia]} · ${l.cuotas.length} cuotas
      ${next?' · próx. '+dShort(next.vence):''}</div>
      ${l.acuerdo?`<div class="t2" style="color:var(--blue)">🤝 Deuda acordada en ${fmt$(l.acuerdo.monto)} · sin mora</div>`:''}
      ${debeHoy>0?`<div class="t2" style="color:var(--red);font-weight:700">🔴 Debe hoy ${fmt$(debeHoy)} · ${nVenc} cuota${nVenc===1?'':'s'}</div>`
        :renov?`<div class="t2" style="color:var(--blue)">🔄 Saldado con la renovación${loanRestante(l)>0?` (${fmt$(loanRestante(l))} pasaron al préstamo nuevo)`:''}</div>`
        :l.status==='activo'?'<div class="t2" style="color:var(--green)">✅ Al día</div>':''}
      <div class="progress"><i style="width:${pct}%"></i></div></div>
    <div class="end" style="margin-right:10px"><div class="m1" style="color:var(--gold)">${fmt$(l.monto)}</div><div class="m2">prestado</div></div>
    <div class="end"><div class="m1">${fmt$(deudaTot)}</div><div class="m2">${renov?'saldado':'debe en total · '+pct+'%'}</div></div>
  </div>`;
}
function vPrestamos(){
  let ls=[...vLoans()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(loanFilter==='activos')ls=ls.filter(l=>l.status==='activo');
  else if(loanFilter==='atrasados')ls=ls.filter(l=>l.status==='activo'&&loanTieneVencidas(l));
  else if(loanFilter==='pagados')ls=ls.filter(l=>l.status!=='activo');
  const sumPrestado=ls.reduce((a,l)=>a+(l.monto||0),0);
  const sumHoy=ls.reduce((a,l)=>a+loanDebeHoy(l),0);
  const sumDeuda=ls.reduce((a,l)=>a+loanDeudaTotal(l),0);
  return `
  <div class="chips">
    ${[['activos','Activos'],['atrasados','Atrasados'],['pagados','Finalizados'],['todos','Todos']].map(([k,t])=>
      `<button class="${loanFilter===k?'on':''}" data-lf="${k}">${t}</button>`).join('')}
  </div>
  ${ls.length?`<div class="resume balgrid">
    <div><div class="bn" style="color:var(--gold)">${fmt$(sumPrestado)}</div><div class="bl">plata prestada</div></div>
    <div><div class="bn" style="color:${sumHoy>0?'var(--red)':'var(--green)'}">${fmt$(sumHoy)}</div><div class="bl">deben hoy</div></div>

/* ================= WHATSAPP / ENVÍOS ================= */
function fbUrl(v){ // normaliza un usuario o link de Facebook a una URL abrible
  v=(v||'').trim(); if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  if(v.startsWith('@'))v=v.slice(1);
  if(/facebook\.com|fb\.com|fb\.me/i.test(v))return 'https://'+v.replace(/^\/+/,'');
  return 'https://facebook.com/'+v.replace(/^\/+/,'');
}
function waOpen(tel,texto){ // abre WhatsApp con el número del cliente y el texto listo para enviar
  const d=(tel||'').replace(/\D/g,'');
  if(!d){alert('Este cliente no tiene teléfono cargado. Agregalo en la ficha del cliente (con código de país, ej: 549351...).');return;}
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(texto),'_blank');
}
function copiarAlias(btn){ // copia el alias de cobro al portapapeles
  const a=(S.settings.alias||'').trim();
  if(!a)return alert('No tenés alias cargado. Agregalo en Ajustes → Negocio.');
  const ok=()=>{if(btn){const t=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>{btn.textContent=t;},1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(a).then(ok).catch(()=>prompt('Copiá el alias:',a));
  else prompt('Copiá el alias:',a);
}
const FREQ_ADJ={diaria:'diarios',semanal:'semanales',quincenal:'quincenales'}; // "4 pagos semanales"
function periodoPlural(freq,n){
  if(freq==='diaria')return n===1?'día':'días';
  if(freq==='semanal')return n===1?'semana':'semanas';
  if(freq==='quincenal')return n===1?'quincena':'quincenas';
  return n===1?'cuota':'cuotas';
}

// cláusula del descuento por pronto pago: solo si el préstamo puede tenerlo de verdad
function descuentoTyC(l){
  const d=S.settings.descuento||{};
  if(!d.activo||!(+d.pct>0)||l.frecuencia!=='diaria'||l.acuerdo)return '';
  const h=String(+d.hora||14).padStart(2,'0');
  const ej=Math.round((l.cuotas[0].monto||0)*(+d.pct)/100);
  return `*DESCUENTO POR PRONTO PAGO:* abonando la cuota completa antes de las ${h}:00 hs del día de vencimiento, `
    +`se le bonifica el ${d.pct}% de esa cuota (${fmt$(ej)} sobre ${fmt$(l.cuotas[0].monto)}). `
    +`El beneficio corre solo por la cuota que se cancela en su totalidad dentro de ese horario y no se acumula ni se traslada a cuotas vencidas.\n\n`;
}
function tycTexto(l){
  const cob=S.settings.cobrador||{dias:3,monto:15000};

  const alias=(S.settings.alias||'').trim();

  return `*IMPORTANTE*\n`

    +`La primera y última cuota no tienen tolerancia, es decir que el mismo día antes de dicho horario debe impactar el pago en el sistema; caso contrario su ficha pasa por sistema automático al cobrador y le va a estar debiendo los ${fmt$(Number(cob.monto)||0)} de sus honorarios más la cuota más la Mora correspondiente, y luego de no impactar el pago se procede tal y como marcan las pautas que leyó anteriormente. El resto de las cuotas tienen ${cob.dias} día${cob.dias==1?'':'s'} de tolerancia, ${moraTextoLargo(l)}.\n\n`

/* ----- RECORDATORIOS DE VENCIMIENTO ----- */
function recLista(tipo){
  const t=todayStr(), man=ymd(new Date(pd(t).getTime()+DAY)), out=[];
  vLoans().forEach(l=>{if(l.status!=='activo')return;
    l.cuotas.forEach(c=>{if(cRestante(c)<=0)return;
      if(tipo==='hoy'&&c.vence===t)out.push({l,c});
      else if(tipo==='manana'&&c.vence===man)out.push({l,c});
      else if(tipo==='vencido'&&c.vence<t)out.push({l,c});});});
  out.sort((a,b)=>a.c.vence<b.c.vence?-1:1);
  return out;
}
function recMsg(tipo,l,c){
  const cl=client(l.clientId)||{};
  const tpl=(S.settings.recordatorios||{})[tipo]||DEF_REC[tipo];
  const total=cRestante(c)+moraDe(c)+cobradorDe(c);
  // en un acuerdo, la cuota se numera dentro del plan acordado (1/3, 2/3…), no sobre el préstamo viejo
  const acs=c.esAcuerdo?cuotasAcuerdo(l):null;
  const map={
    '{nombre}':cl.nombre||'', '{cuota}':acs?(acs.indexOf(c)+1)+'/'+acs.length:c.n+'/'+l.cuotas.length,
    '{monto}':fmt$(cRestante(c)), '{mora}':fmt$(moraDe(c)), '{total}':fmt$(total),
    '{fecha}':dLong(c.vence), '{alias}':S.settings.alias||'',
    '{hora}':String(S.settings.horaLimite??18), '{negocio}':S.settings.nombreNegocio||''
  };
  let out=tpl; Object.entries(map).forEach(([k,v])=>out=out.split(k).join(v));
  return out;
}
/* "✓ avisado": vive en los ajustes sincronizados, así vale en todos los dispositivos
   y para vos y tus socios por igual. Se limpia solo al cambiar el día. */
function avisadosHoy(){
  const a=S.settings.avisados;
  return (a&&a.date===todayStr())?a:{date:todayStr(),keys:[]};
}
function avisadosSet(){return new Set(avisadosHoy().keys||[]);}
function avisadosMark(key){
  const a=avisadosHoy();
  if((a.keys||[]).includes(key))return false; // ya estaba marcado hoy
  a.keys=(a.keys||[]).concat([key]);
  S.settings.avisados=a;
  saveSettings();
  return true;
}
function avisadosUnmark(key){
  const a=avisadosHoy();
  a.keys=(a.keys||[]).filter(k=>k!==key);
  S.settings.avisados=a; saveSettings();
}
// los avisos que habían quedado guardados solo en este dispositivo pasan a los ajustes
function migrarAvisados(){
  let o=null;
  try{o=JSON.parse(localStorage.getItem(LS+'-avisados')||'null');}catch(e){}
  localStorage.removeItem(LS+'-avisados');
  if(!o||o.date!==todayStr()||!(o.keys||[]).length)return 0;
  const a=avisadosHoy(), antes=(a.keys||[]).length;
  a.keys=[...new Set([...(a.keys||[]),...o.keys])];
  if(a.keys.length===antes)return 0;
  S.settings.avisados=a; saveSettings();
  return a.keys.length-antes;
}
let recFilter='hoy';
function formRecordatorios(){
  const tipos=[['hoy','Vencen hoy'],['manana','Vencen mañana'],['vencido','Vencidos']];
  const lista=recLista(recFilter);
  const totalLista=lista.reduce((a,x)=>a+cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c),0);
  modal(`<h3>🔔 Recordatorios</h3>

/* ----- PDF nativo del contrato (jsPDF local, sin CDN) ----- */
function loadPdfLib(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve();
  if(window.__pdfLibPromise)return window.__pdfLibPromise;
  window.__pdfLibPromise=new Promise((ok,err)=>{
    const s=document.createElement('script');s.src='./jspdf.umd.min.js';
    s.onload=ok;s.onerror=()=>err(new Error('No se pudo cargar el generador de PDF'));
    document.head.appendChild(s);
  });
  return window.__pdfLibPromise;
}

function buildContratoPDF(l,tipo){
  const escalas=[1,.95,.9,.85,.8,.76,.72,.68,.64];
  for(let i=0;i<escalas.length;i++){
    const doc=armarContratoPDF(l,tipo,escalas[i]);
    if(doc.getNumberOfPages()===1||i===escalas.length-1)return doc;
  }
}

function balanceMes(y,m,ls){ // vista simple de caja del mes: cuánto salió y cuánto entró
  const base=ls||vLoans();
  let cobrado=0,baseC=0,moraC=0,cobC=0,nCobros=0;
  base.forEach(l=>{
    l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{const d=new Date(p.t);
      if(d.getFullYear()===y&&d.getMonth()===m){
        const base=p.monto||0,mo=p.mora||0,co=p.cobrador||0;
        cobrado+=base+mo+co;baseC+=base;moraC+=mo;cobC+=co;nCobros++;
      }}));});
  let prestado=0,nNuevos=0;
  base.forEach(l=>{if(!l.createdAt)return;const d=new Date(l.createdAt);
    if(d.getFullYear()===y&&d.getMonth()===m){prestado+=Math.max(0,(l.monto||0)-(l.refinanciado||0));nNuevos++;}});
  return {cobrado,baseC,moraC,cobC,nCobros,prestado,nNuevos,neto:cobrado-prestado};
}
// filtro del calendario: todo / solo lo mío (sin socio) / el de un socio
function pasaGestor(l,g){
  if(!g||g==='todos')return true;
  if(g==='mios')return !l.gestorId;
  return l.gestorId===g;
}

  return vLoans().filter(l=>pasaGestor(l,calGestor));
}

  ${balHTML}
  <div class="dow">${['lu','ma','mi','ju','vi','sá','do'].map(d=>'<span>'+d+'</span>').join('')}</div>

    return `<div class="item" ${rest>0?`data-cobrar="${l.id}|${c.n}"`:`data-loan="${l.id}"`}>
