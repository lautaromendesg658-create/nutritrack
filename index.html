<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrestaControl">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>PrestaControl — Gestión de Préstamos</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151821; --panel-2:#1c2030; --line:#2a3042;
    --gold:#f5c84c; --green:#3ddc84; --blue:#4d8dff; --red:#ff5d5d; --orange:#ff9f43;
    --txt:#f1f3f7; --muted:#8b93a7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{padding:env(safe-area-inset-top) 0 0 0;min-height:100vh}
  .wrap{padding:16px 16px 120px;max-width:980px;margin:0 auto}
  @media(min-width:700px){.wrap{padding-top:24px}}

  header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
  h1{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:-.5px;line-height:1.1}
  .sub{font-size:11px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .clockbox{text-align:right;flex-shrink:0}
  .clock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
  .clock small{font-size:14px;color:var(--gold)}
  .cdate{font-size:11px;color:var(--muted);text-transform:capitalize;margin-top:2px}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--muted);margin-right:5px;vertical-align:1px}
  .syncdot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .syncdot.err{background:var(--red)}
  .syncline{font-size:10px;color:var(--muted);margin-top:3px}

  /* tarjetas dashboard */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
  @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat .lbl{font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .stat .val{font-size:22px;font-weight:800;margin-top:7px;font-variant-numeric:tabular-nums}
  .stat .ex{font-size:11px;color:var(--muted);margin-top:3px}
  .stat.gold .val{color:var(--gold)} .stat.green .val{color:var(--green)}
  .stat.blue .val{color:var(--blue)} .stat.red .val{color:var(--red)}
  .stat.orange .val{color:var(--orange)}

  h2{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
  h2 .cnt{background:var(--panel-2);color:var(--muted);font-size:12px;padding:2px 9px;border-radius:99px;font-weight:700}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:none}
  .item:active{background:var(--panel-2)}
  .ava{width:42px;height:42px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--gold);flex-shrink:0}
  .ava.shop{color:var(--blue)}
  .item .mid{flex:1;min-width:0}
  .item .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* en pantallas angostas los montos del préstamo bajan a una 2da línea para no cortar nada */
  @media(max-width:620px){
    .item.loanrow{flex-wrap:wrap}
    .item.loanrow .mid{flex:1 1 calc(100% - 54px);min-width:0}
    .item.loanrow .end{flex:1 1 0;text-align:left;margin:6px 0 0!important}
    .item.loanrow .end:last-child{text-align:right}
  }
  .item .end{text-align:right;flex-shrink:0}
  .item .m1{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .item .m2{font-size:11px;color:var(--muted);margin-top:2px}
  .chev{font-size:11px;color:var(--muted);margin-left:2px}
  .clip{color:var(--blue);cursor:pointer;font-weight:600}
  .balgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
  .balgrid .bn{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .balgrid .bl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
  .rephdr:active{background:var(--panel-2)}
  .repbox{background:var(--panel-2);border-bottom:1px solid var(--line)}
  .repsub{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 24px;border-top:1px solid var(--line);cursor:pointer}
  .repsub:active{background:var(--bg)}
  .repsub .mid{flex:1;min-width:0}
  .repsub .t1{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repsub .end{flex-shrink:0;text-align:right}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-style:italic;font-size:14px;line-height:1.5}

  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.5px}
  .b-per{background:rgba(245,200,76,.13);color:var(--gold)}
  .b-com{background:rgba(77,141,255,.15);color:var(--blue)}
  .b-ok{background:rgba(61,220,132,.13);color:var(--green)}
  .b-hoy{background:rgba(245,200,76,.15);color:var(--gold)}
  .b-ven{background:rgba(255,93,93,.15);color:var(--red)}
  .b-fut{background:var(--panel-2);color:var(--muted)}
  .b-cob{background:rgba(255,159,67,.15);color:var(--orange)}

  button{font-family:inherit;cursor:pointer}
  .btn{border:none;border-radius:13px;padding:13px 18px;font-weight:800;font-size:14px;
    background:var(--gold);color:#14110a;width:100%;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--panel-2);color:var(--txt);border:1px solid var(--line)}
  .btn.green{background:var(--green);color:#06160d}
  .btn.red{background:rgba(255,93,93,.13);color:var(--red);border:1px solid rgba(255,93,93,.3)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.mini{width:auto;padding:8px 14px;font-size:12px;border-radius:10px}
  .btnrow{display:flex;gap:10px;margin-top:10px}
  .btnrow .btn{flex:1}

  /* formularios */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:13px;font-size:16px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:70px}
  .frow{display:flex;gap:10px}.frow>div{flex:1}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px;border-radius:9px;
    font-weight:700;font-size:13px}
  .seg button.on{background:var(--gold);color:#14110a}
  .dias{display:flex;gap:5px;flex-wrap:wrap}
  .dias button{flex:1;min-width:40px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:10px 2px;border-radius:10px;font-weight:700;font-size:12px}
  .dias button.on{background:var(--gold);color:#14110a;border-color:var(--gold)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .resume{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-top:14px;font-size:14px;line-height:1.8}
  .resume b{color:var(--gold)}

  /* modal */
  .ovl{position:fixed;inset:0;background:rgba(5,6,10,.78);backdrop-filter:blur(4px);z-index:50;
    display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.ovl{align-items:center}}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;
    max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:700px){.sheet{border-radius:22px}}
  .sheet h3{font-size:18px;font-weight:800;margin-bottom:4px}
  .sheet .x{position:sticky;float:right;top:0;background:var(--panel-2);border:1px solid var(--line);
    color:var(--muted);width:34px;height:34px;border-radius:99px;font-size:16px;font-weight:700}

  /* calendario */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
  .calhead button{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    width:40px;height:40px;border-radius:12px;font-size:18px}
  .calhead .mname{font-size:18px;font-weight:800;text-transform:capitalize}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .dow span{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cday{aspect-ratio:.92;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;
    font-weight:600;cursor:pointer;position:relative;min-width:0}
  .cday.off{opacity:.28}
  .cday.today{border-color:var(--gold);color:var(--gold)}
  .cday.sel{background:var(--panel-2);border-color:var(--gold)}
  .cday .amt{font-size:8.5px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .cday .dots{display:flex;gap:3px}
  .cday .dot{width:6px;height:6px;border-radius:99px}
  .d-ok{background:var(--green)} .d-ven{background:var(--red)} .d-pen{background:var(--blue)} .d-hoy{background:var(--gold)}

  /* docs */
  .docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .doc{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    aspect-ratio:1;position:relative;cursor:pointer}
  .doc img{width:100%;height:100%;object-fit:cover}
  .doc .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:30px}
  .doc .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(5,6,10,.75);font-size:9px;
    padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* cuotas */
  .cuota{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .cuota:last-child{border-bottom:none}
  .cuota .num{width:34px;height:34px;border-radius:10px;background:var(--panel-2);display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0}
  .cuota.pg .num{background:rgba(61,220,132,.13);color:var(--green)}
  .cuota.vn .num{background:rgba(255,93,93,.13);color:var(--red)}
  .cuota.hy .num{background:rgba(245,200,76,.15);color:var(--gold)}

  .chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:2px}
  .chips button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 15px;
    border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
  .chips button.on{background:var(--gold);color:#14110a;border-color:var(--gold)}

  .search{position:relative;margin:12px 0}
  .search input{padding-left:38px}
  .search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}

  .back{background:none;border:none;color:var(--gold);font-weight:800;font-size:14px;padding:4px 0;margin-bottom:8px}
  .fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:60px;height:60px;
    border-radius:99px;background:var(--gold);color:#14110a;border:none;font-size:30px;font-weight:300;
    box-shadow:0 8px 28px rgba(0,0,0,.55);z-index:30;display:none}
  .progress{height:6px;background:#0d0f15;border-radius:99px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,13,18,.88);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:25}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:11px 0 9px;
    font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .i{font-size:20px}
  .tabs button.active{color:var(--gold)}

  details{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  summary{font-weight:700;font-size:13px;cursor:pointer;color:var(--gold)}
  details ol{margin:10px 0 4px 18px;font-size:13px;line-height:1.7;color:var(--txt)}
  details code{background:#0d0f15;padding:2px 5px;border-radius:5px;font-size:11px;display:inline-block;max-width:100%;overflow-x:auto;white-space:pre;vertical-align:middle}
  pre.rules{background:#0d0f15;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:10.5px;
    overflow-x:auto;margin:8px 0;line-height:1.5}
  .wamsg{color:#25D366;font-weight:800}

  /* pantalla de bloqueo */
  #lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px}
  #lock.show{display:flex}
  .lockbox{width:100%;max-width:380px}
  .lockbox .logo{text-align:center;margin-bottom:26px}
  .lockbox .logo .ic{font-size:46px}
  .lockbox h1{font-size:28px;text-align:center}
  .lockbox .sub{text-align:center}
  .lockerr{color:var(--red);font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:18px}
  .lockfoot{text-align:center;margin-top:22px}
  .lockfoot button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline}

  /* visor de contrato integrado (window.open no anda en la app instalada) */
  .cview{position:fixed;inset:0;z-index:120;background:#272b33;display:flex;flex-direction:column}
  .cview .cbar{display:flex;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0d2e47}
  .cview .cbar button{flex:1;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14px}
  .cview .cclose{background:rgba(255,255,255,.14);color:#fff;flex:0 0 56px}
  .cview .cwa{background:#25D366;color:#fff}
  .cview .cprint{background:#1f9d7a;color:#fff}
  .cview iframe{flex:1;width:100%;border:none;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="bizname">PrestaControl</h1>
      <div class="sub">Gestión de préstamos</div>
    </div>
    <div class="clockbox">
      <div class="clock" id="clock">--:--<small>:--</small></div>
      <div class="cdate" id="cdate"></div>
      <div class="syncline"><span class="syncdot" id="syncdot"></span><span id="synctxt">Sin sincronizar</span></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab">+</button>

<nav class="tabs">
  <button data-v="inicio" class="active"><span class="i">📊</span>Inicio</button>
  <button data-v="clientes"><span class="i">👥</span>Clientes</button>
  <button data-v="prestamos"><span class="i">💵</span>Préstamos</button>
  <button data-v="calendario"><span class="i">📅</span>Calendario</button>
  <button data-v="ajustes"><span class="i">⚙️</span>Ajustes</button>
</nav>

<div id="modal"></div>
<div id="lock"></div>

<script>
/* ================= ESTADO ================= */
const LS='prestacontrol-v1';
const APP_VER=42; // mantener a la par del número de caché en sw.js
const DEF_REC={
  hoy:'Hola {nombre}! Te recordamos que HOY vence tu cuota {cuota} de {monto}, a abonar antes de las {hora} hs al alias {alias}. ¡Gracias! — {negocio}',
  manana:'Hola {nombre}! Te recordamos que mañana ({fecha}) vence tu cuota {cuota} de {monto}. Podés abonar al alias {alias}. ¡Gracias! — {negocio}',
  vencido:'Hola {nombre}, tu cuota {cuota} venció el {fecha}. A hoy debés {total} (incluye mora). Por favor regularizá al alias {alias} para evitar el cargo del cobrador. — {negocio}'
};
const DEF_SETTINGS={
  nombreNegocio:'Mi Negocio', moneda:'$', alias:'PRESTAMOSPPP.1986',
  mora:{tipo:'pct', valor:10, porDia:false}, horaLimite:18,
  cobrador:{monto:0, dias:3},
  diasNoLaborables:[0,6], // días que no cuentan para la mora (0=dom … 6=sáb). Por defecto sáb y dom
  capitalPropio:0, // plata propia que el dueño puso de su bolsillo (para medir la ganancia real)
  socios:[],
  recordatorios:{...DEF_REC},
  updatedAt:0
};
// completa cualquier campo faltante en los ajustes (p. ej. si vienen de una versión vieja o de la nube)
function normSettings(st){st=st||{};
  return {...DEF_SETTINGS,...st,
    mora:{...DEF_SETTINGS.mora,...(st.mora||{})},
    cobrador:{...DEF_SETTINGS.cobrador,...(st.cobrador||{})},
    diasNoLaborables:Array.isArray(st.diasNoLaborables)?st.diasNoLaborables:[0,6],
    socios:st.socios||[],
    recordatorios:{...DEF_REC,...(st.recordatorios||{})}};
}
let S={settings:{...DEF_SETTINGS}, clients:[], loans:[], docs:[]};
try{const raw=localStorage.getItem(LS); if(raw){const p=JSON.parse(raw);
  S={settings:normSettings(p.settings),
    clients:p.clients||[], loans:p.loans||[], docs:p.docs||[]};}}catch(e){}

// Los documentos (imágenes) viven en IndexedDB, que tiene mucho más espacio que
// localStorage (iPhone limita localStorage a ~5MB). En localStorage queda solo lo liviano.
function persist(){try{
  localStorage.setItem(LS,JSON.stringify({settings:S.settings,clients:S.clients,loans:S.loans}));
}catch(e){
  if((e+'').includes('uota'))alert('Atención: el almacenamiento local está lleno. Cerrá y volvé a abrir la app para liberar espacio; si persiste, avisale a tu desarrollador.');}}

/* ----- IndexedDB para documentos ----- */
let _idb=null;
function idb(){return _idb?Promise.resolve(_idb):new Promise((ok,err)=>{
  const r=indexedDB.open('prestacontrol',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});};
  r.onsuccess=()=>{_idb=r.result;ok(_idb);};
  r.onerror=()=>err(r.error);});}
function idbPut(d){return idb().then(db=>new Promise((ok,err)=>{
  const t=db.transaction('docs','readwrite');t.objectStore('docs').put(d);
  t.oncomplete=ok;t.onerror=()=>err(t.error);})).catch(e=>console.error('idbPut',e));}
function idbDel(id){return idb().then(db=>new Promise((ok,err)=>{
  const t=db.transaction('docs','readwrite');t.objectStore('docs').delete(id);
  t.oncomplete=ok;t.onerror=()=>err(t.error);})).catch(e=>console.error('idbDel',e));}
function idbAll(){return idb().then(db=>new Promise((ok,err)=>{
  const rq=db.transaction('docs').objectStore('docs').getAll();
  rq.onsuccess=()=>ok(rq.result||[]);rq.onerror=()=>err(rq.error);})).catch(()=>[]);}
async function docsInit(){ // migra documentos viejos de localStorage a IndexedDB y carga todo
  const enIdb=await idbAll(), map={};
  enIdb.forEach(d=>map[d.id]=d);
  (S.docs||[]).forEach(d=>{ // docs que venían en el blob viejo de localStorage o de sync temprano
    if(!map[d.id]||(d.updatedAt||0)>(map[d.id].updatedAt||0)){map[d.id]=d;idbPut(d);}
  });
  S.docs=Object.values(map);
  persist(); // reescribe localStorage sin las imágenes → libera el espacio lleno
}
let DOCS_READY=false;
docsInit().catch(e=>console.error('docsInit',e)).finally(()=>{DOCS_READY=true;if(typeof UNLOCKED!=='undefined'&&UNLOCKED)render();});

/* ================= UTILS ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DAY=86400000;

/* ================= LÓGICA DE CUOTAS / MORA ================= */
function cPagadoBase(c){return (c.pagos||[]).reduce((a,p)=>a+(p.monto||0),0);} // solo lo aplicado a la cuota
function cTotalRecibido(c){ // toda la plata que entró por esta cuota: cuota + mora + cobrador
  return (c.pagos||[]).reduce((a,p)=>a+(p.monto||0)+(p.mora||0)+(p.cobrador||0),0);}
function cMoraPagada(c){return (c.pagos||[]).reduce((a,p)=>a+(p.mora||0),0);}
function cCobradorPagado(c){return (c.pagos||[]).reduce((a,p)=>a+(p.cobrador||0),0);}
function cRestante(c){return Math.max(0,c.monto-cPagadoBase(c));}
function diasAtraso(c){ // días HÁBILES de mora (los días no laborables configurados no cuentan)
  if(cRestante(c)<=0)return 0;
  const now=Date.now(), hl=S.settings.horaLimite??18;
  const noLab=S.settings.diasNoLaborables||[];
  const[Y,M,D]=c.vence.split('-').map(Number);
  let d=new Date(Y,M-1,D), count=0, guard=0;
  while(guard++<4000){
    const limDia=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hl,0,0).getTime();
    if(limDia>=now)break;               // este día todavía no pasó su hora límite
    if(!noLab.includes(d.getDay()))count++; // solo suma en días laborables
    d.setDate(d.getDate()+1);
  }
  return count;
}
function moraDe(c){ // mora pendiente de cobro
  const d=diasAtraso(c); if(d<=0)return 0;
  const m=S.settings.mora;
  let base=m.tipo==='pct'?c.monto*m.valor/100:Number(m.valor)||0;
  let tot=m.porDia?base*d:base;
  return Math.max(0,Math.round(tot)-cMoraPagada(c));
}
function cobradorDe(c){ // cargo de cobrador pendiente
  const d=diasAtraso(c);
  if(d<= (S.settings.cobrador.dias||3))return 0;
  return Math.max(0,Math.round(Number(S.settings.cobrador.monto)||0)-cCobradorPagado(c));
}
function estadoCuota(c){
  if(cRestante(c)<=0)return 'pagada';
  if(c.vence===todayStr())return Date.now()>dueAt(c.vence).getTime()?'vencida':'hoy';
  return c.vence<todayStr()?'vencida':'futura';
}
function loanCuotasPend(l){return l.cuotas.filter(c=>cRestante(c)>0);}
function loanRestante(l){return l.cuotas.reduce((a,c)=>a+cRestante(c),0);}
function loanGanancia(l){return Math.max(0,(l.total||0)-(l.monto||0));}
function loanExtrasCobrados(l){ // mora + cobrador efectivamente cobrados (también se reparten)
  return l.cuotas.reduce((a,c)=>a+cMoraPagada(c)+cCobradorPagado(c),0);
}
function loanGananciaProyectada(l){ // interés + extras ya cobrados
  return loanGanancia(l)+loanExtrasCobrados(l);
}
function loanTotalCobrado(l){ // todo lo cobrado del préstamo: cuotas + mora + cobrador
  return (l.total-loanRestante(l))+loanExtrasCobrados(l);
}
function loanGananciaRealizada(l){ // recién es ganancia lo que se cobra por encima del capital prestado (punto neutro)
  return Math.max(0, loanTotalCobrado(l)-(l.monto||0));
}
function loanFaltaParaNeutro(l){ // cuánto falta cobrar de este préstamo para recuperar el capital
  return Math.max(0, (l.monto||0)-loanTotalCobrado(l));
}
function socioNombre(id){
  const s=(S.settings.socios||[]).find(x=>x.id===id);
  return s?s.nombre:null;
}
function loanReparto(l){ // devuelve {socioNom, socioPct, miPct, gananciaTotal, miParte, socioParte, realizada{...}}
  const g=loanGananciaProyectada(l), gr=loanGananciaRealizada(l);
  if(!l.gestorId||!l.gestorPct){return {compartido:false, gananciaTotal:g, miParteTotal:g, miParteReal:gr};}
  const sp=Math.max(0,Math.min(100,l.gestorPct)), mp=100-sp;
  const nom=socioNombre(l.gestorId)||l.gestorNombre||'Socio';
  return {compartido:true, socioNom:nom, socioPct:sp, miPct:mp, gananciaTotal:g,
    socioParteTotal:Math.round(g*sp/100), miParteTotal:Math.round(g*mp/100),
    socioParteReal:Math.round(gr*sp/100), miParteReal:Math.round(gr*mp/100)};
}
function refreshLoanStatus(l){
  if(l.status==='cancelado'||l.status==='renovado')return;
  l.status=loanRestante(l)<=0?'pagado':'activo';
}
function genCuotas(total,n,freq,inicio,skipSun){
  const step=FREQ_DAYS[freq]||1;
  const cuota=Math.floor(total/n), resto=total-cuota*n;
  const out=[]; let d=pd(inicio);
  for(let i=0;i<n;i++){
    if(freq==='diaria'&&skipSun){while(d.getDay()===0)d=new Date(d.getTime()+DAY);}
    out.push({n:i+1,vence:ymd(d),monto:cuota+(i===n-1?resto:0),pagos:[]});
    d=new Date(d.getTime()+step*DAY);
  }
  return out;
}

/* ================= MUTACIONES + SYNC ================= */
function touch(o){o.updatedAt=Date.now();return o;}
function saveClient(c){touch(c);const i=S.clients.findIndex(x=>x.id===c.id);
  if(i<0)S.clients.push(c);else S.clients[i]=c; persist(); fbPush('client',c);}
function saveLoan(l){refreshLoanStatus(l);touch(l);const i=S.loans.findIndex(x=>x.id===l.id);
  if(i<0)S.loans.push(l);else S.loans[i]=l; persist(); fbPush('loan',l);}
function saveDoc(d){touch(d);const i=S.docs.findIndex(x=>x.id===d.id);
  if(i<0)S.docs.push(d);else S.docs[i]=d; idbPut(d); persist(); fbPush('doc',d);}
function delEntity(kind,obj){ // tombstone para que la baja se propague a otros dispositivos
  touch(obj); obj.deleted=true; fbPush(kind,obj);
  const arr=kind==='client'?S.clients:kind==='loan'?S.loans:S.docs;
  const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr.splice(i,1);
  if(kind==='doc')idbDel(obj.id);
  persist();
}
function saveSettings(){touch(S.settings);persist();fbPushSettings();applyBiz();}

/* ================= FIREBASE SYNC ================= */
let FB={db:null,base:null,unsubs:[],status:'off'};
function fbCfg(){try{return JSON.parse(localStorage.getItem(LS+'-fb')||'null');}catch(e){return null;}}
function fbSetStatus(st,txt){FB.status=st;
  const d=$('#syncdot'),t=$('#synctxt');if(!d)return;
  d.className='syncdot'+(st==='on'?' on':st==='err'?' err':'');t.textContent=txt;}
function loadFBScripts(){
  if(window.firebase&&firebase.firestore)return Promise.resolve();
  const urls=['https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
              'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'];
  return urls.reduce((p,u)=>p.then(()=>new Promise((ok,err)=>{
    const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=err;document.head.appendChild(s);
  })),Promise.resolve());
}
function fbConnect(){
  const cfg=fbCfg(); if(!cfg||!cfg.config||!cfg.code)return;
  fbSetStatus('off','Conectando…');
  loadFBScripts().then(()=>{
    try{
      if(!firebase.apps.length)firebase.initializeApp(cfg.config);
      FB.db=firebase.firestore();
      try{FB.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
      FB.base=FB.db.collection('negocios').doc(cfg.code);
      FB.unsubs.forEach(u=>u());FB.unsubs=[];
      // items: clientes, préstamos y documentos
      FB.unsubs.push(FB.base.collection('items').onSnapshot(snap=>{
        let changed=false;
        snap.docChanges().forEach(ch=>{
          const d=ch.doc.data(); if(!d||!d.json)return;
          let ent; try{ent=JSON.parse(d.json);}catch(e){return;}
          const arr=d.kind==='client'?S.clients:d.kind==='loan'?S.loans:d.kind==='doc'?S.docs:null;
          if(!arr)return;
          const i=arr.findIndex(x=>x.id===ent.id);
          const localUp=i>=0?(arr[i].updatedAt||0):-1;
          if((ent.updatedAt||0)>localUp){
            if(ent.deleted){if(i>=0){arr.splice(i,1);changed=true;}
              if(d.kind==='doc')idbDel(ent.id);}
            else{if(i<0)arr.push(ent);else arr[i]=ent;changed=true;
              if(d.kind==='doc')idbPut(ent);}
          }
        });
        if(changed){persist();render();}
        fbSetStatus('on','Sincronizado');
      },err=>{console.error(err);fbSetStatus('err','Error de sincronización');}));
      // ajustes
      FB.unsubs.push(FB.base.collection('meta').doc('settings').onSnapshot(doc=>{
        const d=doc.data(); if(!d||!d.json)return;
        let st;try{st=JSON.parse(d.json);}catch(e){return;}
        if((st.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=normSettings(st);persist();applyBiz();render();}
      }));
      // subir lo local que falte (primera conexión)
      FB.base.collection('items').get().then(snap=>{
        const remote={}; snap.forEach(doc=>{const d=doc.data();let e;try{e=JSON.parse(d.json);}catch(x){return;}
          remote[doc.id]=e.updatedAt||0;});
        [['client',S.clients],['loan',S.loans],['doc',S.docs]].forEach(([k,arr])=>{
          arr.forEach(o=>{if((o.updatedAt||0)>(remote[o.id]||0)||!(o.id in remote))fbPush(k,o);});
        });
        if((S.settings.updatedAt||0)>0)fbPushSettings();
      }).catch(()=>{});
      fbSetStatus('on','Sincronizado');
    }catch(e){console.error(e);fbSetStatus('err','Config inválida');}
  }).catch(()=>fbSetStatus('err','Sin conexión a Firebase'));
}
function fbPush(kind,obj){
  if(!FB.base)return;
  FB.base.collection('items').doc(obj.id)
    .set({kind,json:JSON.stringify(obj),updatedAt:obj.updatedAt||Date.now()})
    .catch(e=>{console.error(e);
      if((e&&e.code)==='invalid-argument')alert('Un documento es demasiado grande para sincronizar. Subí imágenes más livianas.');});
}
function fbPushSettings(){
  if(!FB.base)return;
  FB.base.collection('meta').doc('settings')
    .set({json:JSON.stringify(S.settings),updatedAt:S.settings.updatedAt}).catch(()=>{});
}
function fbDisconnect(){FB.unsubs.forEach(u=>u());FB.unsubs=[];FB.base=null;
  localStorage.removeItem(LS+'-fb');fbSetStatus('off','Sin sincronizar');}

/* ================= VISTA: INICIO ================= */
function cobrosDelDia(fecha){
  const out=[];
  S.loans.forEach(l=>{if(l.status==='cancelado'||l.status==='renovado')return;
    l.cuotas.forEach(c=>{if(c.vence===fecha)out.push({l,c});});});
  return out;
}
function cobrosVencidos(){
  const t=todayStr(),out=[];
  S.loans.forEach(l=>{if(l.status==='cancelado'||l.status==='renovado')return;
    l.cuotas.forEach(c=>{if(cRestante(c)>0&&(c.vence<t||(c.vence===t&&Date.now()>dueAt(c.vence).getTime())))out.push({l,c});});});
  out.sort((a,b)=>a.c.vence<b.c.vence?-1:1);
  return out;
}
function sortVenc(arr,mode){
  const a=[...arr];
  const monto=x=>cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c);
  const nom=x=>(client(x.l.clientId)||{nombre:''}).nombre.toLowerCase();
  if(mode==='reciente')a.sort((x,y)=>x.c.vence<y.c.vence?1:x.c.vence>y.c.vence?-1:0);
  else if(mode==='monto')a.sort((x,y)=>monto(y)-monto(x));
  else if(mode==='cliente')a.sort((x,y)=>nom(x)<nom(y)?-1:nom(x)>nom(y)?1:(x.c.vence<y.c.vence?-1:1));
  else a.sort((x,y)=>x.c.vence<y.c.vence?-1:x.c.vence>y.c.vence?1:0); // 'atraso': más viejo primero
  return a;
}
function vInicio(){
  const t=todayStr();
  const activos=S.loans.filter(l=>l.status==='activo');
  const prestado=activos.reduce((a,l)=>a+l.monto,0);
  const porCobrar=activos.reduce((a,l)=>a+loanRestante(l),0);
  const hoy=cobrosDelDia(t).filter(x=>cRestante(x.c)>0);
  const hoyMonto=hoy.reduce((a,x)=>a+cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c),0);
  const venc=cobrosVencidos();
  const vencMonto=venc.reduce((a,x)=>a+cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c),0);
  let cobradoHoy=0;
  S.loans.forEach(l=>l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{
    if(ymd(new Date(p.t))===t)cobradoHoy+=(p.monto||0)+(p.mora||0)+(p.cobrador||0);})));
  const interes=activos.reduce((a,l)=>a+(l.total-l.monto),0);

  // reparto de ganancias por socio (sobre préstamos activos)
  let miTotal=0,miReal=0; const misLoans=[]; const porSocio={};
  activos.forEach(l=>{const r=loanReparto(l);
    miTotal+=r.miParteTotal||0; miReal+=r.miParteReal||0;
    misLoans.push({l,parte:r.miParteTotal||0,pct:r.compartido?r.miPct:100});
    if(r.compartido){const k=r.socioNom;
      if(!porSocio[k])porSocio[k]={total:0,real:0,loans:[]};
      porSocio[k].total+=r.socioParteTotal; porSocio[k].real+=r.socioParteReal;
      porSocio[k].loans.push({l,parte:r.socioParteTotal,pct:r.socioPct});}});
  const haySocios=Object.keys(porSocio).length>0;
  const subItems=(loans,color)=>loans.length?loans.map(({l,parte,pct})=>{

      <div class="mid"><div class="t1">${esc(cl.nombre)}</div>

      <div class="ava ${cl.tipo==='comercio'?'shop':''}">${esc(ini(cl.nombre))}</div>

/* ================= VISTA: PRÉSTAMOS ================= */
function loanTieneVencidas(l){return l.cuotas.some(c=>cRestante(c)>0&&diasAtraso(c)>0);}
function loanDebeHoy(l){ // deuda exigible a hoy: solo cuotas vencidas o que vencen hoy (+ mora y cobrador)
  if(l.status!=='activo')return 0;
  const t=todayStr();
  return l.cuotas.reduce((a,c)=>a+(c.vence<=t?cRestante(c)+moraDe(c)+cobradorDe(c):0),0);
}
function loanCuotasVencidasHoy(l){ // cuántas cuotas exigibles a hoy siguen impagas
  if(l.status!=='activo')return 0;
  const t=todayStr();
  return l.cuotas.filter(c=>c.vence<=t&&cRestante(c)>0).length;
}
function balanceGlobal(){ // foto real del negocio: cuánto pusiste, cuánto hay, cuánto ganaste
  let cuotasC=0,moraC=0,cobC=0,prestado=0,nPrest=0;
  S.loans.forEach(l=>{
    // efectivo que realmente salió de tu bolsillo (en renovaciones solo la diferencia)
    prestado+=Math.max(0,(l.monto||0)-(l.refinanciado||0)); nPrest++;
    l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{
      cuotasC+=p.monto||0; moraC+=p.mora||0; cobC+=p.cobrador||0;}));
  });
  const cobrado=cuotasC+moraC+cobC;                     // efectivo que realmente entró
  const capital=Math.max(0,Number(S.settings.capitalPropio)||0);
  const caja=capital+cobrado-prestado;                  // plata libre para volver a prestar
  const activos=S.loans.filter(l=>l.status==='activo');
  const calle=activos.reduce((a,l)=>a+loanRestante(l),0); // lo que te deben (NO cuenta como ganancia)
  const moraPend=activos.reduce((a,l)=>a+l.cuotas.reduce((x,c)=>x+moraDe(c)+cobradorDe(c),0),0);
  // GANANCIA COBRADA: por cada préstamo, lo que se cobró por encima de su capital. Solo efectivo real.
  const gananciaCobrada=S.loans.reduce((a,l)=>a+loanGananciaRealizada(l),0);
  const capitalDevuelto=cobrado-gananciaCobrada;        // la parte de lo cobrado que fue recuperar capital
  const rentCobrada=capital>0?gananciaCobrada/capital*100:0;
  // proyección (si cobrás todo lo pendiente), se muestra aparte
  const gananciaSiCobraTodo=caja+calle-capital;
  const incobrable=S.loans.filter(l=>l.status==='cancelado').reduce((a,l)=>a+loanRestante(l),0);
  return {capital,cobrado,cuotasC,moraC,cobC,prestado,caja,calle,moraPend,
    gananciaCobrada,capitalDevuelto,rentCobrada,gananciaSiCobraTodo,nPrest,incobrable};
}
function loanDeudaTotal(l){ // todo lo que resta, incluidas las cuotas futuras + mora acumulada
  if(l.status!=='activo')return loanRestante(l);
  return l.cuotas.reduce((a,c)=>a+cRestante(c)+moraDe(c)+cobradorDe(c),0);
}
function rowLoan(l){
  const cl=client(l.clientId)||{nombre:'?'};
  const pagado=l.total-loanRestante(l), pct=l.total?Math.round(pagado/l.total*100):0;

/* ================= WHATSAPP / ENVÍOS ================= */
function fbUrl(v){ // normaliza un usuario o link de Facebook a una URL abrible
  v=(v||'').trim(); if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  if(v.startsWith('@'))v=v.slice(1);
  if(/facebook\.com|fb\.com|fb\.me/i.test(v))return 'https://'+v.replace(/^\/+/,'');
  return 'https://facebook.com/'+v.replace(/^\/+/,'');
}
function waOpen(tel,texto){ // abre WhatsApp con el número del cliente y el texto listo para enviar
  const d=(tel||'').replace(/\D/g,'');
  if(!d){alert('Este cliente no tiene teléfono cargado. Agregalo en la ficha del cliente (con código de país, ej: 549351...).');return;}
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(texto),'_blank');
}
function copiarAlias(btn){ // copia el alias de cobro al portapapeles
  const a=(S.settings.alias||'').trim();
  if(!a)return alert('No tenés alias cargado. Agregalo en Ajustes → Negocio.');
  const ok=()=>{if(btn){const t=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>{btn.textContent=t;},1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(a).then(ok).catch(()=>prompt('Copiá el alias:',a));
  else prompt('Copiá el alias:',a);
}
function periodoPlural(freq,n){
  if(freq==='diaria')return n===1?'día':'días';
  if(freq==='semanal')return n===1?'semana':'semanas';
  if(freq==='quincenal')return n===1?'quincena':'quincenas';
  return n===1?'cuota':'cuotas';
}

/* ----- RECORDATORIOS DE VENCIMIENTO ----- */
function recLista(tipo){
  const t=todayStr(), man=ymd(new Date(pd(t).getTime()+DAY)), out=[];
  S.loans.forEach(l=>{if(l.status!=='activo')return;
    l.cuotas.forEach(c=>{if(cRestante(c)<=0)return;
      if(tipo==='hoy'&&c.vence===t)out.push({l,c});
      else if(tipo==='manana'&&c.vence===man)out.push({l,c});
      else if(tipo==='vencido'&&c.vence<t)out.push({l,c});});});
  out.sort((a,b)=>a.c.vence<b.c.vence?-1:1);
  return out;
}
function recMsg(tipo,l,c){
  const cl=client(l.clientId)||{};
  const tpl=(S.settings.recordatorios||{})[tipo]||DEF_REC[tipo];
  const total=cRestante(c)+moraDe(c)+cobradorDe(c);
  const map={
    '{nombre}':cl.nombre||'', '{cuota}':c.n+'/'+l.cuotas.length,
    '{monto}':fmt$(cRestante(c)), '{mora}':fmt$(moraDe(c)), '{total}':fmt$(total),
    '{fecha}':dLong(c.vence), '{alias}':S.settings.alias||'',
    '{hora}':String(S.settings.horaLimite??18), '{negocio}':S.settings.nombreNegocio||''
  };
  let out=tpl; Object.entries(map).forEach(([k,v])=>out=out.split(k).join(v));
  return out;
}

/* ----- PDF nativo del contrato (jsPDF local, sin CDN) ----- */
function loadPdfLib(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve();
  if(window.__pdfLibPromise)return window.__pdfLibPromise;
  window.__pdfLibPromise=new Promise((ok,err)=>{
    const s=document.createElement('script');s.src='./jspdf.umd.min.js';
    s.onload=ok;s.onerror=()=>err(new Error('No se pudo cargar el generador de PDF'));
    document.head.appendChild(s);
  });
  return window.__pdfLibPromise;
}

async function compartirContratoPDF(l,tipo){
  const cl=client(l.clientId)||{};
  await loadPdfLib();
  const doc=buildContratoPDF(l,tipo);
  const blob=doc.output('blob');
  const fname='Contrato_'+(cl.nombre||'cliente').replace(/[^\w]+/g,'_')+'.pdf';
  const file=new File([blob],fname,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Contrato PRESTAMOS PPP',text:'Contrato de '+(cl.nombre||'')});return 'shared';}
    catch(e){if(e&&e.name==='AbortError')return 'cancel';throw e;}
  }
  // sin Web Share (ej. PC): descarga el PDF para adjuntarlo
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  return 'download';
}

/* ================= VISTA: CALENDARIO ================= */
function balanceMes(y,m){ // vista simple de caja del mes: cuánto salió y cuánto entró
  let cobrado=0,baseC=0,moraC=0,cobC=0,nCobros=0;
  S.loans.forEach(l=>{
    l.cuotas.forEach(c=>(c.pagos||[]).forEach(p=>{const d=new Date(p.t);
      if(d.getFullYear()===y&&d.getMonth()===m){
        const base=p.monto||0,mo=p.mora||0,co=p.cobrador||0;
        cobrado+=base+mo+co;baseC+=base;moraC+=mo;cobC+=co;nCobros++;
      }}));});
  let prestado=0,nNuevos=0;
  S.loans.forEach(l=>{if(!l.createdAt)return;const d=new Date(l.createdAt);
    if(d.getFullYear()===y&&d.getMonth()===m){prestado+=Math.max(0,(l.monto||0)-(l.refinanciado||0));nNuevos++;}});
  return {cobrado,baseC,moraC,cobC,nCobros,prestado,nNuevos,neto:cobrado-prestado};
}
function vCalendario(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7; // lunes=0
  const dim=new Date(y,m+1,0).getDate(),t=todayStr();
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="cday off"></div>';
  for(let d=1;d<=dim;d++){
    const f=ymd(new Date(y,m,d));
    const cob=cobrosDelDia(f);
    const tot=cob.reduce((a,x)=>a+x.c.monto,0);
    let dots='';
    if(cob.length){
      const pend=cob.filter(x=>cRestante(x.c)>0);
      if(!pend.length)dots='<span class="dot d-ok"></span>';
      else if(f<t)dots='<span class="dot d-ven"></span>';
      else if(f===t)dots='<span class="dot d-hoy"></span>';
      else dots='<span class="dot d-pen"></span>';
    }
    cells+=`<div class="cday ${f===t?'today':''} ${f===calSel?'sel':''}" data-day="${f}">
      <span>${d}</span>${cob.length?`<span class="amt">${fmt$(tot)}</span>`:''}<span class="dots">${dots}</span></div>`;
  }
  const sel=cobrosDelDia(calSel);
  const mesNom=calRef.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const mesCap=mesNom.charAt(0).toUpperCase()+mesNom.slice(1);
  const b=balanceMes(y,m);
  const netoColor=b.neto>=0?'var(--green)':'var(--red)';
  const balHTML=`<div class="list" id="cal-balance" style="padding:14px;margin-bottom:14px">
    <div class="t1" style="font-size:15px;margin-bottom:10px">📊 Balance de ${mesCap}</div>
    <div class="balgrid">
      <div><div class="bn" style="color:var(--gold)">${fmt$(b.prestado)}</div><div class="bl">prestaste · ${b.nNuevos} nuevo${b.nNuevos===1?'':'s'}</div></div>
      <div><div class="bn" style="color:var(--blue)">${fmt$(b.cobrado)}</div><div class="bl">cobraste · ${b.nCobros} cobro${b.nCobros===1?'':'s'}</div></div>
      <div><div class="bn" style="color:${netoColor}">${b.neto<0?'-':''}${fmt$(Math.abs(b.neto))}</div><div class="bl">neto ganado</div></div>
    </div>
    ${b.cobrado>0?`<div class="t2" style="margin-top:8px">Desglose cobrado: cuotas ${fmt$(b.baseC)} · mora ${fmt$(b.moraC)} · cobrador ${fmt$(b.cobC)}</div>`:''}
    ${b.cobrado===0&&b.prestado===0?'<div class="t2" style="margin-top:8px;font-style:italic">Sin movimientos en este mes.</div>':''}
  </div>`;
  return `
  <div class="calhead">
    <button data-cal="-1">‹</button>
    <div class="mname">${mesNom}</div>
    <button data-cal="1">›</button>
  </div>
  ${balHTML}
  <div class="dow">${['lu','ma','mi','ju','vi','sá','do'].map(d=>'<span>'+d+'</span>').join('')}</div>
  <div class="cgrid">${cells}</div>
  <h2>Cobros del ${dLong(calSel)} <span class="cnt">${sel.length}</span></h2>
  <div class="list">${sel.length?sel.map(({l,c})=>{
    const cl=client(l.clientId)||{nombre:'?'};const rest=cRestante(c);
    return `<div class="item" ${rest>0?`data-cobrar="${l.id}|${c.n}"`:`data-loan="${l.id}"`}>
      <div class="ava ${cl.tipo==='comercio'?'shop':''}">${esc(ini(cl.nombre))}</div>
      <div class="mid"><div class="t1">${esc(cl.nombre)}</div>
        <div class="t2">Cuota ${c.n}/${l.cuotas.length} · ${FREQ[l.frecuencia]}</div></div>
      <div class="end"><div class="m1">${fmt$(c.monto)}</div>
        <div class="m2">${rest<=0?'<span style="color:var(--green)">✓ pagada</span>':estadoCuota(c)==='vencida'?'<span style="color:var(--red)">vencida</span>':'pendiente'}</div></div>
    </div>`;}).join(''):'<div class="empty">Sin cobros este día</div>'}</div>`;
}

function formSimulador(){
  modal(`<h3>🧮 Simulador de préstamos</h3>
  <div class="hint">Calculá al toque sin cargar nada. Probá montos, intereses y cuotas.</div>
  <div class="frow">
    <div><label>Monto a prestar</label><input id="sim-monto" type="number" inputmode="decimal" placeholder="100000"></div>
    <div><label>Interés %</label><input id="sim-int" type="number" inputmode="decimal" placeholder="30"></div>
  </div>
  <div class="frow">
    <div><label>Cant. de cuotas</label><input id="sim-n" type="number" inputmode="numeric" placeholder="30"></div>
    <div><label>Frecuencia</label><select id="sim-freq">
      <option value="diaria">Diaria</option><option value="semanal">Semanal</option><option value="quincenal">Quincenal</option></select></div>
  </div>
  <div id="sim-out"></div>
  <div class="btnrow" style="margin-top:16px">
    <button class="btn sec" id="sim-limpiar">Limpiar</button>
    <button class="btn" id="sim-crear" style="background:var(--gold);color:#14110a">💵 Crear préstamo con estos datos</button>
  </div>`);
  const upd=()=>{
    const m=+$('#sim-monto').value||0,i=+$('#sim-int').value||0,n=+$('#sim-n').value||0,f=$('#sim-freq').value;
    const out=$('#sim-out');
    if(!m||!n){out.innerHTML='<div class="resume" style="margin-top:14px">Completá monto y cuotas para ver el cálculo.</div>';return;}
    const total=Math.round(m*(1+i/100)), ganancia=total-m;
    const cs=genCuotas(total,n,f,fechaPrimerCobro(f),false);
    const perDay={diaria:1,semanal:7,quincenal:14}[f]*n;
    out.innerHTML=`<div class="stats" style="grid-template-columns:repeat(3,1fr);margin:14px 0 6px">
      <div class="stat gold"><div class="lbl">Cada cuota</div><div class="val" style="font-size:18px">${fmt$(cs[0].monto)}</div></div>
      <div class="stat blue"><div class="lbl">Total a devolver</div><div class="val" style="font-size:18px">${fmt$(total)}</div></div>
      <div class="stat green"><div class="lbl">Ganancia</div><div class="val" style="font-size:18px">${fmt$(ganancia)}</div></div>
    </div>
    <div class="resume">
      ${n} cuotas ${{diaria:'diarias',semanal:'semanales',quincenal:'quincenales'}[f]} de <b>${fmt$(cs[0].monto)}</b>${cs[cs.length-1].monto!==cs[0].monto?` (la última: ${fmt$(cs[cs.length-1].monto)})`:''}<br>
      Ganás <b>${fmt$(ganancia)}</b> sobre ${fmt$(m)} prestados (interés ${i}%)<br>
      Cobrás desde ${dLong(cs[0].vence)} hasta ${dLong(cs[cs.length-1].vence)} (${perDay} días aprox.)
    </div>`;
  };
  ['sim-monto','sim-int','sim-n','sim-freq'].forEach(x=>$('#'+x).oninput=$('#'+x).onchange=upd);
  $('#sim-limpiar').onclick=()=>{['sim-monto','sim-int','sim-n'].forEach(x=>$('#'+x).value='');upd();};
  $('#sim-crear').onclick=()=>{
    const m=+$('#sim-monto').value||0,n=+$('#sim-n').value||0;
    if(!m||!n)return alert('Completá al menos monto y cantidad de cuotas.');
    if(!S.clients.length){alert('Para crear un préstamo primero necesitás un cliente. Cargá uno y volvé a usar el simulador.');return;}
    formPrestamo(null,{monto:+$('#sim-monto').value||'',interes:+$('#sim-int').value||0,n:+$('#sim-n').value||'',freq:$('#sim-freq').value});
  };
  upd();
}

      repartoTxt=`<br>Ganancia: <b>${fmt$(ganancia)}</b>`

  $$('#p-tipo button').forEach(b=>b.addEventListener('click',upd));
  $$('#p-reparto button').forEach(b=>b.onclick=()=>{
    compartir=b.dataset.v==='1';
    $$('#p-reparto button').forEach(x=>x.classList.toggle('on',x===b));
    if(compartir&&!(S.settings.socios||[]).length){
      const nom=prompt('¿Nombre del socio que gestiona este cliente?');

        const s={id:uid(),nombre:nom.trim()};S.settings.socios.push(s);saveSettings();
        $('#p-socio').insertAdjacentHTML('afterbegin',`<option value="${s.id}" selected>${esc(s.nombre)}</option>`);
      }else{compartir=false;$$('#p-reparto button').forEach(x=>x.classList.toggle('on',x.dataset.v==='0'));}
    }
    $('#p-sociobox').style.display=compartir?'':'none';upd();

  $('#p-socio').addEventListener('change',e=>{

      if(nom&&nom.trim()){
        const s={id:uid(),nombre:nom.trim()};S.settings.socios.push(s);saveSettings();
        e.target.insertAdjacentHTML('afterbegin',`<option value="${s.id}">${esc(s.nombre)}</option>`);
        e.target.value=s.id;
      }else{e.target.selectedIndex=0;}
    }
    upd();
  });
  $('#p-sociopct').addEventListener('input',upd);
  if(preset){ // valores traídos del simulador
    if(preset.monto!=null)$('#p-monto').value=preset.monto;
    if(preset.interes!=null)$('#p-int').value=preset.interes;
    if(preset.n!=null)$('#p-n').value=preset.n;
    if(preset.freq){$('#p-freq').value=preset.freq;
      if(!fechaManual)$('#p-inicio').value=fechaPrimerCobro(preset.freq);}
    upd();
  }
  $('#p-save').onclick=()=>{
    const m=+$('#p-monto').value,i=+$('#p-int').value||0,n=+$('#p-n').value,f=$('#p-freq').value,ini=$('#p-inicio').value;
    if(!m||m<=0)return alert('Poné el monto prestado');
    if(!n||n<1)return alert('Poné la cantidad de cuotas');
    if(!ini)return alert('Elegí la fecha del primer cobro');
    const total=Math.round(m*(1+i/100));
    const l={id:uid(),clientId:$('#p-cli').value,tipo,monto:m,interes:i,total,
      frecuencia:f,inicio:ini,cuotas:genCuotas(total,n,f,ini,f==='diaria'&&skipSun),
      status:'activo',createdAt:Date.now()};
    if(compartir){
      const sid=$('#p-socio').value;
      if(!sid||sid==='__nuevo__')return alert('Elegí o agregá el socio que gestiona el préstamo');
      const sp=Math.max(0,Math.min(100,+$('#p-sociopct').value||0));
      l.gestorId=sid; l.gestorPct=sp; l.gestorNombre=socioNombre(sid);
    }
    saveLoan(l);closeModal();go('prestamos',l.id);
  };
}

  $$('#rv-sun button').forEach(b=>b.onclick=()=>{skipSun=b.dataset.v==='1';
    $$('#rv-sun button').forEach(x=>x.classList.toggle('on',x===b));});
  $$('#rv-saldar button').forEach(b=>b.onclick=()=>{saldar=b.dataset.v==='1';
    $$('#rv-saldar button').forEach(x=>x.classList.toggle('on',x===b));upd();});
  const upd=()=>{
    const mm=+$('#rv-monto').value||0,i=+$('#rv-int').value||0,n=+$('#rv-n').value||0,f=$('#rv-freq').value;
    $('#rv-sundiv').style.display=f==='diaria'?'':'none';
    if(!mm||!n){$('#rv-resume').textContent='Completá monto y cuotas para ver el resumen.';return;}
    const total=Math.round(mm*(1+i/100));
    const cs=genCuotas(total,n,f,$('#rv-inicio').value||inicioDef,f==='diaria'&&skipSun);
    const refin=saldar?saldo:0, enMano=mm-refin;
    $('#rv-resume').innerHTML=`Total a devolver del nuevo: <b>${fmt$(total)}</b> · ganancia ${fmt$(total-mm)}<br>`
      +`${n} cuotas ${{diaria:'diarias',semanal:'semanales',quincenal:'quincenales'}[f]} de <b>${fmt$(cs[0].monto)}</b><br>`
      +(saldar?`Se salda el préstamo actual (${fmt$(saldo)}).<br><span style="color:var(--gold)">Plata nueva en mano para el cliente: <b>${fmt$(enMano)}</b></span>`
              :`El préstamo actual sigue abierto y se suma uno nuevo en paralelo.`)
      +(enMano<0?`<br><span style="color:var(--red)">⚠️ El monto nuevo es menor que el saldo. Revisalo.</span>`:'');
  };
  ['rv-monto','rv-int','rv-n','rv-freq','rv-inicio'].forEach(x=>$('#'+x).oninput=$('#'+x).onchange=upd);
  $('#rv-save').onclick=()=>{
    const mm=+$('#rv-monto').value,i=+$('#rv-int').value||0,n=+$('#rv-n').value,f=$('#rv-freq').value,ini=$('#rv-inicio').value;
    if(!mm||mm<=0)return alert('Poné el monto del nuevo préstamo');
    if(!n||n<1)return alert('Poné la cantidad de cuotas');
    if(!ini)return alert('Elegí la fecha del primer cobro');
    const refin=saldar?saldo:0;
    if(saldar&&mm<saldo&&!confirm('El monto nuevo ('+fmt$(mm)+') es menor que el saldo pendiente ('+fmt$(saldo)+'). El cliente no recibiría plata. ¿Continuar igual?'))return;
    const total=Math.round(mm*(1+i/100));
    const nuevo={id:uid(),clientId:v.clientId,tipo:v.tipo,monto:mm,interes:i,total,
      frecuencia:f,inicio:ini,cuotas:genCuotas(total,n,f,ini,f==='diaria'&&skipSun),
      status:'activo',createdAt:Date.now(),renovadoDe:v.id,refinanciado:refin};
    // hereda el reparto del préstamo anterior
    if(v.gestorId&&v.gestorPct){nuevo.gestorId=v.gestorId;nuevo.gestorPct=v.gestorPct;nuevo.gestorNombre=v.gestorNombre||socioNombre(v.gestorId);}
    saveLoan(nuevo);
    if(saldar){v.status='renovado';v.renovadoEn=nuevo.id;touch(v);persist();fbPush('loan',v);}
    closeModal();go('prestamos',nuevo.id);
  };
}

function formCobro(loanId,nCuota){
  const l=loan(loanId);if(!l)return;
  const c=l.cuotas.find(x=>x.n===nCuota);if(!c)return;
  const cl=client(l.clientId)||{nombre:'?'};
  const rest=cRestante(c),mora=moraDe(c),cob=cobradorDe(c),atr=diasAtraso(c);
  const yaPago=cPagadoBase(c);
  const debeTotal=rest+mora+cob;
  modal(`<h3>Cobrar cuota ${c.n}/${l.cuotas.length}</h3>
  <div class="hint">${esc(cl.nombre)} · vencía el ${dLong(c.vence)}${atr>0?` · <span style="color:var(--red)">${atr} día${atr>1?'s':''} de mora</span>`:''}
  ${yaPago>0?`<br>Cuota de ${fmt$(c.monto)} · ya cubrió ${fmt$(yaPago)} de la cuota${cTotalRecibido(c)!==yaPago?` (te pagó ${fmt$(cTotalRecibido(c))} en total, ${fmt$(cTotalRecibido(c)-yaPago)} fue a mora/cobrador)`:''}`:''}
  <br>Debe ahora: <b style="color:var(--gold)">${fmt$(debeTotal)}</b>
  <span style="font-size:11px">(cuota ${fmt$(rest)}${mora>0?' + mora '+fmt$(mora):''}${cob>0?' + cobrador '+fmt$(cob):''})</span></div>
  <label>Tipo de pago</label>
  <div class="seg" id="co-tipo">
    <button data-v="total" class="on">✅ Pagó todo (${fmt$(debeTotal)})</button>
    <button data-v="parcial">✂️ Pago parcial</button>
  </div>
  <label>Total que te pagó</label>
  <input id="co-recibido" type="number" inputmode="decimal" value="${debeTotal}">
  <div class="hint" id="co-queda"></div>
  ${mora>0?'<button class="btn sec mini" id="co-condonar" style="margin-top:8px">🤝 Condonar la mora</button>':''}
  <details id="co-adv" style="margin-top:12px">
    <summary>Ajustar el reparto a mano</summary>
    <label>A la cuota</label><input id="co-base" type="number" inputmode="decimal" value="${rest}">
    <label>A la mora</label><input id="co-mora" type="number" inputmode="decimal" value="${mora}">
    <label>Al cobrador</label><input id="co-cob" type="number" inputmode="decimal" value="${cob}">
  </details>
  <div class="resume">Total a cobrar: <b id="co-total">${fmt$(debeTotal)}</b></div>
  <label>Comprobante de transferencia (opcional · en PC podés pegarlo con Ctrl+V)</label>
  <input type="file" id="co-file" accept="image/*" style="display:none">
  <div class="btnrow" style="margin-top:0">
    <button class="btn sec" id="co-adj">📎 Adjuntar comprobante</button>
    <button class="btn sec" id="co-alias">📋 Copiar alias</button>
  </div>
  <button class="btn green" id="co-save" style="margin-top:16px">✅ Registrar cobro</button>`);
  let moraACobrar=mora;
  // reparte lo que te pagó: primero la mora, después el cobrador, y lo que sobra a la cuota
  const repartir=r=>{
    r=Math.max(0,r);
    const m=Math.min(r,moraACobrar); r-=m;
    const cb=Math.min(r,cob); r-=cb;
    return {base:r,mora:m,cobrador:cb};
  };
  const pintarDesglose=()=>{
    const base=+$('#co-base').value||0,m=+$('#co-mora').value||0,cb=+$('#co-cob').value||0;
    $('#co-total').textContent=fmt$(base+m+cb);
    const quedaCuota=Math.max(0,rest-base), quedaMora=Math.max(0,moraACobrar-m), quedaCob=Math.max(0,cob-cb);
    const debeDespues=quedaCuota+quedaMora+quedaCob, q=$('#co-queda');
    const partes=[];
    if(m>0)partes.push(`mora ${fmt$(m)}`);
    if(cb>0)partes.push(`cobrador ${fmt$(cb)}`);
    if(base>0)partes.push(`cuota ${fmt$(base)}`);
    if(base+m+cb<=0){q.innerHTML='';return;}
    let txt=`Se aplica a: ${partes.join(' · ')}`;
    if(debeDespues>0){
      txt+=`<br>⚠️ Le queda debiendo <b style="color:var(--orange)">${fmt$(debeDespues)}</b>`
        +(quedaCuota>0?` (${fmt$(quedaCuota)} de cuota${quedaMora>0?` + ${fmt$(quedaMora)} de mora`:''}). La cuota sigue abierta y sumando mora sobre su valor completo (${fmt$(c.monto)}).`:'.');
    }else{
      txt+='<br>✅ Con este pago la cuota queda <b style="color:var(--green)">saldada</b>.';
    }
    q.innerHTML=txt;
  };
  const aplicarRecibido=()=>{
    const r=repartir(+$('#co-recibido').value||0);
    $('#co-base').value=r.base; $('#co-mora').value=r.mora; $('#co-cob').value=r.cobrador;
    pintarDesglose();
  };
  $$('#co-tipo button').forEach(b=>b.onclick=()=>{
    $$('#co-tipo button').forEach(x=>x.classList.toggle('on',x===b));
    if(b.dataset.v==='total')$('#co-recibido').value=rest+moraACobrar+cob;
    else{$('#co-recibido').value='';$('#co-recibido').focus();}
    aplicarRecibido();
  });
  $('#co-recibido').oninput=()=>{
    aplicarRecibido();
    const r=+$('#co-recibido').value||0, esTotal=r>=rest+moraACobrar+cob;
    $$('#co-tipo button').forEach(b=>b.classList.toggle('on',b.dataset.v===(esTotal?'total':'parcial')));
  };
  ['co-base','co-mora','co-cob'].forEach(x=>$('#'+x).oninput=()=>{ // reparto manual: el total sigue la suma
    $('#co-recibido').value=(+$('#co-base').value||0)+(+$('#co-mora').value||0)+(+$('#co-cob').value||0);
    pintarDesglose();
  });
  const cond=$('#co-condonar');if(cond)cond.onclick=()=>{
    moraACobrar=0; $('#co-mora').value=0;
    $('#co-recibido').value=rest+cob; aplicarRecibido();
    cond.textContent='🤝 Mora condonada'; cond.disabled=true;
  };
  pintarDesglose();
  let coFile=null;
  $('#co-adj').onclick=()=>$('#co-file').click();
  $('#co-file').onchange=e=>{coFile=e.target.files[0]||null;
    $('#co-adj').textContent=coFile?'📎 ✓ '+(coFile.name.length>18?coFile.name.slice(0,18)+'…':coFile.name):'📎 Adjuntar comprobante';};
  window.__coPaste=f=>{coFile=f;const b=$('#co-adj');if(b)b.textContent='📎 ✓ Imagen pegada';};
  $('#co-alias').onclick=e=>copiarAlias(e.currentTarget);
  $('#co-save').onclick=async()=>{
    const base=+$('#co-base').value||0,m=+$('#co-mora').value||0,cb=+$('#co-cob').value||0;
    if(base+m+cb<=0)return alert('El monto debe ser mayor a 0');
    if(base>rest&&!confirm('Estás cobrando más que lo que resta de la cuota. ¿Continuar?'))return;
    const pago={t:Date.now(),monto:base,mora:m,cobrador:cb};
    if(coFile){
      const data=await compressImage(coFile);
      if(data){
        const d={id:uid(),clientId:l.clientId,nombre:'Comprobante cuota '+c.n+'/'+l.cuotas.length+' · '+dShort(todayStr()),tipo:'image/jpeg',data,createdAt:Date.now()};
        saveDoc(d);pago.comprobante=d.id;
      }else alert('No se pudo procesar la imagen del comprobante. El cobro se registra igual.');
    }
    c.pagos=c.pagos||[];c.pagos.push(pago);
    saveLoan(l);closeModal();render();
    const queda=cRestante(c);
    const tel=(cl.telefono||'').replace(/\D/g,'');
    const aviso=queda>0
      ? `Pago parcial registrado ✅\nQuedan ${fmt$(queda)} de esta cuota (la mora sigue corriendo).\n\n¿Enviar comprobante por WhatsApp?`
      : 'Cobro registrado ✅\n¿Enviar comprobante por WhatsApp?';
    if(tel&&confirm(aviso)){
      const msg=`Hola ${cl.nombre}! Te confirmamos el pago de ${fmt$(base+m+cb)} (cuota ${c.n}/${l.cuotas.length}). `+
        (queda>0?`Queda pendiente ${fmt$(queda)} de esta cuota, que sigue generando mora hasta cancelarse. `:'')+
        `Saldo restante del préstamo: ${fmt$(loanRestante(l))}. ¡Gracias! — ${S.settings.nombreNegocio}`;
      window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(msg),'_blank');
    }else if(!tel&&queda>0)alert(`Pago parcial registrado ✅\nQuedan ${fmt$(queda)} de esta cuota (la mora sigue corriendo).`);
  };
}

/* ================= DOCUMENTOS: subida + compresión ================= */
function compressImage(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1100;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.72,data=cv.toDataURL('image/jpeg',q);
      while(data.length>880000&&q>0.3){q-=0.12;data=cv.toDataURL('image/jpeg',q);}
      res(data);
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
async function subirDocs(clientId,files){
  for(const f of files){
    let data=null,tipo=f.type;
    if(f.type.startsWith('image/')){data=await compressImage(f);tipo='image/jpeg';}
    else if(f.type==='application/pdf'){
      if(f.size>880000){alert(f.name+': el PDF supera 850 KB y no se puede sincronizar. Sacale una foto en su lugar.');continue;}
      data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    }else{alert(f.name+': formato no soportado (solo imágenes o PDF).');continue;}
    if(!data){alert('No se pudo procesar '+f.name);continue;}
    saveDoc({id:uid(),clientId,nombre:f.name,tipo,data,createdAt:Date.now()});
  }
  render();
}

const AUTH_KEY=LS+'-auth';
let UNLOCKED=false;
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){return null;}}
async function hashPass(pass,salt){
  if(window.crypto&&crypto.subtle){
    try{
      const enc=new TextEncoder();
      const key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
      return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  // fallback para contextos sin crypto.subtle (ej. abrir el archivo sin https)
  let h=2166136261;const s=salt+'|'+pass;let out='';
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  for(let r=0;r<8;r++){h=Math.imul(h^(h>>>13),0x5bd1e995);out+=(h>>>0).toString(16).padStart(8,'0');}
  return out;
}
async function setAuth(user,pass){
  const salt=uid()+uid();
  localStorage.setItem(AUTH_KEY,JSON.stringify({user,salt,hash:await hashPass(pass,salt)}));
}
async function checkAuth(user,pass){
  const a=getAuth();if(!a)return false;
  return a.user.toLowerCase()===user.toLowerCase()&&a.hash===await hashPass(pass,a.salt);
}

  else if(UNLOCKED&&hiddenAt&&Date.now()-hiddenAt>5*60000)showLock();
});

/* ================= BACKUP ================= */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='prestacontrol-backup-'+todayStr()+'.json';a.click();
}
function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const p=JSON.parse(fr.result);
    if(!p.clients||!p.loans)throw 0;
    if(!confirm(`El archivo tiene ${p.clients.length} clientes y ${p.loans.length} préstamos. ¿Importar? (se combina con lo actual)`))return;
    [['client',p.clients],['loan',p.loans],['doc',p.docs||[]]].forEach(([k,arr])=>arr.forEach(o=>{
      const tgt=k==='client'?S.clients:k==='loan'?S.loans:S.docs;
      const i=tgt.findIndex(x=>x.id===o.id);
      if(i<0)tgt.push(o);else if((o.updatedAt||0)>(tgt[i].updatedAt||0))tgt[i]=o;
      if(k==='doc')idbPut(o);
      fbPush(k,o);
    }));
    persist();render();alert('Importado ✅');
  }catch(e){alert('Archivo inválido');}};
  fr.readAsText(file);
}

/* ================= BINDINGS ================= */
function bindView(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-cli]').forEach(b=>b.onclick=()=>go('clientes',b.dataset.cli));
  $$('[data-loan]').forEach(b=>b.onclick=()=>go('prestamos',b.dataset.loan));
  $$('[data-rep]').forEach(b=>b.onclick=()=>{const k=b.dataset.rep;
    repartoOpen.has(k)?repartoOpen.delete(k):repartoOpen.add(k);render();});
  {const rb=$('#rec-btn');if(rb)rb.onclick=()=>{recFilter='hoy';formRecordatorios();};
   const ab=$('#alias-btn');if(ab)ab.onclick=()=>copiarAlias(ab);
   const sb=$('#sim-btn');if(sb)sb.onclick=()=>formSimulador();
   const gb=$('#gan-btn');if(gb)gb.onclick=()=>formGanancia();}
  $$('[data-cobrar]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const[id,n]=b.dataset.cobrar.split('|');formCobro(id,+n);});
  $$('[data-fecha]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const[id,n]=b.dataset.fecha.split('|');formFecha(id,+n);});
  $$('[data-reparto]').forEach(b=>b.onclick=()=>formReparto(b.dataset.reparto));
  $$('[data-lf]').forEach(b=>b.onclick=()=>{loanFilter=b.dataset.lf;render();});
  $$('[data-vs]').forEach(b=>b.onclick=()=>{vencSort=b.dataset.vs;render();});
  $$('[data-cal]').forEach(b=>b.onclick=()=>{calRef=new Date(calRef.getFullYear(),calRef.getMonth()+ +b.dataset.cal,1);render();});
  $$('[data-day]').forEach(b=>b.onclick=()=>{calSel=b.dataset.day;render();});
  $$('[data-edit-cli]').forEach(b=>b.onclick=()=>formCliente(b.dataset.editCli));
  $$('[data-new-loan]').forEach(b=>b.onclick=()=>formPrestamo(b.dataset.newLoan));
  $$('[data-wa]').forEach(b=>b.onclick=()=>{
    const cid=DETAIL,deuda=clienteDeuda(cid),cl=client(cid);
    const pend=cobrosVencidos().filter(x=>x.l.clientId===cid);
    let msg=`Hola ${cl.nombre}! Te escribimos de ${S.settings.nombreNegocio}. `;
    msg+=pend.length?`Tenés ${pend.length} cuota${pend.length>1?'s':''} vencida${pend.length>1?'s':''} por un total de ${fmt$(pend.reduce((a,x)=>a+cRestante(x.c)+moraDe(x.c)+cobradorDe(x.c),0))} (incluye mora). ¿Coordinamos el pago?`
      :deuda>0?`Te recordamos tu saldo pendiente de ${fmt$(deuda)}. ¡Gracias!`:`¡Gracias por estar al día! 🙌`;
    window.open('https://wa.me/'+b.dataset.wa+'?text='+encodeURIComponent(msg),'_blank');});
  $$('[data-del-cli]').forEach(b=>b.onclick=()=>{
    const c=client(b.dataset.delCli);if(!c)return;
    const nl=S.loans.filter(l=>l.clientId===c.id).length;
    if(!confirm(`¿Eliminar a ${c.nombre}?${nl?` Se borrarán también sus ${nl} préstamo(s) y documentos.`:''}`))return;
    S.loans.filter(l=>l.clientId===c.id).forEach(l=>delEntity('loan',l));
    S.docs.filter(d=>d.clientId===c.id).forEach(d=>delEntity('doc',d));
    delEntity('client',c);go('clientes');});
  $$('[data-contrato]').forEach(b=>b.onclick=()=>generarContrato(b.dataset.contrato));
  $$('[data-tyc]').forEach(b=>b.onclick=()=>enviarTyC(b.dataset.tyc));
  $$('[data-renovar]').forEach(b=>b.onclick=()=>formRenovar(b.dataset.renovar));
  $$('[data-fb]').forEach(b=>b.onclick=()=>window.open(b.dataset.fb,'_blank'));
  $$('[data-del-loan]').forEach(b=>b.onclick=()=>{
    const l=loan(b.dataset.delLoan);if(!l)return;
    if(!confirm('¿Eliminar este préstamo y todo su historial de pagos?'))return;
    delEntity('loan',l);go('prestamos');});
  $$('[data-cancel-loan]').forEach(b=>b.onclick=()=>{
    const l=loan(b.dataset.cancelLoan);if(!l)return;
    if(!confirm('¿Marcar el préstamo como cancelado? Dejará de aparecer en cobros y vencidos.'))return;
    l.status='cancelado';touch(l);persist();fbPush('loan',l);render();});
  $$('[data-doc]').forEach(b=>b.onclick=()=>verDoc(b.dataset.doc));

  const cq=$('#cliq');if(cq){cq.oninput=()=>{cliQ=cq.value;
    const list=cq.closest('#view');render();const nq=$('#cliq');nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);};}
  const ad=$('#adddoc');if(ad){ad.onclick=()=>$('#docfile').click();
    $('#docfile').onchange=e=>{if(e.target.files.length)subirDocs(DETAIL,[...e.target.files]);};}

  // ajustes
  const sv=$('#set-save');
  if(sv){
    let moratipo=S.settings.mora.tipo,porDia=S.settings.mora.porDia;
    $$('#set-moratipo button').forEach(b=>b.onclick=()=>{moratipo=b.dataset.v;
      $$('#set-moratipo button').forEach(x=>x.classList.toggle('on',x===b));});
    $$('#set-morapordia button').forEach(b=>b.onclick=()=>{porDia=b.dataset.v==='1';
      $$('#set-morapordia button').forEach(x=>x.classList.toggle('on',x===b));});
    $$('#set-dias button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    sv.onclick=()=>{
      S.settings.nombreNegocio=$('#set-nombre').value.trim()||'Mi Negocio';
      S.settings.moneda=$('#set-moneda').value.trim()||'$';
      S.settings.alias=$('#set-alias').value.trim();
      S.settings.capitalPropio=Math.max(0,+$('#set-capital').value||0);
      S.settings.mora={tipo:moratipo,valor:+$('#set-moraval').value||0,porDia};
      S.settings.diasNoLaborables=$$('#set-dias button.on').map(b=>+b.dataset.v);
      S.settings.horaLimite=+$('#set-hora').value;
      S.settings.cobrador={monto:+$('#set-cobmonto').value||0,dias:+$('#set-cobdias').value||3};
      S.settings.recordatorios={
        hoy:$('#set-rec-hoy').value.trim()||DEF_REC.hoy,
        manana:$('#set-rec-manana').value.trim()||DEF_REC.manana,
        vencido:$('#set-rec-vencido').value.trim()||DEF_REC.vencido};
      saveSettings();render();alert('Ajustes guardados ✅');};
    const rr=$('#set-rec-reset');if(rr)rr.onclick=()=>{
      $('#set-rec-hoy').value=DEF_REC.hoy;$('#set-rec-manana').value=DEF_REC.manana;$('#set-rec-vencido').value=DEF_REC.vencido;};
    const sa=$('#socio-add');if(sa){sa.onclick=()=>{
      const nom=$('#socio-nombre').value.trim();
      if(!nom)return alert('Escribí el nombre del socio');
      S.settings.socios=S.settings.socios||[];
      S.settings.socios.push({id:uid(),nombre:nom});
      saveSettings();render();};}
    $$('[data-del-socio]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delSocio, usados=S.loans.filter(l=>l.gestorId===id).length;
      if(!confirm(usados?`Este socio tiene ${usados} préstamo(s) asignado(s). Esos préstamos conservan su nombre y reparto, pero no podrás elegirlo en préstamos nuevos. ¿Eliminarlo de la lista?`:'¿Eliminar este socio de la lista?'))return;
      S.settings.socios=(S.settings.socios||[]).filter(s=>s.id!==id);
      saveSettings();render();});
    $('#fb-conectar').onclick=()=>{
      const raw=$('#fb-config').value.trim(),code=$('#fb-code').value.trim();
      if(!raw||!code)return alert('Pegá la configuración de Firebase y elegí un código de negocio.');
      let cfg;
      try{
        const m=raw.match(/\{[\s\S]*\}/);if(!m)throw 0;
        cfg=(new Function('return ('+m[0]+')'))();
        if(!cfg.projectId||!cfg.apiKey)throw 0;
      }catch(e){return alert('La configuración no es válida. Pegá el bloque firebaseConfig completo, con las llaves { }.');}
      localStorage.setItem(LS+'-fb',JSON.stringify({config:cfg,code}));
      fbConnect();alert('Conectando… El estado se actualiza arriba a la derecha.');render();};
    const off=$('#fb-off');if(off)off.onclick=()=>{if(confirm('¿Desconectar la sincronización en este dispositivo? Los datos locales no se borran.')){fbDisconnect();render();}};
    $('#sec-change').onclick=formCambiarClave;
    $('#sec-lock').onclick=showLock;
    $('#bk-export').onclick=exportar;
    $('#bk-import').onclick=()=>$('#bk-file').click();
    $('#bk-file').onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);};
    $('#wipe').onclick=()=>{
      if(!confirm('⚠️ Se borrarán TODOS los datos guardados en este dispositivo. ¿Continuar?'))return;
      if(!confirm('¿Seguro? Esta acción no se puede deshacer (si tenés sincronización, los datos siguen en la nube).'))return;
      localStorage.removeItem(LS);
      try{if(_idb)_idb.close();indexedDB.deleteDatabase('prestacontrol');}catch(e){}
      location.reload();};
    const bu=$('#buscar-upd');if(bu)bu.onclick=async()=>{
      if(!('serviceWorker' in navigator))return alert('No disponible en este navegador.');
      const reg=await navigator.serviceWorker.getRegistration();
      if(!reg)return alert('Recargá la página e intentá de nuevo.');
      bu.textContent='⏳ Buscando…';bu.disabled=true;
      let nueva=false;
      reg.addEventListener('updatefound',()=>{nueva=true;});
      try{await reg.update();}catch(e){}
      setTimeout(()=>{
        if(nueva||reg.waiting){alert('¡Hay una versión nueva! La app se va a recargar para instalarla.');location.reload();}
        else{alert('Ya estás en la última versión (v'+APP_VER+') ✅');bu.textContent='🔁 Buscar actualización';bu.disabled=false;}
      },1500);
    };
  }
}

/* ================= INIT ================= */
applyBiz();
if(getAuth()&&sessionStorage.getItem('pc-unlocked')==='1')unlockApp();
else showLock();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
